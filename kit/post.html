<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(../tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(../tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(../tools/fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:S;font-style:italic;src:url(../tools/fonts/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:P;font-weight:500;src:url(../tools/fonts/ibm-plex-mono-latin-500-normal.woff2)}
:root{--blue:#2f6bff;--ink:#0d0f14;--white:#f5f7fb}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ink)}
#c{position:relative;overflow:hidden;background:var(--ink);color:var(--white);font-family:M}
#photo{position:absolute;inset:0;background-size:cover;background-position:center}
#shade{position:absolute;inset:0}
#top{position:absolute;left:72px;right:72px;display:flex;align-items:center;justify-content:space-between}
#logo{display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;letter-spacing:-.02em}
#logo img{width:54px;height:54px}
.chip{font-family:P;font-weight:500;font-size:22px;letter-spacing:.08em;padding:12px 18px 10px;border:2px solid rgba(245,247,251,.55);border-radius:999px;white-space:nowrap}
.chip.b{background:var(--blue);border-color:var(--blue);color:#fff}
#txt{position:absolute;left:72px;right:72px}
#kick{font-family:P;font-weight:500;font-size:26px;letter-spacing:.1em;color:#9db8ff;margin-bottom:22px;text-transform:uppercase}
#h{font-weight:800;letter-spacing:-.035em;line-height:.98;text-transform:none}
#h em{font-family:S;font-style:italic;font-weight:400;color:var(--blue);letter-spacing:-.01em;font-size:1.08em;line-height:.9;text-shadow:0 0 40px rgba(47,107,255,.35)}
#sub{margin-top:26px;font-weight:500;font-size:34px;line-height:1.3;color:rgba(245,247,251,.86);max-width:820px}
#bot{position:absolute;left:72px;right:72px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
#cta{font-weight:800;font-size:34px;letter-spacing:-.01em;background:var(--white);color:var(--ink);padding:20px 30px 18px;border-radius:14px;white-space:nowrap}
#url{font-family:P;font-weight:500;font-size:26px;letter-spacing:.06em;color:rgba(245,247,251,.8);text-align:right;line-height:1.5;white-space:nowrap}
#url b{color:#fff;font-weight:500}
#grain{position:absolute;inset:-50px;opacity:.10;mix-blend-mode:overlay;background:url(grain.png)}
#phone{position:absolute}
#phone .f{position:absolute;inset:0;border-radius:64px;background:#0a0b0f;box-shadow:0 0 0 3px #2a2f3a,0 40px 120px rgba(0,0,0,.6),0 0 90px rgba(47,107,255,.25)}
#phone img{position:absolute;left:16px;top:16px;right:16px;bottom:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:cover;object-position:top;border-radius:50px}
</style></head><body>
<div id="c">
  <div id="photo"></div><div id="shade"></div>
  <div id="phone" hidden><div class="f"></div><img id="scr"></div>
  <div id="grain"></div>
  <div id="top"><div id="logo"><img src="mark.png">ProTeam</div><div id="chip" class="chip"></div></div>
  <div id="txt"><div id="kick"></div><div id="h"></div><div id="sub"></div></div>
  <div id="bot"><div id="cta"></div><div id="url"></div></div>
</div>
<script>
// window.build(spec) recibe {w,h,photo,pos,shade,chip,chipBlue,kick,h,hs,sub,cta,url,txtTop,txtBottom,phone:{src,x,y,w,rot}}
window.build = (s) => {
  const c = document.getElementById('c'); c.style.width = s.w + 'px'; c.style.height = s.h + 'px';
  const P = document.getElementById('photo'); P.style.backgroundImage = s.photo ? `url(${s.photo})` : 'none'; P.style.backgroundPosition = s.pos || 'center';
  document.getElementById('shade').style.background = s.shade || 'linear-gradient(180deg,rgba(13,15,20,.92) 0%,rgba(13,15,20,.55) 32%,rgba(13,15,20,0) 55%,rgba(13,15,20,.15) 72%,rgba(13,15,20,.92) 100%)';
  const pad = s.h > 1500 ? 170 : 64;
  document.getElementById('top').style.top = pad + 'px';
  const ch = document.getElementById('chip'); ch.textContent = s.chip || ''; ch.style.display = s.chip ? '' : 'none'; ch.className = 'chip' + (s.chipBlue ? ' b' : '');
  document.getElementById('kick').textContent = s.kick || '';
  const H = document.getElementById('h'); H.innerHTML = s.hl; H.style.fontSize = (s.hs || 112) + 'px';
  document.getElementById('sub').textContent = s.sub || '';
  const T = document.getElementById('txt');
  if (s.txtBottom != null) { T.style.bottom = s.txtBottom + 'px'; T.style.top = 'auto'; } else T.style.top = (s.txtTop || pad + 120) + 'px';
  const B = document.getElementById('bot'); B.style.bottom = (s.h > 1500 ? 300 : 64) + 'px';
  const ct = document.getElementById('cta'); ct.textContent = s.cta || ''; ct.style.display = s.cta ? '' : 'none';
  document.getElementById('url').innerHTML = s.url ?? '<b>pro-team.app</b><br>Lista de espera · 27.11 · 23:59';
  const ph = document.getElementById('phone');
  if (s.phone) { ph.hidden = false; Object.assign(ph.style, { left: s.phone.x + 'px', top: s.phone.y + 'px', width: s.phone.w + 'px', height: s.phone.w * 2.17 + 'px', transform: `rotate(${s.phone.rot || 0}deg)` }); document.getElementById('scr').src = s.phone.src; }
  else ph.hidden = true;
  return document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))).then(() => true);
};
</script></body></html>
