<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PM;font-weight:500;src:url(../fonts/ibm-plex-mono-latin-500-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// Pantalla «Despierta, entrenador»: texto verde que se escribe solo en un ordenador a oscuras.
//   ?w=1920&h=1080&fx=0  -> para ponerla en tu monitor y grabarla (sin efectos)
//   ?w=1080&h=1920&fx=1  -> inserto vertical para el montaje (brillo, rayas, parpadeo)
const Q = new URLSearchParams(location.search), W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, FX = Q.get('fx') === '1';
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d');
const V = H > W;                         // vertical
const SIZE = V ? 80 : 54, X = V ? 80 : 110, Y = V ? 720 : 150;
// [inicio, texto, ritmo (s/letra), fin]
const LINES = [
  [0.6, 'Despierta, entrenador…', .085, 4.6],
  [5.2, 'El sistema de 1995 te tiene atrapado…', .07, 10.6],
  [11.2, 'Sigue al balón blanco.', .08, 14.8],
  [15.4, 'Toc, toc, entrenador.', .055, 18.6],
];
const rnd = (i) => { const x = Math.sin(i * 91.7 + 13.1) * 43758.5453; return x - Math.floor(x); };
function shown(line, t) {   // letras visibles con ritmo irregular, como alguien tecleando
  const [t0, txt, sp] = line; let acc = t0, n = 0;
  for (let i = 0; i < txt.length; i++) { acc += sp * (.55 + rnd(i + t0 * 10) * .9) + (txt[i - 1] === ',' || txt[i - 1] === '…' ? sp * 4 : 0); if (t >= acc) n = i + 1; else break; }
  return n;
}
window.chars = [];   // tiempos de cada tecla, para el sonido
LINES.forEach((l) => { const [t0, txt, sp] = l; let acc = t0; for (let i = 0; i < txt.length; i++) { acc += sp * (.55 + rnd(i + t0 * 10) * .9) + (txt[i - 1] === ',' || txt[i - 1] === '…' ? sp * 4 : 0); if (txt[i] !== ' ') chars.push(+acc.toFixed(3)); } });
window.frame = (t) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.font = `500 ${SIZE}px PM`; g.textBaseline = 'top';
  let cx = X, cy = Y, cursorOn = Math.floor(t * 2.2) % 2 === 0, active = null;
  for (const l of LINES) if (t >= l[0] - .6 && t < l[3]) active = l;
  if (active) {
    const n = shown(active, t), txt = active[1].slice(0, n);
    // en vertical, partir en líneas que quepan
    const words = txt.split(' '), rows = []; let row = '';
    const maxW = W - 2 * X;
    for (const w of words) { const tr = row ? row + ' ' + w : w; if (g.measureText(tr).width > maxW && row) { rows.push(row); row = w; } else row = tr; }
    rows.push(row);
    g.fillStyle = '#5dff9b';
    if (FX) { g.shadowColor = 'rgba(61,255,143,.85)'; g.shadowBlur = 22; }
    rows.forEach((r, i) => g.fillText(r, X, Y + i * SIZE * 1.3));
    cx = X + g.measureText(rows[rows.length - 1]).width + 8; cy = Y + (rows.length - 1) * SIZE * 1.3;
    if (n < active[1].length) cursorOn = true;     // mientras escribe, el cursor no parpadea
  }
  if (t < 19.6 && cursorOn) { g.fillStyle = '#5dff9b'; g.fillRect(cx, cy + SIZE * .08, SIZE * .55, SIZE * .95); }
  g.shadowBlur = 0;
  // 18,6–19,6: la señal se corta (franjas y destello)
  if (t > 18.6 && t < 19.6) {
    const k = (t - 18.6); for (let i = 0; i < 9; i++) { const y = rnd(i + Math.floor(t * 25)) * H; g.fillStyle = `rgba(93,255,155,${.25 * (1 - k)})`; g.fillRect(0, y, W, 4 + rnd(i * 3) * 30); }
    if (k > .75) { g.fillStyle = `rgba(220,255,235,${(k - .75) * 3})`; g.fillRect(0, H / 2 - 2, W, 4); }
  }
  if (FX) {   // rayas y viñeta de tubo
    g.fillStyle = 'rgba(0,0,0,.28)'; for (let y = 0; y < H; y += 5) g.fillRect(0, y, W, 2);
    const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.7)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  return true;
};
document.fonts.load('500 40px PM').then(() => { window.ready = true; });
</script></body></html>
