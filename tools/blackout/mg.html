<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:500;src:url(../fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(../fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(../fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:Mono;font-weight:500;src:url(../fonts/ibm-plex-mono-latin-500-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(../fonts/instrument-serif-latin-400-italic.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050608}
#s{position:absolute;inset:0;overflow:hidden;font-family:M;color:#f2f3f5;background:#050608}
.a{position:absolute}
.ph{position:absolute;border-radius:58px;background:#0b0d11;border:3px solid #23272f;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 10px #0e1015;overflow:hidden}
.ph img{position:absolute;left:0;width:100%}
.tag{font-family:Mono;font-size:28px;letter-spacing:.22em;text-transform:uppercase;color:#8a90a0}
.lbl{font-family:Mono;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#9aa0ad;background:rgba(10,12,16,.75);padding:8px 14px;border-radius:8px}
</style></head><body><div id="s"></div>
<script>
// Motion graphics de Blackout Friday. Cada Reel es una función R[id](t) que pinta el fotograma t (segundos).
const S = document.getElementById('s');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const ez = (x) => x * x * (3 - 2 * x), eo = (x) => 1 - Math.pow(1 - x, 3), ei = (x) => x * x * x;
const BLUE = '#3d7bff', RED = '#ff3b4a', MUTED = '#8a90a0', WHITE = '#f2f3f5';
const Q = new URLSearchParams(location.search), DAYS = Q.get('d') || '';
function T(s, o = {}) { // texto: {x,y,w,size,weight,color,font,align,a,dy,ls,lh}
  const a = o.a ?? 1; if (a <= 0) return '';
  return `<div class="a" style="left:${o.x ?? 90}px;top:${(o.y ?? 0) + (o.dy ?? 0)}px;width:${o.w ?? 900}px;font-family:${o.font ?? 'M'};font-size:${o.size ?? 80}px;font-weight:${o.weight ?? 800};${o.font === 'Serif' ? 'font-style:italic;' : ''}color:${o.color ?? WHITE};text-align:${o.align ?? 'left'};letter-spacing:${o.ls ?? (o.font === 'Mono' ? '.04em' : '-.035em')};line-height:${o.lh ?? 1.02};opacity:${a}">${s}</div>`; }
// aparece subiendo y se va
function TT(t, t0, t1, s, o = {}) { const i = eo(seg(t, t0, t0 + .35)), out = 1 - seg(t, t1 - .25, t1); if (t < t0 || t > t1) return '';
  return T(s, { ...o, a: i * out, dy: (1 - i) * 40 }); }
// palabra a palabra
function TW(t, t0, t1, s, o = {}, per = .12) { if (t < t0 || t > t1) return ''; const out = 1 - seg(t, t1 - .25, t1);
  const w = s.split(' ').map((x, k) => { const p = eo(seg(t, t0 + k * per, t0 + k * per + .3)); return `<span style="display:inline-block;opacity:${p};transform:translateY(${(1 - p) * 30}px)">${x}</span>`; }).join(' ');
  return T(w, { ...o, a: out }); }
// móvil con captura real. o: {x,y,w,scroll(0..1 de la parte oculta),zoom,ox,oy,rot,a}
function PH(img, o = {}) { const w = o.w ?? 560, h = w * 2410 / 1112 * (o.crop ?? 1), a = o.a ?? 1; if (a <= 0) return '';
  const ih = w * 2410 / 1112, z = o.zoom ?? 1, sy = (ih * z - h) * (o.scroll ?? 0);
  return `<div class="ph" style="left:${o.x ?? (1080 - w) / 2}px;top:${o.y ?? 300}px;width:${w}px;height:${h}px;opacity:${a};transform:rotate(${o.rot ?? 0}deg) scale(${o.s ?? 1});transform-origin:50% 50%">
    <img src="../app/${img}.jpg" style="top:${-sy}px;width:${w * z}px;left:${-(w * z - w) * (o.ox ?? .5)}px">${o.inner ?? ''}</div>`; }
// círculo a mano (rotulador) en coordenadas de pantalla
function CIRC(t, t0, x, y, w, h, col = BLUE, sw = 7) { const p = ez(seg(t, t0, t0 + .55)); if (t < t0) return '';
  const rx = w / 2, ry = h / 2, cx = x + rx + 10, cy = y + ry + 10, pts = [];
  for (let i = 0; i <= 64; i++) { const a = -2.2 + i / 64 * (Math.PI * 2 + .5), r = 1 + Math.sin(i * .7) * .02 + (i / 64) * .05; pts.push(`${(cx + Math.cos(a) * rx * r).toFixed(1)},${(cy + Math.sin(a) * ry * r).toFixed(1)}`); }
  return `<svg class="a" style="left:${x - 10}px;top:${y - 10}px;overflow:visible" width="${w + 40}" height="${h + 40}"><polyline points="${pts.map(q => { const [a, b] = q.split(','); return `${a - x + 10},${b - y + 10}`; }).join(' ')}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/></svg>`; }
function UL(t, t0, x, y, w, col = BLUE) { const p = ez(seg(t, t0, t0 + .4)); if (t < t0) return '';
  return `<svg class="a" style="left:${x}px;top:${y}px;overflow:visible" width="${w}" height="20"><path d="M0 10 C ${w * .3} 4, ${w * .6} 16, ${w} 8" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/></svg>`; }
const MARK = '<img src="../proteam-mark.webp" style="width:58px;height:58px;vertical-align:middle;margin-right:16px">';
function LOGO(x, y, a = 1, size = 44) { return `<div class="a" style="left:${x}px;top:${y}px;opacity:${a};font-weight:800;font-size:${size}px;letter-spacing:-.02em;display:flex;align-items:center">${MARK}ProTeam</div>`; }
const EJ = (y = 1640, a = 1) => `<div class="a lbl" style="left:90px;top:${y}px;opacity:${a}">Datos de ejemplo</div>`;
// cierre común con la cuenta atrás
function CIERRE(t, t0, o = {}) { if (t < t0) return ''; const u = t - t0, a = eo(seg(u, 0, .5)), b = eo(seg(u, .5, 1.1)), red = o.red;
  const d = DAYS === '0' ? 'Hoy, hasta las 23:59' : DAYS === '1' ? 'Queda 1 día' : `Quedan ${DAYS} días`;
  return `<div class="a" style="inset:0;background:#050608;opacity:${cl(u / .25)}"></div>` +
    T(d, { y: 540, size: 34, font: 'Mono', weight: 500, color: red ? '#ff7d88' : MUTED, a, ls: '.18em' }) +
    T('Apaga el caos.', { y: 610, size: 98, w: 960, a, dy: (1 - a) * 30 }) +
    T('Enciende tu equipo.', { y: 714, size: 98, w: 960, color: red ? RED : BLUE, a, dy: (1 - a) * 30 }) +
    T('6 meses gratis para tu primer equipo', { y: 880, w: 960, size: 60, font: 'Serif', weight: 400, color: '#d4d7de', a: b, ls: '0' }) +
    T('Sin tarjeta · hasta el 27 nov, 23:59', { y: 970, w: 960, size: 30, font: 'Mono', weight: 500, color: MUTED, a: b, ls: '.06em' }) +
    LOGO(90, 1600, a) + T('pro-team.app', { x: 590, y: 1612, w: 400, size: 30, font: 'Mono', weight: 500, color: MUTED, align: 'right', a }); }
const BG = (c = '#050608') => `<div class="a" style="inset:0;background:${c}"></div>`;
const R = {};

// ── r03 · El Excel se apaga (sin voz) ─────────────────────────────
R.r03 = { dur: 15, render(t) { let h = BG();
  const cols = 6, rows = 13, cw = 150, ch = 64, x0 = 90, y0 = 330;
  const names = ['Jugador', 'Lun', 'Mar', 'Jue', 'Sáb', 'Conv.', 'Pau', 'Nico', 'Marc', 'Leo', 'Iker', 'Hugo', 'Dani', 'Álex', 'Raúl', 'Joan', 'Biel', 'Pol'];
  const marks = ['✓', '—', '?', '✓', '✓', '?', '—', '✓'];
  const zoom = 1 + ez(seg(t, 0, 7)) * .08;
  h += `<div class="a" style="left:0;top:0;width:1080px;height:1920px;transform:scale(${zoom});transform-origin:50% 40%;opacity:${1 - seg(t, 9.0, 9.6)}">`;
  h += T('Convocatoria_sabado_FINAL_v3.xlsx', { y: 250, size: 30, font: 'Mono', weight: 500, color: '#7b8394', a: 1 - seg(t, 7, 7.5) });
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const k = r * cols + c;
    const off = r === 0 ? 8 : 1.4 + ((k * 37) % 71) / 71 * 5.4; const on = t < off ? 1 : t < off + .06 ? .4 : 0;
    const txt = r === 0 ? names[c] : c === 0 ? names[5 + r] : marks[(k * 5) % 8];
    const bg = r === 0 ? `rgba(31,110,60,${.25 + .75 * on})` : `rgba(233,242,234,${.05 + .95 * on})`;
    const fg = r === 0 ? `rgba(217,255,230,${.3 + .7 * on})` : `rgba(28,42,31,${on})`;
    h += `<div class="a" style="left:${x0 + c * cw}px;top:${y0 + r * ch}px;width:${cw - 4}px;height:${ch - 4}px;background:${bg};color:${fg};font-family:Mono;font-size:26px;display:flex;align-items:center;justify-content:${c ? 'center' : 'flex-start'};padding:0 14px;${on ? 'box-shadow:0 0 18px rgba(255,255,255,.08)' : ''}">${txt}</div>`; }
  h += '</div>';
  h += TT(t, 2.2, 7.2, '43 Excels.', { y: 1300, size: 120 });
  h += TT(t, 3.6, 7.2, '0 respuestas.', { y: 1430, size: 120, color: '#6b7280' });
  h += TT(t, 7.6, 9.6, 'Apágalos.', { y: 860, size: 150, align: 'center', x: 0, w: 1080 });
  const p = eo(seg(t, 9.4, 10.4));
  if (t > 9.4 && t < 13) { h += PH('fA', { y: 260 + (1 - p) * 900, w: 600, crop: .72 }); h += CIRC(t, 10.6, 570, 650, 160, 600);
    h += TT(t, 10.2, 13, 'La convocatoria,<br>en ProTeam.', { y: 1490, size: 84 }); }
  return h + CIERRE(t, 13); } };

// ── r05 · Lunes, 23:40 (voz) ───────────────────────────────────────
R.r05 = { dur: 19, render(t) { let h = BG('#07090c');
  const msgs = [['Marta (madre de Pau)', '¿El sábado a qué hora es?'], ['Jordi', '¿Dónde jugamos?'], ['Ana', 'Leo tiene examen el lunes 😬'], ['Toni', '¿Hay convocatoria ya?'], ['Marta (madre de Pau)', '¿Y la equipación blanca o azul?'], ['Lucía', 'Iker no puede, está malo'], ['Jordi', '¿Alguien me lleva a Hugo?'], ['Pere', '👍'], ['Ana', '¿Entonces Leo juega o no?'], ['Toni', '¿?']];
  h += T('Lunes · 23:40', { y: 150, size: 34, font: 'Mono', weight: 500, color: MUTED, ls: '.12em', a: 1 - seg(t, 8.6, 9) });
  h += T('Grupo Infantil A', { y: 200, size: 58, a: 1 - seg(t, 8.6, 9) });
  const n = Math.min(msgs.length, Math.floor(t / .62));
  const cnt = Math.min(47, Math.floor(t * 5.6));
  if (t < 9) { h += `<div class="a" style="left:860px;top:205px;background:${RED};color:#fff;font-weight:800;font-size:34px;border-radius:30px;padding:6px 20px">${cnt}</div>`;
    let y = 320 - Math.max(0, n - 7) * 150; h += `<div class="a" style="left:0;top:300px;width:1080px;height:1620px;overflow:hidden"><div class="a" style="left:0;top:-300px;width:1080px;height:1920px">`;
    for (let i = 0; i < n; i++) { const [who, m] = msgs[i], p = eo(seg(t, i * .62, i * .62 + .25));
      h += `<div class="a" style="left:${90 + (i % 3) * 20}px;top:${y + (1 - p) * 40}px;max-width:820px;background:#161a21;border-radius:28px 28px 28px 8px;padding:22px 30px;opacity:${p}">
        <div style="font-size:24px;font-weight:700;color:${['#7aa7ff', '#ffb36b', '#9be38a', '#ff8fb1'][i % 4]}">${who}</div><div style="font-size:40px;font-weight:500;margin-top:6px">${m}</div></div>`; y += 150; } h += '</div></div>'; }
  const bo = seg(t, 8.6, 9.0); if (t > 8.6 && t < 9.4) h += `<div class="a" style="inset:0;background:#000;opacity:${bo}"></div>`;
  const p = eo(seg(t, 9.3, 10.2));
  if (t > 9.3 && t < 16.4) { const sw = seg(t, 12.6, 13.4); h += PH(sw < .5 ? 'fA' : 'grid-0', { y: 210 + (1 - p) * 700, w: 600, crop: .78, a: 1 - Math.abs(sw - .5) * 0 });
    h += t < 12.8 ? CIRC(t, 10.3, 570, 600, 160, 600) : CIRC(t, 13.4, 140, 630, 830, 140);
    h += TT(t, 9.6, 12.8, 'Convocados y titulares,<br>en un solo sitio.', { y: 1560, size: 66 });
    h += TT(t, 13.0, 16.4, 'Con quién cuentas,<br>de un vistazo.', { y: 1560, size: 66 }); }
  return h + CIERRE(t, 16.4); } };

// ── r06 · ProTeam en 10 segundos (sin voz, cortes al ritmo) ────────
R.r06 = { dur: 13, render(t) { let h = BG();
  const cuts = [['mo-plan', 'Planifica.', .3], ['mo-week', 'La semana entera.', .2], ['mo-cal', 'El calendario.', .1], ['fA', 'Convoca.', .25], ['reg-0', 'Registra en directo.', .35], ['reg-1', 'Tiro.', .6], ['reg-4', '¿Gol o parada?', .7], ['res-0', 'Analiza por partes.', .3], ['fF', 'Controla la carga.', .25], ['mo-home', 'Todo en un sitio.', 0]];
  const L = .98, i = Math.min(cuts.length - 1, Math.floor(t / L)), u = (t - i * L) / L;
  if (t < cuts.length * L) { const [img, w, sc] = cuts[i];
    h += PH(img, { y: 240 - u * 30, w: 620, crop: .74, scroll: sc, s: 1 + u * .04, rot: (i % 2 ? 1 : -1) * 1.5 });
    h += T(w, { y: 1560, size: 96, a: eo(seg(u, 0, .2)), dy: (1 - eo(seg(u, 0, .2))) * 30 });
    h += T(`${String(i + 1).padStart(2, '0')}/10`, { y: 150, size: 30, font: 'Mono', weight: 500, color: MUTED }); }
  return h + CIERRE(t, cuts.length * L); } };

// ── r07 · Partido en directo (voz) ────────────────────────────────
R.r07 = { dur: 20, render(t) { let h = BG();
  const sh = [[0, 'reg-0', .35], [3.4, 'reg-1', .45], [6.0, 'reg-2', .45], [8.4, 'reg-3', .5], [10.6, 'reg-4', .55], [13.0, 'cro-0', .1]];
  let k = 0; for (let i = 0; i < sh.length; i++) if (t >= sh[i][0]) k = i;
  if (t < 16.4) { const [t0, img, sc] = sh[k], p = eo(seg(t, t0, t0 + .35));
    h += PH(img, { y: 230, w: 620, crop: .76, scroll: sc, a: 1, s: .97 + .03 * p });
    h += T('Minuto 21', { y: 120, size: 34, font: 'Mono', weight: 500, color: MUTED, ls: '.12em' });
    const caps = ['Partido en directo.', 'Quién y qué acción.', 'Desde dónde.', 'Dónde va.', 'Gol o parada.', 'La crónica, hecha.'];
    h += TT(t, t0 + .1, (sh[k + 1] || [16.4])[0], caps[k], { y: 1590, size: 86 });
    if (k === 1) h += CIRC(t, 4.2, 250, 930, 590, 330);
    if (k === 4) h += CIRC(t, 11.4, 250, 1010, 300, 240, '#22c55e');
    h += EJ(1760); }
  return h + CIERRE(t, 16.4); } };

// ── r08 · Lo que no viste: parciales (voz) ────────────────────────
R.r08 = { dur: 20, render(t) { let h = BG();
  h += TT(t, .2, 4.4, 'Ganaste de once.', { y: 700, size: 120, align: 'center', x: 0, w: 1080 });
  h += TT(t, 2.0, 4.4, '¿Cuándo se rompió?', { y: 850, size: 76, align: 'center', x: 0, w: 1080, color: MUTED, font: 'M', weight: 700 });
  if (t > 4.4 && t < 16.6) { const p = eo(seg(t, 4.4, 5.2)), sc = ez(seg(t, 9.5, 11.5)) * .55;
    h += PH('res-0', { y: 200 + (1 - p) * 600, w: 640, crop: .78, scroll: .18 + sc, zoom: 1.0 });
    if (t < 9.6) { h += CIRC(t, 5.6, 180, 600, 220, 120); h += CIRC(t, 6.6, 440, 600, 220, 120); h += CIRC(t, 7.8, 180, 740, 250, 110, RED); }
    else h += CIRC(t, 11.8, 230, 520, 640, 380);
    h += TT(t, 5.0, 9.6, 'Marcador por partes<br>y últimos 10 minutos.', { y: 1560, size: 66 });
    h += TT(t, 9.8, 16.6, 'Eficacia, pérdidas<br>y paradas, frente al rival.', { y: 1560, size: 66 });
    h += EJ(1760); }
  return h + CIERRE(t, 16.6); } };

// ── r09 · La semana (voz) ─────────────────────────────────────────
R.r09 = { dur: 20, render(t) { let h = BG();
  h += TT(t, .2, 3.8, 'Domingo, 22:10.', { y: 760, size: 120, x: 0, w: 1080, align: 'center' });
  h += TT(t, 1.4, 3.8, 'La semana, sin hacer.', { y: 900, size: 70, x: 0, w: 1080, align: 'center', color: MUTED, weight: 700 });
  if (t > 3.8 && t < 16.6) { const k = t < 8.2 ? 0 : t < 12.4 ? 1 : 2, img = ['mo-plan', 'mo-week', 'mo-cal'][k], t0 = [3.8, 8.2, 12.4][k], p = eo(seg(t, t0, t0 + .5));
    h += PH(img, { y: 210 + (k === 0 ? (1 - p) * 600 : 0), w: 620, crop: .77, scroll: [.05, .1, .15][k], s: .96 + .04 * p });
    if (k === 1) h += CIRC(t, 9.0, 160, 860, 760, 170);
    h += TT(t, t0 + .1, [8.2, 12.4, 16.6][k], ['Planifica el microciclo.', 'Volumen y días de trabajo.', 'Y todo, en el calendario.'][k], { y: 1590, size: 76 });
    h += EJ(1760); }
  return h + CIERRE(t, 16.6); } };

// ── r10 · RPE y carga (voz) ───────────────────────────────────────
R.r10 = { dur: 20, render(t) { let h = BG();
  const a = seg(t, .2, .5), b = seg(t, 2.4, 2.7), c = seg(t, 4.1, 4.4), out = 1 - seg(t, 5.7, 6);
  if (t < 6) { h += T('52′', { x: 90, y: 640, size: 190, a: a * out }) + T('× 8', { x: 450, y: 640, size: 190, color: MUTED, a: b * out }) + T('= 416', { x: 90, y: 860, size: 190, color: BLUE, a: c * out });
    h += T('minutos × esfuerzo (RPE)', { y: 1110, size: 44, font: 'Mono', weight: 500, color: MUTED, a: c * out, ls: '.02em' }); }
  if (t > 6 && t < 16.6) { const p = eo(seg(t, 6, 6.8));
    h += PH('fF', { y: 200 + (1 - p) * 700, w: 640, crop: .78, scroll: .02 });
    h += CIRC(t, 7.2, 150, 380, 760, 150); h += CIRC(t, 10.2, 130, 600, 800, 120);
    h += TT(t, 6.4, 10.2, 'RPE y carga del partido.', { y: 1580, size: 72 });
    h += TT(t, 10.4, 16.6, 'Jugador a jugador,<br>igual que en los entrenos.', { y: 1560, size: 68 });
    h += EJ(1760); }
  return h + CIERRE(t, 16.6); } };

// ── r11 · El domingo: sin / con (sin voz) ─────────────────────────
R.r11 = { dur: 14, render(t) { let h = BG();
  const L = ['3 Excels', 'una libreta', '47 mensajes', 'notas de voz', 'la pizarra borrada'], Rr = ['1 app', 'la semana planificada', 'convocatoria hecha', 'el partido registrado', 'la carga de cada jugador'];
  const split = ez(seg(t, 7.6, 8.4));
  h += `<div class="a" style="left:0;top:0;width:540px;height:1920px;background:#0b0c0f;opacity:${1 - split}"></div>`;
  h += T('Sin ProTeam', { x: 60, y: 300, w: 440, size: 52, color: MUTED, a: seg(t, .2, .5) * (1 - split) });
  h += T('Con ProTeam', { x: 590, y: 300, w: 440, size: 52, color: BLUE, a: seg(t, .2, .5) * (1 - split) });
  L.forEach((s, i) => { const p = eo(seg(t, .6 + i * .55, .9 + i * .55)); h += T(s, { x: 60 + (i % 2) * 10, y: 460 + i * 170, w: 440, size: 54, weight: 700, color: '#c7cbd3', a: p * (1 - split), dy: (1 - p) * 20 }) + (p > .9 ? `<div class="a" style="left:60px;top:${492 + i * 170}px;width:${380 * eo(seg(t, 4.2 + i * .25, 4.5 + i * .25))}px;height:5px;background:${RED};opacity:${1 - split}"></div>` : ''); });
  Rr.forEach((s, i) => { const p = eo(seg(t, .9 + i * .55, 1.2 + i * .55)); h += T('✓ ' + s, { x: 590, y: 460 + i * 170, w: 440, size: 50, weight: 700, a: p * (1 - split), dy: (1 - p) * 20 }); });
  if (t > 8) { const p = eo(seg(t, 8.2, 9)); h += PH('mo-home', { y: 260 + (1 - p) * 600, w: 600, crop: .7 }); h += TT(t, 8.6, 11.4, 'Tu domingo, recuperado.', { y: 1520, size: 76 }); }
  return h + CIERRE(t, 11.4); } };

// ── r12 · Seis meses (voz) ────────────────────────────────────────
R.r12 = { dur: 20, render(t) { let h = BG();
  const m = [['Dic', 'Primera vuelta'], ['Ene', 'Vuelta al trabajo'], ['Feb', 'Mitad de liga'], ['Mar', 'Segunda vuelta'], ['Abr', 'Recta final'], ['May', 'Fase final']];
  h += TT(t, .2, 16.4, '6 meses.', { y: 210, size: 150 });
  h += TT(t, 1.6, 16.4, 'Casi una temporada entera.', { y: 380, size: 62, color: MUTED, weight: 700 });
  m.forEach(([a, b], i) => { const t0 = 3.6 + i * 1.3, on = seg(t, t0, t0 + .3), x = 90 + (i % 2) * 460, y = 560 + Math.floor(i / 2) * 300;

      <div style="position:absolute;left:34px;top:30px;font-size:84px;font-weight:800;color:${on > .5 ? WHITE : '#353b47'}">${a}</div>

  h += TT(t, 11.4, 16.4, 'Si creas tu primer equipo<br>antes del 27.', { y: 1500, size: 66 });
  return h + CIERRE(t, 16.4); } };

R.r16 = { dur: 18, render(t) { let h = BG('radial-gradient(70% 50% at 50% 40%,#2a050b 0%,#0d0204 60%,#050102 100%)');
  const left = 10 * 3600 + 29 * 60 + 30 - t, hh = Math.floor(left / 3600), mm = Math.floor(left % 3600 / 60), ss = Math.floor(left % 60);
  const p = eo(seg(t, .2, .8));
  if (t < 14.4) { h += T('Último día', { y: 360, size: 34, font: 'Mono', weight: 500, color: '#ff8a96', ls: '.2em', a: p });
    h += T(`${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`, { x: 0, w: 1080, align: 'center', y: 640, size: 210, font: 'Mono', weight: 500, color: '#fff', a: p, ls: '-.02em' });
    h += T('horas · min · seg', { x: 0, w: 1080, align: 'center', y: 880, size: 30, font: 'Mono', weight: 500, color: '#ff8a96', a: p, ls: '.3em' });
    h += TT(t, 2.2, 14.4, 'Esta noche se va la luz.', { y: 1180, size: 80 });
    h += TT(t, 6.0, 14.4, 'Mañana, 6 meses vuelven a ser 3.', { y: 1300, size: 56, color: '#ffb3bb', weight: 700 }); }
