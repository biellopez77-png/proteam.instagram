<script type="module">

const Q = new URLSearchParams(location.search);

const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const C = new THREE.PerspectiveCamera(35, W / H, .01, 100);

// ---------- utilidades ----------
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function canvasTex(w, h, draw, srgb = true) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; }
function noise(g, w, h, a, base) { const d = g.getImageData(0, 0, w, h); for (let i = 0; i < d.data.length; i += 4) { const n = (rnd() - .5) * a; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; } g.putImageData(d, 0, 0); }
// Parqué de pabellón, gastado
const parquet = canvasTex(2048, 2048, (g, w, h) => { const rows = 28, ph = h / rows;
  for (let y = 0; y < rows; y++) { let x = -rnd() * 600; while (x < w) { const L = 380 + rnd() * 520; const l = 44 + rnd() * 12;
      g.fillStyle = `hsl(${31 + rnd() * 5},${46 + rnd() * 10}%,${l}%)`; g.fillRect(x, y * ph, L - 2, ph - 2);
      for (let k = 0; k < 7; k++) { g.strokeStyle = `rgba(70,35,10,${.05 + rnd() * .1})`; g.lineWidth = .6 + rnd() * 1.6; g.beginPath(); const yy = y * ph + rnd() * ph; g.moveTo(x, yy); g.bezierCurveTo(x + L * .3, yy + (rnd() - .5) * 6, x + L * .7, yy + (rnd() - .5) * 6, x + L, yy); g.stroke(); }

  for (let i = 0; i < 30; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * .05})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 80 + rnd() * 300, 30 + rnd() * 90, rnd() * 3, 0, 7); g.fill(); }
  g.fillStyle = '#d8d8d0'; g.fillRect(0, 1180, w, 34); g.fillStyle = '#2b5fd0'; g.fillRect(0, 1520, w, 30);
  noise(g, w, h, 20); });
parquet.wrapS = parquet.wrapT = THREE.RepeatWrapping;
const rough = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, w, h); for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(${rnd() < .5 ? 255 : 0},${0},${0},0)`; }
  for (let i = 0; i < 160; i++) { const v = 120 + rnd() * 120 | 0; g.fillStyle = `rgba(${v},${v},${v},.35)`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 10 + rnd() * 60, 4 + rnd() * 20, rnd() * 3, 0, 7); g.fill(); } noise(g, w, h, 30); }, false);
rough.wrapS = rough.wrapT = THREE.RepeatWrapping;
function floor(rep = 3, size = 30) { const m = new THREE.MeshStandardMaterial({ map: parquet, roughnessMap: rough, roughness: .8, metalness: 0 });
  parquet.repeat.set(rep, rep); rough.repeat.set(rep * 2, rep * 2);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(size, size), m); f.rotation.x = -Math.PI / 2; f.receiveShadow = true; S.add(f); return f; }
function wall(z = -4, col = '#2a2d33') { const t = canvasTex(1024, 1024, (g, w, h) => { g.fillStyle = col; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 64) for (let x = (y / 64 % 2) * 64; x < w; x += 128) { g.fillStyle = `rgba(0,0,0,${.12 + rnd() * .1})`; g.fillRect(x, y, 126, 2); g.fillRect(x, y, 2, 62); g.fillStyle = `rgba(255,255,255,${rnd() * .03})`; g.fillRect(x + 3, y + 3, 120, 56); }
    noise(g, w, h, 16); });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 3);

// ---------- objetos ----------
function whistle() { const g = new THREE.Group(); const m = metal('#d9dde4', .14), m2 = metal('#c3c9d2', .26);

  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), k = 1 - (x + .05) / .1 * .25; pos.setY(i, pos.getY(i) * k); pos.setZ(i, pos.getZ(i) * (1 - (x + .05) / .1 * .12)); } mg.computeVertexNormals();

  const lip = new THREE.Mesh(new RoundedBoxGeometry(.012, .03, .058, 4, .005), m2); lip.position.set(.122, .082, 0); g.add(lip);
  const hole = new THREE.Mesh(new RoundedBoxGeometry(.03, .008, .046, 3, .003), plastic('#030303', .9)); hole.position.set(.035, .1, 0); g.add(hole);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.016, .0035, 16, 48), m2); ring.position.set(-.058, .088, 0); ring.rotation.y = Math.PI / 2; g.add(ring);

function lanyard(pts, col = '#1d3f8f') { const c = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(...p)));
  const tex = canvasTex(64, 512, (g, w, h) => { g.fillStyle = col; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 6) { g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, y, w, 2); } g.fillStyle = 'rgba(255,255,255,.75)'; g.font = 'bold 30px sans-serif'; }, true);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 18);
  const m = new THREE.Mesh(new THREE.TubeGeometry(c, 300, .006, 10, false), new THREE.MeshStandardMaterial({ map: tex, roughness: .8 })); m.scale.set(1, .5, 1);
  return cast(m); }
function board() { // pizarra táctica magnética con rotulador
  const g = new THREE.Group();
  const face = canvasTex(1600, 1100, (c, w, h) => { c.fillStyle = '#1d2a22'; c.fillRect(0, 0, w, h); noise(c, w, h, 14);
    // restos de borrado
    for (let i = 0; i < 26; i++) { c.fillStyle = `rgba(230,230,220,${rnd() * .05})`; c.beginPath(); c.ellipse(rnd() * w, rnd() * h, 60 + rnd() * 200, 20 + rnd() * 60, rnd() * 3, 0, 7); c.fill(); }
    c.strokeStyle = 'rgba(240,240,232,.82)'; c.lineWidth = 5; c.strokeRect(60, 60, w - 120, h - 120);
    c.beginPath(); c.moveTo(w / 2, 60); c.lineTo(w / 2, h - 60); c.stroke(); c.beginPath(); c.arc(w / 2, h / 2, 130, 0, 7); c.stroke();
    c.beginPath(); c.arc(60, h / 2, 330, -1.57, 1.57); c.stroke(); c.beginPath(); c.arc(w - 60, h / 2, 330, 1.57, 4.71); c.stroke();
    // trazos a mano del entrenador (rotulador azul)
    const hand = (pts, col, wd = 7) => { c.strokeStyle = col; c.lineWidth = wd; c.lineCap = 'round'; c.beginPath(); c.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) c.quadraticCurveTo(pts[i][0] + (rnd() - .5) * 18, pts[i][1] + (rnd() - .5) * 18, ...pts[i]); c.stroke(); };
    hand([[380, 820], [520, 640], [700, 560], [900, 430]], 'rgba(70,130,255,.95)', 9);
    hand([[880, 440], [900, 430], [884, 410]], 'rgba(70,130,255,.95)', 9);
    c.setLineDash([22, 18]); hand([[520, 300], [700, 380], [1000, 330], [1180, 420]], 'rgba(240,240,232,.9)', 7); c.setLineDash([]);

  // imanes

    const m = new THREE.Mesh(new THREE.CylinderGeometry(.034, .036, .018, 48), plastic(col, .35)); m.position.set(x, .03, z); m.rotation.y = rnd() * 6; g.add(m); };

  [[.42, .05, 1], [.55, -.28, 6], [.6, .3, 9]].forEach(([x, z, n]) => mag(x, z, '#c8262f', n));
  // rotulador
  const pen = new THREE.Group(); const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.011, .011, .14, 32), plastic('#f2f2f2', .3)); barrel.rotation.z = Math.PI / 2; pen.add(barrel);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(.0125, .0125, .05, 32), plastic('#2457d6', .3)); cap.rotation.z = Math.PI / 2; cap.position.x = .09; pen.add(cap);
  pen.position.set(.35, .033, .44); pen.rotation.y = .5; g.add(pen);
  return cast(g); }
function scoreboard(txt) { // marcador LED del pabellón
  const g = new THREE.Group();
  const housing = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.6, .22), plastic('#0c0d10', .7)); g.add(housing);
  const led = canvasTex(1600, 800, (c, w, h) => { c.fillStyle = '#050506'; c.fillRect(0, 0, w, h);
    const glyph = document.createElement('canvas'); glyph.width = w; glyph.height = h; const q = glyph.getContext('2d');
    q.fillStyle = '#fff'; q.textAlign = 'center'; q.font = 'bold 120px monospace'; q.fillText('LOCAL', 330, 150); q.fillText('VISIT.', 1270, 150);
    q.font = (txt.length > 3 ? 'bold 330px' : 'bold 470px') + ' monospace'; q.fillText(txt, w / 2, txt.length > 3 ? 500 : 560);
    q.font = 'bold 150px sans-serif'; q.fillText(Q.get('lab') || 'DÍAS', w / 2, 770);
    const px = q.getImageData(0, 0, w, h).data, step = 14;
    for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) { const on = px[(y * w + x) * 4] > 128;
      const centre = x > 480 && x < 1120 && y > 180; c.fillStyle = on ? (centre ? '#ffb02e' : '#ff3b2f') : '#17110e'; c.beginPath(); c.arc(x + 7, y + 7, on ? 5.4 : 4.2, 0, 7); c.fill(); } });

  return cast(g); }

// ---------- escenas ----------
const SC = {
  silbato() { floor(6, 12); S.fog = new THREE.FogExp2('#040507', .25);
    const w = whistle(); w.rotation.y = -.5; w.position.set(0, 0, 0); S.add(w);
    S.add(lanyard([[-.06, .09, 0], [-.16, .02, .05], [-.32, .006, .2], [-.25, .006, .45], [.05, .006, .5], [.35, .006, .32], [.5, .006, .05], [.7, .006, -.2], [1.2, .006, -.4]]));
    spot('#fff4e6', 1.1, [-.3, 2.4, -.9], [.02, 0, 0], .08, .8);
    spot('#3d7bff', 2.2, [-2.2, .6, -1.8], [0, .05, 0], .5, .9, false);
    C.position.set(.42, .14, .46); C.lookAt(.02, .05, 0); C.fov = 32;
    if (Q.get('anim') === '1') { // órbita lenta, como un travelling de producto
      window.ANIM = (t) => { const a = -.25 + t * .04, r = 1.15 - t * .025; C.position.set(Math.sin(a) * r + .03, .34 - t * .008, Math.cos(a) * r);
        C.lookAt(.03, .05, 0); }; window.ANIM(+(Q.get('t') || 0)); } },
  pizarra() { floor(4, 12); S.fog = new THREE.FogExp2('#040507', .2);
    const b = board(); b.rotation.y = .15; S.add(b);
    const w = whistle(); w.position.set(-.95, 0, .55); w.rotation.y = 1.2; S.add(w);
    spot('#fff1df', 2.0, [-.8, 2.6, .6], [.1, 0, 0], .26, .95);
    spot('#3d7bff', 2.0, [2.4, .8, -1.4], [0, .05, 0], .6, .9, false);
    C.position.set(.15, 1.25, 1.55); C.lookAt(0, 0, -.05); C.fov = 34;
    if (Q.get('anim') === '1') { // travelling lento de cámara en mano sobre la pizarra
      const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
      const p0 = new THREE.Vector3(-.75, .55, .9), p1 = new THREE.Vector3(.5, .62, .95), l0 = new THREE.Vector3(-.35, 0, 0), l1 = new THREE.Vector3(.42, 0, .22);
      window.ANIM = (t) => { const k = ease(t / 12); C.position.lerpVectors(p0, p1, k); C.position.x += Math.sin(t * 1.7) * .004; C.position.y += Math.sin(t * 1.1 + 1) * .004;
        C.lookAt(new THREE.Vector3().lerpVectors(l0, l1, k)); }; window.ANIM(+(Q.get('t') || 0)); } },
  marcador() { floor(12, 40); wall(-4, '#22252b'); S.fog = new THREE.FogExp2('#040507', .05);
    const s = scoreboard(DAYS); s.position.set(0, 4.3, -3.85); S.add(s);
    const glow = new THREE.PointLight('#ff7a2a', 1.6, 7, 2); glow.position.set(0, 4.2, -3.2); S.add(glow);
    const amb = new THREE.HemisphereLight('#cfd8ff', '#3a2a1a', 0); S.add(amb);

      rows.push({ lamps, lights }); }
    const pos0 = new THREE.Vector3(2.2, 1.25, 8.5), pos1 = new THREE.Vector3(.35, 2.4, 1.4), look0 = new THREE.Vector3(0, 2.4, -3.8), look1 = new THREE.Vector3(0, 4.0, -3.8);
    const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
    const off = Q.get('t') !== null ? null : [9, 9, 9];
    window.ANIM = (t) => { // t en segundos
      const offAt = [1.6, 2.5, 3.4];
      rows.forEach((r, i) => { const on = t < offAt[i] ? 1 : (t < offAt[i] + .12 ? (Math.sin(t * 90) > 0 ? .6 : 0) : 0);

      const lit = rows.reduce((a, r) => a + (r.lights[0].intensity > 0 ? 1 : 0), 0); amb.intensity = .3 * lit / 3; S.fog.density = .05;

      const k = ease((t - 1) / 11); C.position.lerpVectors(pos0, pos1, k); const lk = new THREE.Vector3().lerpVectors(look0, look1, k);
      C.position.y += Math.sin(t * 1.3) * .015; C.position.x += Math.sin(t * .9) * .012; C.lookAt(lk); };
    C.fov = 38; window.ANIM(+(Q.get('t') || 99)); },
};
SC[SCENE]();
S.traverse((o) => { if (o.isMesh) [].concat(o.material).forEach((m) => { if ('envMapIntensity' in m) m.envMapIntensity = m.metalness > .5 ? .55 : .12; }); }); C.aspect = W / H; C.updateProjectionMatrix();
