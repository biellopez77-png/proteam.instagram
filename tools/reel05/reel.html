<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1x{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1x .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:60px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:96px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}
#fld .ph2{color:#5d6475}
#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
#web{z-index:5}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
.ph.clip{border:14px solid #fbfaf6;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ink{color:#0d0f14!important;text-shadow:none!important}
.strike{position:absolute;left:-4%;right:-4%;top:52%;height:16px;background:#2f6bff;transform-origin:0 50%;border-radius:3px}
.vb .node{background:#fbfaf6;border-color:#d6d2c6;color:#0d0f14}
.vb .node div{background:#e4e0d4!important}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">11</b><span>DÍAS</span></div><div><b id="cd2">03</b><span>HORAS</span></div><div><b id="cd3">29</b><span>MIN</span></div><div><b id="cd4">59</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>

  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel05/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel05/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, x, y, w, h, o = {}) {
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = `translate(${o.dx || 0}px,${o.dy || 0}px) rotate(${o.rot || 0}deg) scale(${o.s || 1})`;
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1; el.style.filter = o.blur ? `blur(${o.blur}px)` : 'none';
  if (el._img) el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  if (el._sh) el._sh.style.background = `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) {
  const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d;
}
function reveal(el, p, dir = 'up') {
  el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i));
    s.style.transform = dir === 'up' ? `translateY(${(1 - q) * 110}%)` : `translateX(${(q - 1) * 105}%)`; });
}
const M = s => `<span class="mask"><span>${s}</span></span>`;

// ── 1 · GANCHO: De la Fuente + marcador 3–0 ──
const DLF = ph('delafuente', '50% 18%');
const SCB = mk('div', 'position:absolute;left:0;width:1080px;top:930px;text-align:center;display:none',
  '<div style="font-family:M;font-weight:800;font-size:300px;letter-spacing:-.04em;line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 8px 40px rgba(0,0,0,.6)">3<span style="color:#9db8ff;padding:0 .12em">–</span>0</div><div style="display:flex;justify-content:center;gap:250px;margin-top:4px;font-family:M;font-weight:800;font-size:30px;letter-spacing:.18em;color:#e6e8ee;text-shadow:0 2px 12px rgba(0,0,0,.7)"><span>TU EQUIPO</span><span>RIVAL</span></div>');
const tESC = tx(`${M('<span class="S" style="color:#9db8ff">esconde más que</span>')} ${M('<span class="M8" id="u01" style="display:inline-block;font-size:84px;letter-spacing:-.03em;color:#fff">un 0–1.</span>')}`, 1390, 'shadow', 98);
function hook(t) {
  const b = T.ganas - .05, v = t < b; show(DLF, v); show(SCB, v); show(tESC, v && t >= .4); if (!v) return;
  const p = E.out5(seg(t, 0, .45));
  place(DLF, 0, 0, 1080, 1920, { s: 1 + (1 - p) * .08, is: 1.12 - .05 * seg(t, 0, b), iy: -20 * seg(t, 0, b), dark: .38 + .1 * seg(t, .4, .8), z: 1 });
  const hit = Math.exp(-Math.pow((t - T.h3 - .05) / .1, 2)) + Math.exp(-Math.pow((t - T.cero - .05) / .1, 2));
  SCB.style.transform = `scale(${(1.06 - .06 * E.out5(seg(t, -.2, .3))) + .04 * hit})`; SCB.style.opacity = 1;
  reveal(tESC, seg(t, .4, .8)); $('u01').style.transform = `scale(${1 + .1 * Math.exp(-Math.pow((t - T.cero2 - .1) / .15, 2))})`;
  const out = seg(t, b - .12, b); [SCB, tESC, DLF].forEach(e => e.style.opacity = 1 - out);
}

// ── 2 · EL LUNES: la ficha del partido se archiva sin mirar ──
const MC = (head, score, i) => { const c = mk('div', `position:absolute;left:170px;top:${720 - i * 26}px;width:740px;height:460px;background:#fbfaf6;border-radius:24px;box-shadow:0 26px 60px rgba(13,15,20,.16);display:none;overflow:hidden`, '', $('cards'));
  mk('div', 'position:absolute;left:52px;top:46px;font-family:M;font-weight:800;font-size:28px;letter-spacing:.16em;color:#8a877e', head, c);
  mk('div', 'position:absolute;left:52px;right:52px;top:100px;height:3px;background:#e4e0d4', '', c);
  mk('div', 'position:absolute;left:52px;top:140px;font-family:M;font-weight:800;font-size:190px;letter-spacing:-.04em;color:#0d0f14;line-height:1;font-variant-numeric:tabular-nums', score, c);
  mk('div', 'position:absolute;left:56px;top:360px;font-family:M;font-weight:700;font-size:34px;color:#8a877e', 'Notas: —', c); return c; };
const OLD = [MC('DOMINGO · JORNADA 9', '1–1', 2), MC('SÁBADO · JORNADA 10', '2–1', 1)];
const CUR = MC('SÁBADO · JORNADA 11', '3–0', 0);
const STAMP = mk('div', 'position:absolute;left:250px;top:270px;padding:12px 26px;white-space:nowrap;border:7px solid #2f6bff;border-radius:14px;font-family:M;font-weight:800;font-size:54px;letter-spacing:.06em;color:#2f6bff;display:none;transform-origin:50% 50%', 'SIN REVISAR', CUR);
const tGAN = tx(M('GANAS.'), 330, 'M8 ink', 120);
const tLUN = tx(`<div class="kick" style="color:#8a877e">${M('Y EL')}</div>${M('LUNES')}`, 300, 'M8 ink', 120);
const tNAD = tx(M('<span class="S blue">nadie revisa nada.</span>'), 1290, '', 120);
function monday(t) {
  const a = T.ganas - .05, b = T.pero - .05, v = t >= a && t < b; show($('paper'), v);
  [...OLD, CUR].forEach(c => show(c, v)); show(tGAN, v && t < T.lunes - .15); show(tLUN, v && t >= T.lunes - .15); show(tNAD, v && t >= T.nadie - .1); show(STAMP, v && t >= T.rev);
  if (!v) return;
  OLD.forEach((c, i) => { const q = E.out5(seg(t, a + i * .08, a + .4 + i * .08)); c.style.transform = `translateY(${(1 - q) * 900}px) rotate(${[-4, 3][i]}deg)`; c.style.opacity = .8; });
  const q = E.out5(seg(t, a + .15, a + .55)); CUR.style.transform = `translateY(${(1 - q) * 1000}px) rotate(${-1 + (1 - q) * -6}deg) scale(${1 + .03 * seg(t, a, b)})`;
  reveal(tGAN, seg(t, a, a + .3)); reveal(tLUN, seg(t, T.lunes - .15, T.lunes + .2)); reveal(tNAD, seg(t, T.nadie - .1, T.nadie + .25));
  const st = E.out5(seg(t, T.rev, T.rev + .18)); STAMP.style.transform = `rotate(-9deg) scale(${2.2 - 1.2 * st})`; STAMP.style.opacity = st;
  const out = seg(t, b - .12, b); tLUN.style.opacity = tNAD.style.opacity = CUR.style.opacity = 1 - out; OLD.forEach(c => c.style.opacity = .8 * (1 - out));
}

// ── 3 · EL MARCADOR TAPA: se levanta y aparecen las ocasiones concedidas ──
const NS = 'http://www.w3.org/2000/svg';
const PIT = document.createElementNS(NS, 'svg'); PIT.setAttribute('viewBox', '0 0 1080 1920'); PIT.style.cssText = 'position:absolute;inset:0;width:1080px;height:1920px;display:none'; $('cards').appendChild(PIT);
const ln = (d, c = '#2a3040', w = 5) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', c); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); PIT.appendChild(p); return p; };
ln('M90 520 H990 V1420 H90 Z'); ln('M290 1180 H790 V1420'); ln('M290 1420 V1180'); ln('M420 1340 H660 V1420 M420 1420 V1340'); ln('M430 1180 A 140 140 0 0 1 650 1180'); ln('M400 520 A 140 140 0 0 0 680 520');
ln('M470 1420 H610', '#5d6475', 12);
const SH = [[430, 1110], [620, 1040], [770, 1250], [340, 1290], [540, 960], [700, 1170]].map(([x, y]) => { const tr = ln(`M${x} ${y} L ${540 + (x - 540) * .15} 1412`, '#2f6bff', 5); tr.setAttribute('stroke-dasharray', '14 12');
  const xx = ln(`M${x - 22} ${y - 22} L${x + 22} ${y + 22} M${x + 22} ${y - 22} L${x - 22} ${y + 22}`, '#f2f1ec', 10); return [tr, xx]; });
const BOARD = mk('div', 'position:absolute;left:150px;top:690px;width:780px;height:460px;border-radius:40px;background:#0b0d12;border:3px solid #2a3040;display:none;text-align:center;box-shadow:0 50px 100px rgba(0,0,0,.6)',
  '<div style="font-family:M;font-weight:800;font-size:30px;letter-spacing:.22em;color:#7d8597;margin-top:48px">FINAL</div><div style="font-family:M;font-weight:800;font-size:250px;letter-spacing:-.04em;color:#f2f1ec;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums">3–0</div>', $('cards'));
const tOCA = tx(M('LAS OCASIONES QUE CONCEDISTE'), 330, 'M7', 46); tOCA.style.letterSpacing = '.12em'; tOCA.style.color = '#c9cfdb';
const tSIG = tx(M('SIGUEN AHÍ.'), 1500, 'M8', 120);
const tTAP = tx(M('<span class="S blue">tapadas por el marcador.</span>'), 1505, '', 98);
function reveal3(t) {
  const a = T.pero - .05, b = T.apunta - .05, v = t >= a && t < b; show(PIT, v); show(BOARD, v); show(tOCA, v && t >= T.ocas - .1); show(tSIG, v && t >= T.siguen - .1 && t < T.tap - .1); show(tTAP, v && t >= T.tap - .1);
  if (!v) return; show($('sysL'), true);
  const up = E.io(seg(t, a, a + .55)), down = E.io(seg(t, T.tap - .05, T.tap + .5));
  BOARD.style.transform = `translateY(${lerp(0, -1250, up) + lerp(0, 1250, down)}px) scale(${1 + .04 * (1 - up)})`; BOARD.style.filter = `blur(${6 * Math.sin(Math.PI * up) + 6 * Math.sin(Math.PI * down)}px)`;
  BOARD.style.opacity = down > 0 ? .55 + .4 * down : 1;
  PIT.style.opacity = E.out(seg(t, a, a + .4));
  SH.forEach(([tr, xx], i) => { const s0 = T.ocas - .1 + i * .3; const q = E.out5(seg(t, s0, s0 + .25)); xx.style.opacity = q; xx.style.transform = `scale(${1.5 - .5 * q})`; xx.style.transformOrigin = 'center'; xx.style.transformBox = 'fill-box';
    tr.style.opacity = .9 * E.out(seg(t, s0 + .1, s0 + .4)); });
  reveal(tOCA, seg(t, T.ocas - .1, T.ocas + .3)); reveal(tSIG, seg(t, T.siguen - .1, T.siguen + .2)); reveal(tTAP, seg(t, T.tap - .1, T.tap + .3));
  const out = seg(t, b - .12, b); tOCA.style.opacity = tTAP.style.opacity = 1 - out; PIT.style.opacity = parseFloat(PIT.style.opacity) * (1 - out); BOARD.style.opacity = parseFloat(BOARD.style.opacity) * (1 - out);
}

// ── 4 · LA FICHA GUARDABLE ──
const tAP3 = tx(`<div class="kick" style="color:#8a877e">${M('DE CADA PARTIDO')}</div>${M('APUNTA 3 COSAS')}`, 330, 'M8 ink', 104);
const FI = mk('div', 'position:absolute;left:100px;top:640px;width:880px;height:640px;background:#fbfaf6;border-radius:30px;box-shadow:0 40px 90px rgba(13,15,20,.18);display:none;overflow:hidden', '', $('cards'));
mk('div', 'position:absolute;left:60px;top:50px;font-family:M;font-weight:800;font-size:30px;letter-spacing:.14em;color:#8a877e', 'DESPUÉS DEL PARTIDO', FI);
mk('div', 'position:absolute;right:60px;top:42px;padding:8px 20px;border-radius:999px;background:#2f6bff;font-family:M;font-weight:800;font-size:26px;letter-spacing:.08em;color:#fff', 'GUÁRDALO', FI);
mk('div', 'position:absolute;left:60px;right:60px;top:112px;height:3px;background:#e4e0d4', '', FI);
const FR = ['Qué te hicieron', 'Qué hiciste tú', 'Qué cambias'].map((w, i) => { const r = mk('div', `position:absolute;left:60px;right:60px;top:${150 + i * 160}px;height:140px;border-bottom:${i < 2 ? '2px solid #ece8de' : 'none'}`, '', FI);
  mk('div', 'position:absolute;left:0;top:28px;font-family:M;font-weight:800;font-size:84px;color:#2f6bff;line-height:1', String(i + 1), r);
  mk('div', 'position:absolute;left:90px;top:34px;font-family:M;font-weight:800;font-size:76px;letter-spacing:-.035em;color:#0d0f14;line-height:1', w, r);
  r._s = mk('div', 'position:absolute;left:92px;top:108px;font-family:M;font-weight:500;font-size:28px;color:#8a877e', ['ocasiones y goles en contra', 'lo que funcionó y lo que no', 'una cosa para el martes'][i], r); return r; });
function ficha(t) {
  const a = T.apunta - .05, b = T.la - .05, v = t >= a && t < b; show(FI, v); show(tAP3, v); if (!v) return; show($('paper'), true); $('paper').style.opacity = 1;
  const p = E.out5(seg(t, a + .05, a + .5)); FI.style.transform = `translateY(${(1 - p) * 700}px) rotate(${(1 - p) * 4}deg) scale(${1 + .02 * seg(t, a, b)})`;
  reveal(tAP3, seg(t, a, a + .35));
