<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.65)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1x{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1x .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:60px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:96px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}
#fld .ph2{color:#5d6475}
#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
#web{z-index:5}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
.ph.clip{border:14px solid #fbfaf6;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ink{color:#0d0f14!important;text-shadow:none!important}
.strike{position:absolute;left:-4%;right:-4%;top:52%;height:16px;background:#2f6bff;transform-origin:0 50%;border-radius:3px}
.vb .node{background:#fbfaf6;border-color:#d6d2c6;color:#0d0f14}
.vb .node div{background:#e4e0d4!important}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <svg id="lines" width="1080" height="1920" style="position:absolute;inset:0;display:none;z-index:2"></svg>
  <div id="nodes" style="position:absolute;inset:0;z-index:2"></div>
  <div id="rects" style="position:absolute;inset:0"></div>
  <svg id="chart" width="1080" height="1920" style="position:absolute;inset:0;display:none">
    <polyline id="pl" fill="none" stroke="#4f86ff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <g id="tgt"><circle cx="540" cy="1030" r="150" fill="none" stroke="#2f6bff" stroke-width="3" opacity=".35"/><circle cx="540" cy="1030" r="95" fill="none" stroke="#2f6bff" stroke-width="3" opacity=".6"/><circle cx="540" cy="1030" r="40" fill="#2f6bff"/></g>
    <g id="conn"></g>
  </svg>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">13</b><span>DÍAS</span></div><div><b id="cd2">08</b><span>HORAS</span></div><div><b id="cd3">21</b><span>MIN</span></div><div><b id="cd4">40</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel2/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const V = new URLSearchParams(location.search).get('v') || 'a'; const VB = V === 'b';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel2/img/${n}.jpg`;

function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, x, y, w, h, o = {}) {
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = `translate(${o.dx || 0}px,${o.dy || 0}px) rotate(${o.rot || 0}deg) scale(${o.s || 1})`;
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1;
  if (el._img) el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  if (el._sh) el._sh.style.background = `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) {
  const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d;
}
// revela con máscara: el contenido sube/entra dentro de su caja
function reveal(el, p, dir = 'up') {
  el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i));
    s.style.transform = dir === 'up' ? `translateY(${(1 - q) * 110}%)` : `translateX(${(q - 1) * 105}%)`; });
}

// ── 1 · GANCHO: una foto de entrenador que se parte en 9 recuadros, cada uno otro referente ──
const MAIN = 'r2-main', GRID = ['r2-g1', 'r2-g2', 'r2-g3', 'r2-g4', 'r2-g5', 'r2-g6', 'r2-g7', 'r2-g8', 'r2-g9'];
const G = ph(MAIN, '50% 30%');
const TL = GRID.map((src, i) => { const d = document.createElement('div'); d.className = 'ph';
  const sl = document.createElement('img'); sl.src = IMG(MAIN); sl.style.cssText = 'position:absolute;width:1080px;height:1920px;object-fit:cover;object-position:50% 30%;max-width:none';
  const ot = document.createElement('div'); ot.style.cssText = 'position:absolute;inset:0;overflow:hidden';
  const im = document.createElement('img'); im.src = IMG(src); im.style.objectPosition = '50% 20%'; ot.appendChild(im);
  const sh = document.createElement('div'); sh.className = 'sh'; d.append(sl, ot, sh); $('phs').appendChild(d);
  return { d, sl, ot, im, sh, c: i % 3, r: Math.floor(i / 3), i }; });
const tGE = tx('<span class="mask"><span>LOS GRANDES</span></span><br><span class="mask"><span>EQUIPOS</span></span>', 1180, 'M8 shadow', 132);
tGE.style.lineHeight = '.95';
const tTU = tx('<span class="mask"><span class="S blue" style="font-size:190px">tú también</span></span>', 760, 'shadow', 190);
const tPC = tx('<span class="mask"><span>PUEDES CONSTRUIRLO</span></span>', 990, 'M8 shadow', 78);
function hook(t) {
  const v = t < T.no - .02 + 1e-6 && t < T.no - .02; show(G, v && t < 1.2); TL.forEach(k => show(k.d, v && t >= 1.0)); show(tGE, v && t < T.tu + .25); show(tTU, v && t >= T.tu - .05); show(tPC, v && t >= T.tu + .2);
  if (t >= T.no - .04) { show(tTU, false); show(tPC, false); }
  if (!v) { $('phs').style.transform = 'none'; $('phs').style.filter = 'none'; return; }
  const a = E.out5(seg(t, 0, .45));
  place(G, 0, 0, 1080, 1920, { dx: (1 - a) * 160, s: 1 + (1 - a) * .06, is: 1.1 - .05 * seg(t, 0, 1.2), dark: .15, z: 1 });
  const sp = E.io(seg(t, 1.0, 1.4));                       // la foto se separa en una cuadrícula 3×3
  const dim = E.io(seg(t, T.tu - .2, T.tu + .3));           // se apaga para dejar paso al texto
  const zoom = 1 + .06 * seg(t, 1.0, T.no);
  const gap = 18 * sp, pad = 40 * sp, cw = (1080 - 2 * pad - 2 * gap) / 3, chh = (1920 - 2 * pad - 2 * gap) / 3;
  TL.forEach(k => { const x = pad + k.c * (cw + gap), y = pad + k.r * (chh + gap);
    k.d.style.left = x + 'px'; k.d.style.top = y + 'px'; k.d.style.width = cw + 'px'; k.d.style.height = chh + 'px'; k.d.style.zIndex = 2; k.d.style.opacity = 1;
    k.d.style.borderRadius = 10 * sp + 'px';
    // trozo de la foto original, en su sitio
    const sx = 1080 / 1080, z0 = 1.05 - .05 * seg(t, 0, 1.2);
    k.sl.style.left = (-k.c * 360 - (x - k.c * 360) * 0) + (k.c * 360 - x) - k.c * 360 + 'px'; k.sl.style.top = (-y) + 'px';
    k.sl.style.left = (-x) + 'px';
    // cada recuadro se convierte en otro entrenador (orden en diagonal)
    const st = 1.2 + (k.c + k.r) * .1 + (k.i % 2) * .04; const q = E.out5(seg(t, st, st + .4));
    k.ot.style.clipPath = `inset(${(1 - q) * 100}% 0 0 0)`; k.im.style.transform = `scale(${1.25 - .15 * q + .05 * seg(t, st, T.no)}) translateY(${(1 - q) * 40}px)`;
    k.sh.style.background = `rgba(0,0,0,${.15 + .47 * dim})`; k.sl.style.transform = `scale(${1.1 - .05 * seg(t, 0, 1.2)})`; k.sl.style.transformOrigin = '540px 960px';
    const push = dim * 1; k.d.style.transform = `translate(${(k.c - 1) * 30 * push}px,${(k.r - 1) * 30 * push}px) scale(${zoom})`; });
  reveal(tGE, seg(t, .22, .62)); tGE.style.transform = `translateY(${-dim * 140}px)`; tGE.style.opacity = 1 - seg(t, 1.0, 1.25);
  reveal(tTU, seg(t, T.tu - .05, T.tu + .35)); reveal(tPC, seg(t, T.tu + .25, T.tu + .6));
  tTU.style.transform = tPC.style.transform = `scale(${zoom})`;
  const out = seg(t, T.no - .2, T.no - .02); $('phs').style.transform = out > 0 ? `scale(${1 + .12 * E.in(out)})` : 'none'; $('phs').style.filter = out > 0 ? `blur(${out * 6}px)` : 'none';
}

// ── 2 · DESMONTANDO: talento / presupuesto / jugadores / veinte personas ──
const P1 = ph('r2-p1', '50% 30%'), P1b = ph('r2-p1b', '50% 20%');
const P2 = ph('r2-p2', '50% 50%'), P2b = ph('r2-p2b', '50% 50%');
const P3 = ph('r2-p3', '50% 35%'), P3b = ph('r2-p3b', '50% 20%');
const word = (k, w, y) => tx(`<div class="kick" style="margin-bottom:10px"><span class="mask"><span>${k}</span></span></div><span class="mask" style="position:relative"><span>${w}</span></span>`, y, 'M8 shadow', 150);
const tTAL = word('NO ES SOLO', 'TALENTO', 1150), tPRE = word('NI', 'PRESUPUESTO', 1150), tJUG = word('NI', 'JUGADORES', 1150);
[tTAL, tPRE, tJUG].forEach(e => { const u = document.createElement('div'); u.className = 'uline'; u.style.bottom = '-6px'; u.style.left = '22%'; u.style.right = '22%'; e.appendChild(u); e._u = u; });
tPRE.style.fontSize = '128px';
function sub(t, P, Pb, a, b, tw, o) {
  const v = t >= a && t < b; show(P, v); show(Pb, v && t > a + .12); show(tw, v && t > a + .08); if (!v) return;
  if (VB) { show($('paper'), true); const p = E.out5(seg(t, a, a + .35)), q = E.out5(seg(t, a + .12, a + .5)), loc = seg(t, a, b);
    place(P, 110, 230, 860, 1080, { dx: (1 - p) * o.from * .7, dy: (1 - p) * 40, rot: o.rot * .6, is: 1.12 - .06 * loc, ix: -20 * loc, z: 2 }); P.classList.add('clip');
    place(Pb, o.bx + (o.bx > 400 ? 60 : -40), o.by + 620, o.bw * .8, o.bh * .8, { dx: (1 - q) * o.bfrom, rot: -o.rot * 1.4, is: 1.08, z: 3 }); Pb.classList.add('clip');
    tw.classList.add('ink'); tw.style.top = '1420px'; tw.querySelector('.kick').style.color = '#6b6a64';
    reveal(tw, seg(t, a + .1, a + .4), 'side'); tw._u.className = 'strike'; tw._u.style.transform = `scaleX(${E.io(seg(t, a + .45, a + .7))})`;
    tw.style.transform = `translateY(${-10 * loc}px)`; return; }
  const p = E.out5(seg(t, a, a + .35)), q = E.out5(seg(t, a + .12, a + .5)), loc = seg(t, a, b);
  place(P, 0, 0, 1080, 1920, { dx: (1 - p) * o.from, is: 1.14 - .07 * loc, ix: -30 * loc, dark: .28, z: 2 });
  if (o.prev && p < 1) { show(o.prev, true); place(o.prev, 0, 0, 1080, 1920, { dx: -p * o.from, is: 1.07, ix: -30, dark: .28, z: 1 }); }
  place(Pb, o.bx, o.by, o.bw, o.bh, { dx: (1 - q) * o.bfrom, rot: o.rot * (1 - .3 * loc), is: 1.1 - .05 * loc, dark: .05, z: 3 }); Pb.classList.add('ol');
  reveal(tw, seg(t, a + .1, a + .45), 'side'); tw._u.style.transform = `scaleX(${E.io(seg(t, a + .3, a + .6))})`;
  tw.style.transform = `translateY(${-14 * loc}px)`;
}
// collage de cuerpo técnico
const CT = [['r2-c1', 60, 300, 420, 560, -3], ['r2-c2', 560, 260, 460, 600, 2.5], ['r2-c3', 120, 760, 400, 520, 1.5], ['r2-c4', 600, 800, 380, 520, -2], ['r2-c5', 330, 520, 420, 560, 0], ['r2-c6', 60, 1180, 380, 470, 2], ['r2-c7', 620, 1240, 400, 470, -2.5]]
  .map(([s, x, y, w, h, r], i) => ({ el: ph(s, '50% 20%'), x, y, w, h, r, i }));
const tVP = tx('<div class="kick" style="margin-bottom:10px"><span class="mask"><span>NI UN CUERPO TÉCNICO DE</span></span></div><span class="mask"><span><span class="S blue" style="font-size:190px">veinte</span> PERSONAS</span></span>', 860, 'M8 shadow', 120);
function staff(t) {
  const a = T.y1 - .02, b = T.los2 + .45, v = t >= a && t < b; CT.forEach(c => show(c.el, v && t >= a + c.i * .22)); show(tVP, v && t >= T.veinte - .45 && t < T.per + .25);
  if (!v) return;
  if (VB) { show($('paper'), t < T.per + .3); tVP.classList.add('ink'); tVP.querySelector('.kick').style.color = '#6b6a64'; tVP.style.top = '1560px'; }
  const conv = E.io(seg(t, T.per - .05, T.per + .45));     // se van al centro y se comprimen
  CT.forEach(c => { const p = E.out5(seg(t, a + c.i * .22, a + c.i * .22 + .35));
    const cx = 540 - c.w / 2, cy = 960 - c.h / 2;
    place(c.el, lerp(c.x, cx, conv), lerp(c.y, cy, conv), c.w, c.h, { dy: (1 - p) * 90, s: (.9 + .1 * p) * (1 - .82 * conv), rot: c.r * (1 - conv), op: p * (1 - seg(t, T.per + .2, T.per + .45)), z: 2 + c.i, is: 1.1 - .04 * seg(t, a, b), dark: .1 + .35 * seg(t, T.veinte - .4, T.veinte) });
    c.el.classList.add(VB ? 'clip' : 'ol'); if (VB) c.el.style.top = (parseFloat(c.el.style.top) - 120 * (1 - conv)) + 'px'; });
  reveal(tVP, seg(t, T.veinte - .45, T.veinte + .05)); tVP.style.opacity = 1 - seg(t, T.per, T.per + .25); tVP.style.transform = `scale(${1 - .1 * conv})`;
}

// ── 3 · SISTEMA: piezas sueltas que se conectan ──
const AREAS = [['PLANIFICACIÓN', 120, 430], ['SESIONES', 640, 430], ['CARGA', 70, 900], ['PARTIDOS', 690, 900], ['ANÁLISIS', 120, 1370], ['PLANTILLA', 640, 1370]];
const NW = 320, NH = 190;
const NODES = AREAS.map(([n, x, y]) => { const d = document.createElement('div'); d.className = 'node'; d.innerHTML = `<i></i><b>${n}</b>`; $('nodes').appendChild(d);
  for (let k = 0; k < 3; k++) { const l = document.createElement('div'); l.style.cssText = `position:absolute;left:20px;height:8px;border-radius:4px;background:#232937;top:${54 + k * 24}px;width:${[180, 230, 140][k]}px`; d.appendChild(l); }
  return { d, x, y, cx: x + NW / 2, cy: y + NH / 2 }; });
