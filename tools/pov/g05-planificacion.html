<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>html,body{background:transparent}.s{background:transparent}
.card{position:absolute;background:rgba(13,15,20,.86);backdrop-filter:blur(18px);border-radius:34px;color:#f5f5f3;padding:36px 40px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lt{background:#fff;color:#0d0f14}
.ap{animation:ap .5s cubic-bezier(.2,1.2,.4,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}.d5{animation-delay:.6s}
@keyframes ap{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:18px;padding:18px 28px;border-radius:999px;background:rgba(13,15,20,.86);color:#fff;font-weight:800;font-size:40px}
.chip b{width:58px;height:58px;border-radius:50%;background:#2f6bff;display:flex;align-items:center;justify-content:center;font-size:30px}
.cell{border:2px solid #2a303c;padding:10px 14px;font-size:24px;font-weight:700;color:#c9ccd4}
</style></head><body><div class="s"><div style="position:absolute;left:80px;right:80px;top:440px;display:flex;flex-direction:column;gap:18px"><div class="ap d1" style="margin-left:0px;padding:22px 30px;border-radius:24px;background:rgba(13,15,20,.86);color:#fff"><div style="font-weight:800;font-size:40px">Temporada</div><div style="font-size:26px;color:#dfe6ff;margin-top:6px">Objetivos y fases</div></div><div class="ap d2" style="margin-left:50px;padding:22px 30px;border-radius:24px;background:rgba(13,15,20,.86);color:#fff"><div style="font-weight:800;font-size:40px">Mesociclo</div><div style="font-size:26px;color:#dfe6ff;margin-top:6px">4 semanas con un foco</div></div><div class="ap d3" style="margin-left:100px;padding:22px 30px;border-radius:24px;background:#2f6bff;color:#fff"><div style="font-weight:800;font-size:40px">Semana</div><div style="font-size:26px;color:#dfe6ff;margin-top:6px">Sesiones, partido y carga</div></div><div class="ap d4" style="margin-left:150px;padding:22px 30px;border-radius:24px;background:rgba(13,15,20,.86);color:#fff"><div style="font-weight:800;font-size:40px">Sesión</div><div style="font-size:26px;color:#dfe6ff;margin-top:6px">Tareas con minutos</div></div></div></div></body></html>
