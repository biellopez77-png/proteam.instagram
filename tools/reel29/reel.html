<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1x{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1x .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:60px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:96px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}
#fld .ph2{color:#5d6475}
#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
#web{z-index:5}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
.ph.clip{border:14px solid #fbfaf6;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ink{color:#0d0f14!important;text-shadow:none!important}
.strike{position:absolute;left:-4%;right:-4%;top:52%;height:16px;background:#2f6bff;transform-origin:0 50%;border-radius:3px}
.vb .node{background:#fbfaf6;border-color:#d6d2c6;color:#0d0f14}
.vb .node div{background:#e4e0d4!important}

.mk{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#2f6bff;border:5px solid #dfe7ff;display:none;box-shadow:0 8px 22px rgba(47,107,255,.45)}
.att{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#f2f1ec;display:none;box-shadow:0 0 0 10px rgba(242,241,236,.15),0 0 30px rgba(242,241,236,.5)}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel29/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel29/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, o = {}) {
  el.style.left = '0px'; el.style.top = '0px'; el.style.width = '1080px'; el.style.height = '1920px';
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1;
  el._img.style.transformOrigin = o.org || '50% 50%';
  el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  el._sh.style.background = o.grad || `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) { const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d; }
function reveal(el, p) { el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i)); s.style.transform = `translateY(${(1 - q) * 110}%)`; }); }
const M = s => `<span class="mask"><span>${s}</span></span>`;

// ── 1 · GANCHO: lanzamiento en suspensión (Supercopa alemana 2025) + marcador desde el fotograma 0 ──
const LZ = ph('lanzamiento', '74% 50%');
const hK = tx(`<div class="kick" style="color:#e6e8ee">PARTE 2 · MINUTO 23</div>`, 905, 'shadow', 40);
const hA = tx('26–17', 950, 'M8 shadow', 300);
const hB = tx('<span class="S" style="color:#9db8ff">Tira tu lateral.</span>', 1290, 'shadow', 150);
const hU = mk('div', 'position:absolute;left:240px;top:1470px;width:600px;height:10px;background:#2f6bff;border-radius:2px;transform-origin:0 50%;display:none');
function hook(t) {
  const b = T.cinco - .08, v = t < b; [LZ, hK, hA, hB, hU].forEach(e => show(e, v)); if (!v) return;
  const k = t >= T.tira - .04 ? 1 : 0, cam = seg(t, 0, b);
  place(LZ, { is: (k ? 1.24 : 1.08) + .07 * cam, org: k ? '78% 30%' : '50% 50%', grad: 'linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.2) 38%,rgba(0,0,0,.78) 62%,rgba(0,0,0,.86) 100%)' });
  const pulse = Math.exp(-Math.pow((t - T.tira) / .14, 2)); hB.style.transform = `scale(${1 + .07 * pulse})`;
  hA.style.transform = `scale(${1 + .03 * Math.exp(-Math.pow(t / .25, 2))})`;
  hU.style.transform = `scaleX(${E.out5(seg(t, T.tira, T.tira + .35))})`;
  const out = seg(t, b - .1, b); [LZ, hK, hA, hB, hU].forEach(e => e.style.opacity = 1 - out);
}

// ── 2 · LA APP POR DENTRO: seis capturas reales del partido en directo, en orden ──
const PW = 580, PH = 1227, PX = 250, PY = 478, SW = PW - 26, SH = PH - 26;
const PHN = mk('div', `position:absolute;left:${PX}px;top:${PY}px;width:${PW}px;height:${PH}px;border-radius:62px;background:#0b0d12;border:3px solid #2a3040;padding:10px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6);will-change:transform`, '<div id="scr" style="position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4"></div>', $('phones'));
const SC = {}; ['r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'res'].forEach(n => { SC[n] = mk('img', 'position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;display:none', null, $('scr')); SC[n].src = IMG(n); });
const TAP = mk('div', 'position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:rgba(47,107,255,.30);border:6px solid #2f6bff;display:none;z-index:5', '', $('scr'));
const HL = mk('div', 'position:absolute;border:6px solid #2f6bff;border-radius:16px;display:none;z-index:6;box-shadow:0 0 0 6px rgba(47,107,255,.18)', '', $('scr'));
// toques: [inicio, captura en la que se toca, x, y (fracción de la captura), captura siguiente, número, etiqueta]
const STEPS = [[T.quien, 'r1', .775, .708, 'r2', 'Quién'], [T.tiro, 'r2', .5, .685, 'r3', 'Tiro'], [T.desde + .1, 'r3', .67, .72, 'r4', 'Desde dónde'],
  [T.adonde + .1, 'r4', .68, .69, 'r5', 'Adónde va'], [T.gol + .25, 'r5', .28, .846, 'r6', 'Gol o parada']];
const BAND = mk('div', 'position:absolute;left:0;top:0;width:1080px;height:476px;background:linear-gradient(#0d0f14 90%,rgba(13,15,20,0));display:none');
const aK = tx(`<div class="kick">${M('PARTIDO EN DIRECTO · CAPTURAS REALES')}</div>`, 262, '', 40);
const aT = tx(M('<span style="color:#4f86ff">5</span> toques'), 312, 'M8', 112);
const LAB = STEPS.map((s, i) => tx(`<span style="color:#4f86ff">${i + 1}</span>&nbsp; ${s[5]}`, 318, 'M8', 98));
const aG = tx('<span class="S blue">Gol.</span> 27–17', 312, 'M8', 112);
const aR1 = tx('10 tiros · 6 goles', 286, 'M8', 100);
const aR2 = tx('<span class="S blue">y lo sabes al acabar.</span>', 392, '', 72);
const DOTS = STEPS.map((s, i) => mk('div', `position:absolute;left:${PX + i * 118}px;top:456px;width:108px;height:8px;border-radius:5px;background:#232937;display:none`));
function app(t) {
  const a = T.cinco - .08, b = T.banq - .1, v = t >= a && t < b;
  [PHN, BAND, aK, aT, aG, aR1, aR2, TAP, HL, ...LAB, ...DOTS, ...Object.values(SC)].forEach(e => show(e, false)); if (!v) return;
  show($('sysL'), true); show(BAND, true); show(PHN, true); show(aK, true); reveal(aK, seg(t, a, a + .35));
  const p = E.out5(seg(t, a, a + .45)), out = seg(t, b - .12, b);
  // qué captura se ve
  let cur = 'r1', step = -1;
  STEPS.forEach((s, i) => { if (t >= s[0] - .12) step = i; if (t >= s[0] + .2) cur = s[4]; });
  const inRes = t >= T.acabar - .05; if (inRes) cur = 'res';
  show(SC[cur], true);
  // toque
  if (step >= 0 && !inRes) { const s = STEPS[step], q = seg(t, s[0], s[0] + .34);
    if (t >= s[0] && q < 1 && cur === s[1]) { show(TAP, true); TAP.style.left = s[2] * SW + 'px'; TAP.style.top = s[3] * SH + 'px'; TAP.style.transform = `scale(${.45 + .75 * E.out(q)})`; TAP.style.opacity = 1 - q * q; } }
  // rótulos
  const gol = t >= T.v27 - .08;
  if (inRes) { show(aR1, true); show(aR2, t >= T.seis - .1); aR1.style.opacity = E.out(seg(t, T.acabar - .05, T.acabar + .25)) * (1 - out); aR2.style.opacity = E.out(seg(t, T.seis - .1, T.seis + .2)) * (1 - out); }
  else if (gol) { show(aG, true); aG.style.transform = `scale(${1 + .08 * Math.exp(-Math.pow((t - T.v27) / .14, 2))})`; }
  else if (step >= 0) { const L = LAB[step]; show(L, true); const q = E.out5(seg(t, STEPS[step][0] - .12, STEPS[step][0] + .14)); L.style.transform = `translateY(${(1 - q) * 26}px)`; L.style.opacity = q; }
  else { show(aT, true); reveal(aT, seg(t, a, a + .35)); }
  DOTS.forEach((d, i) => { show(d, !inRes && !gol); d.style.background = i <= step && t >= STEPS[i][0] ? '#2f6bff' : '#232937'; });
  aK.style.opacity = inRes ? 0 : 1; BAND.style.height = (inRes ? 530 : 476) + 'px'; BAND.style.background = inRes ? 'linear-gradient(#0d0f14 93%,rgba(13,15,20,0))' : 'linear-gradient(#0d0f14 90%,rgba(13,15,20,0))';
  // cámara del móvil: entra, se acerca al marcador en «Veintisiete» y a la fila del 6/10 en el resumen
  const zs = E.io(seg(t, T.v27 - .1, T.v27 + .3)) * (1 - E.io(seg(t, T.acabar - .25, T.acabar)));
  const zr = E.out(seg(t, T.acabar - .05, T.acabar + .3));
  PHN.style.transformOrigin = inRes ? '36% 64.7%' : '50% 5%';
  PHN.style.transform = `translateY(${(1 - p) * 700 + 130 * zs - 130 * zr}px) scale(${1 + .62 * zs + .68 * zr + .09 * seg(t, T.acabar, b) + .03 * seg(t, T.gol + .45, T.v27)})`; PHN.style.opacity = 1 - out;
  if (gol && !inRes) { show(HL, true); HL.style.left = .26 * SW + 'px'; HL.style.top = .044 * SH + 'px'; HL.style.width = .48 * SW + 'px'; HL.style.height = .066 * SH + 'px'; HL.style.opacity = E.out(seg(t, T.v27 + .05, T.v27 + .3)); }
  if (inRes && t >= T.sabes + .45) { show(HL, true); HL.style.left = .03 * SW + 'px'; HL.style.top = .628 * SH + 'px'; HL.style.width = .68 * SW + 'px'; HL.style.height = .04 * SH + 'px'; HL.style.opacity = E.out(seg(t, T.sabes + .45, T.sabes + .75)); }
}

// ── 3 · PREGUNTA: tiempo muerto del Flensburg-Handewitt ──
const BQ = ph('banquillo', '50% 40%');
const qK = tx(`<div class="kick" style="color:#e6e8ee">${M('PREGUNTA PARA TU STAFF')}</div>`, 600, 'shadow', 40);
const q1 = tx(M('¿Quién apunta'), 670, 'M8 shadow', 132);
const q2 = tx(M('<span class="S" style="color:#9db8ff">los tiros en tu banquillo?</span>'), 840, 'shadow', 96);
function preg(t) {
  const a = T.banq - .1, b = T.asi - .1, v = t >= a && t < b; [BQ, qK, q1, q2].forEach(e => show(e, v)); if (!v) return;
  place(BQ, { is: 1.12 + .08 * seg(t, a, b), dark: .62, z: 2 });
  reveal(qK, seg(t, a, a + .3)); reveal(q1, seg(t, a + .05, a + .35)); reveal(q2, seg(t, T.apunta - .25, T.apunta + .1));
  const out = seg(t, b - .1, b); [BQ, qK, q1, q2].forEach(e => e.style.opacity = 1 - out);
}

// ── 4 · MARCA + CTA: la app y «Comenta…» sobre la foto del principio (bucle) ──
const LZ2 = ph('lanzamiento', '74% 50%');
const PH2 = mk('div', `position:absolute;left:340px;top:700px;width:400px;height:844px;border-radius:50px;background:#0b0d12;border:3px solid #2a3040;padding:9px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)`, `<div style="position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#f6f6f4"><img src="${IMG('r6')}" style="position:absolute;left:0;top:0;width:100%;height:100%"></div>`, $('phones'));
const mK = tx(`<div class="kick" style="color:#e6e8ee">${M('ASÍ SE REGISTRA UN PARTIDO EN')}</div>`, 330, 'shadow', 40);
const mT = tx(M('<span class="S blue">la app de ProTeam</span>'), 380, 'shadow', 138);
const cA = tx(M('Comenta'), 300, 'M8 shadow', 150);
const CH = ['tu deporte', 'tu categoría', 'tus días'].map((s, i) => mk('div', `position:absolute;left:190px;top:${520 + i * 150}px;width:700px;height:122px;border-radius:61px;border:3px solid #4f86ff;background:rgba(13,15,20,.72);color:#fff;font-family:M;font-weight:800;font-size:66px;letter-spacing:-.03em;line-height:116px;text-align:center;display:none`, s));
const cB = tx(M('<span class="S" style="color:#9db8ff">y te preparo</span>'), 1010, 'shadow', 112);
const cC = tx(M('<span class="S" style="color:#9db8ff">la primera semana.</span>'), 1130, 'shadow', 112);
const cL = tx(`<div class="kick" style="color:#e6e8ee">${M('LISTA DE ESPERA · HASTA EL 27 NOV')}</div>`, 1400, 'shadow', 36);
const cG = tx(M('<span class="S blue">3 meses gratis.</span>'), 1450, 'shadow', 104);
function cta(t) {
  const a = T.asi - .1, c = T.com - .1, v = t >= a; [LZ2, PH2, mK, mT, cA, cB, cC, cL, cG, ...CH].forEach(e => show(e, false)); if (!v) return;
  show(LZ2, true); place(LZ2, { is: 1.1 + .08 * seg(t, a, T.END), dark: .84, z: 2 });
  if (t < c) { [PH2, mK, mT].forEach(e => show(e, true)); const p = E.out5(seg(t, a, a + .45)), out = seg(t, c - .12, c);
    reveal(mK, seg(t, a, a + .3)); reveal(mT, seg(t, a + .15, a + .5));
    PH2.style.transform = `translateY(${(1 - p) * 700 + out * 300}px) scale(${1 + .05 * seg(t, a, c)})`; [PH2, mK, mT].forEach(e => e.style.opacity = 1 - out); return; }
  show(cA, true); reveal(cA, seg(t, c, c + .3));
  const ts = [T.com + .42, T.cat, T.cat + .72];
  CH.forEach((d, i) => { const on = t >= ts[i] - .08; show(d, on); const q = E.out5(seg(t, ts[i] - .08, ts[i] + .22)); d.style.transform = `translateY(${(1 - q) * 40}px) scale(${.94 + .06 * q})`; d.style.opacity = q; });
  show(cB, t >= T.prep - .1); show(cC, t >= T.prep + .25); reveal(cB, seg(t, T.prep - .1, T.prep + .2)); reveal(cC, seg(t, T.prep + .25, T.prep + .55));
  const g = T.prep + .85; show(cL, t >= g); show(cG, t >= g + .15); reveal(cL, seg(t, g, g + .3)); reveal(cG, seg(t, g + .15, g + .5));
  cG.style.transform = `scale(${1 + .04 * seg(t, g, T.END)})`;
}

window.frame = t => {
  show($('sysL'), false); show($('paper'), false);
  hook(t); app(t); preg(t); cta(t);
