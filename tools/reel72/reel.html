<style>

.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}

.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}

#sysL{background:#0d0f14}

</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">08</b><span>DÍAS</span></div><div><b id="cd2">12</b><span>HORAS</span></div><div><b id="cd3">29</b><span>MIN</span></div><div><b id="cd4">59</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel72/times.js"></script>
<script>

const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel72/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, o = {}) {
  el.style.left = '0px'; el.style.top = '0px'; el.style.width = '1080px'; el.style.height = '1920px';
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1;
  el._img.style.transformOrigin = o.org || '50% 50%';
  el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  el._sh.style.background = o.grad || `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) { const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d; }
function reveal(el, p) { el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i)); s.style.transform = `translateY(${(1 - q) * 110}%)`; }); }
const M = s => `<span class="mask"><span>${s}</span></span>`;


// u72 · CONTEXTO · Reel de datos corto (versión corta de u52) · concepto: «tres franjas, un lunes» — tres franjas verticales a sangre
// (Unai Simón con España, Kawhi Leonard en las Finales de la NBA, Tobias Reichmann en la Bundesliga de balonmano). Cada franja se
// enciende con su número (11 · 5 · 7) en la palabra exacta; en «lunes» (golpe de música) las tres se juntan, se apagan y cae una sola
// hoja de lunes con tres casillas (SEMANA · CONVOCATORIA · MINUTOS) que se marcan; «ProTeam.» para los tres; cierre de la lista con contador.
const pulse = (t, t0, a = .06) => 1 + a * Math.exp(-Math.pow((t - t0 - .12) / .14, 2));
const SPS = [['fut', '50% 30%', '11', 'FÚTBOL'], ['bal', '45% 30%', '5', 'BALONCESTO'], ['bm', '42% 40%', '7', 'BALONMANO']];
const ST = SPS.map(([n, pos]) => ph(n, pos));
const NUM = SPS.map(([, , n], i) => tx(n, 0, 'M8 shadow', 300));
const LAB = SPS.map(([, , , l], i) => tx(`<div class="kick" style="color:#e6e8ee;font-size:30px;letter-spacing:.16em">${l}</div>`, 0, 'shadow', 30));
const KEYS = () => [T.once, T.cinco, T.siete];
function strips(t, merge, dim) {
  // merge 0 → tres franjas de 360 px; 1 → juntas en el centro (ancho 0) y apagadas
  ST.forEach((el, i) => { show(el, true); place(el, { is: 1.12 + .05 * seg(t, 0, 6), org: '50% 40%', dark: dim[i], z: 1 });
    const w = 360 * (1 - merge) + 2 * merge, x = i * 360 * (1 - merge) + 539 * merge;
    el.style.width = w + 'px'; el.style.left = x + 'px'; el.style.borderRight = i < 2 ? '4px solid #000' : 'none'; });
}
// ── A · 11 · 5 · 7 (fotograma 0: las tres franjas y el 11 ya puesto) ──
const aK = tx('<div class="kick" style="color:#e6e8ee;letter-spacing:.24em">EN JUEGO</div>', 300, 'shadow', 40);
function sA(t) {
  const b = T.tres - .04, v = t < b; show(aK, v); NUM.forEach(e => show(e, false)); LAB.forEach(e => show(e, false)); if (!v) return;
  const K = KEYS(); const dim = K.map((k, i) => (i === 0 || t >= k - .05) ? .25 : .72);
  strips(t, 0, dim);
  K.forEach((k, i) => { const on = i === 0 || t >= k - .05; show(NUM[i], on); show(LAB[i], on);
    const q = i === 0 ? 1 : E.out5(seg(t, k - .05, k + .2));
    NUM[i].style.width = '360px'; NUM[i].style.left = (i * 360) + 'px'; NUM[i].style.top = '820px';
    NUM[i].style.opacity = q; NUM[i].style.transform = `scale(${(1.3 - .3 * q) * pulse(t, k - .05, .07)})`; NUM[i].style.color = i === 1 ? '#4f86ff' : '#fff';
    LAB[i].style.width = '360px'; LAB[i].style.left = (i * 360) + 'px'; LAB[i].style.top = '1160px'; LAB[i].style.opacity = q; });
}
// ── B · TRES DEPORTES · EL MISMO LUNES (golpe en «lunes») ──
const bK = tx('<div class="kick" style="color:#e6e8ee;letter-spacing:.24em">TRES DEPORTES</div>', 640, 'shadow', 44);
const bM = tx(M('EL MISMO'), 700, 'M8 shadow', 120);
const bL = tx(M('<span class="S blue">lunes.</span>'), 830, 'shadow', 260);
const SHEET = mk('div', 'position:absolute;left:150px;width:780px;height:640px;top:1120px;border-radius:34px;background:#f2f1ec;display:none;box-shadow:0 30px 70px rgba(0,0,0,.55)',
  ['SEMANA', 'CONVOCATORIA', 'MINUTOS'].map((w, i) => `<div style="position:absolute;left:60px;top:${70 + i * 190}px;width:660px;height:150px">
    <div class="bx" style="position:absolute;left:0;top:30px;width:90px;height:90px;border-radius:20px;border:5px solid #0d0f14"></div>
    <svg class="ck" viewBox="0 0 90 90" style="position:absolute;left:0;top:30px;width:90px;height:90px"><path d="M18 47l17 17 37-40" fill="none" stroke="#2f6bff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="90"/></svg>
    <div style="position:absolute;left:130px;top:38px;font-family:M;font-weight:800;font-size:64px;letter-spacing:-.03em;color:#0d0f14">${w}</div></div>`).join(''), $('cards'));
const CK = [...SHEET.querySelectorAll('.ck path')];
function sB(t) {
  const a = T.tres - .04, b = T.por - .04, v = t >= a && t < b; [bK, bM, bL].forEach(e => show(e, v)); show(SHEET, v); if (!v) return;
  const mg = E.io(seg(t, T.lunes - .1, T.lunes + .35));
  strips(t, mg, [.6, .6, .6].map(d => d + .3 * mg));
  // tras el golpe, fondo: la franja de baloncesto abierta a pantalla completa, muy oscura y en movimiento
  if (mg >= 1) { ST.forEach((el, i) => show(el, i === 1)); place(ST[1], { is: 1.3 + .12 * seg(t, T.lunes, b), iy: -30 * seg(t, T.lunes, b), org: '50% 30%', dark: .8, z: 1 }); }
  bK.style.opacity = E.out(seg(t, a, a + .25)); show(bM, t >= T.mismo - .1); reveal(bM, seg(t, T.mismo - .1, T.mismo + .2));
  const up = E.io(seg(t, T.semana - .45, T.semana - .1));
  [bK, bM, bL].forEach((e, i) => e.style.top = ([640, 700, 830][i] - 380 * up) + 'px');
  show(bL, t >= T.lunes - .05); reveal(bL, seg(t, T.lunes - .05, T.lunes + .25)); bL.style.transform = `scale(${pulse(t, T.lunes - .05, .07)})`;
  const sp = E.out5(seg(t, T.semana - .12, T.semana + .25)); SHEET.style.opacity = sp; SHEET.style.top = (1120 - 300 * sp + 40 * (1 - sp)) + 'px';
  SHEET.style.transform = `rotate(${-2 + 2 * sp}deg)`;
  [T.semana, T.conv, T.min].forEach((k, i) => CK[i].setAttribute('stroke-dashoffset', 90 * (1 - E.out(seg(t, k - .05, k + .25)))));
  const fl = Math.exp(-Math.pow((t - T.lunes) / .07, 2)); $('grain').style.opacity = .05 + .25 * fl;
}
// ── C · ProTeam. para los tres · abre el sábado 28 ──
const cK = tx('<div class="kick" style="color:#e6e8ee;letter-spacing:.24em">POR ESO</div>', 600, 'shadow', 44);
const cP = tx('ProTeam.', 660, 'M8 shadow', 220);
const cT = tx(M('<span class="S blue">para los tres.</span>'), 920, 'shadow', 130);
const cD = tx('<div class="kick" style="color:#c9cfdb;letter-spacing:.22em">ABRE EL SÁB 28 NOV</div>', 1500, 'shadow', 40);
function sC(t) {
  const a = T.por - .04, b = T.camp - .05, v = t >= a && t < b; [cK, cP, cT, cD].forEach(e => show(e, v)); if (!v) return;
  // vuelven las tres franjas (bucle con el principio), oscurecidas
  const op = E.io(seg(t, a, a + .4)); strips(t, 1 - op, [.62, .62, .62]);
  cK.style.opacity = E.out(seg(t, a, a + .25)); const q = E.out5(seg(t, T.pt - .1, T.pt + .2)); show(cP, t >= T.pt - .1); cP.style.opacity = q;
  cP.style.transform = `scale(${(1.15 - .15 * q) * pulse(t, T.pt - .1, .05)})`;
  show(cT, t >= T.tres2 - .15); reveal(cT, seg(t, T.tres2 - .15, T.tres2 + .15));
  cD.style.opacity = E.out(seg(t, T.tres2, T.tres2 + .3));
}

// ── 5 · CIERRE (v3, 17/11, encargo de Andrés): la entrada en la lista de espera con el contador (misma animación de u28 v3, u30 y u09) ──
// el contador sale de lo que falta de verdad cuando se publica (jue 19/11 11:30 → vie 27/11 23:59:59 = 8 d 12 h 29 min 59 s)
let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const W = { web: T.camp - .05 }; W.tap = W.web + 1.15; W.ok = W.tap + .22; W.gal = T.gra - .1;
const PT = Array.from({ length: 22 }, () => { const o = document.createElement('div'); const a = rnd() * Math.PI * 2, r = 160 + rnd() * 260;
  o.style.cssText = `position:absolute;left:0;top:0;width:${10 + rnd() * 10}px;height:${10 + rnd() * 10}px;border-radius:50%;background:${rnd() < .7 ? '#2f6bff' : '#f2f1ec'};display:none;margin-left:${470 + 70}px;margin-top:0px`;
  o._dx = Math.cos(a) * r; o._dy = Math.sin(a) * r * .7; $('web').appendChild(o); return o; });
const GA = ph('bal', '50% 30%');
const tHE = tx('<span class="mask"><span>HASTA EL</span></span>', 1130, 'M8 shadow', 70);
const t28 = tx('<span class="mask"><span>27 NOV</span></span>', 1220, 'M8 shadow', 230);
const t3M = tx('<span class="mask"><span class="S blue">3 meses gratis.</span></span>', 800, 'shadow', 180);
function webcta(t) {
  const wv = t >= W.web && t < W.gal; show($('web'), wv);
  if (wv) {
    const p = E.out5(seg(t, W.web, W.web + .4));
    $('wp').style.top = (470 + (1 - p) * 120) + 'px'; $('wp').style.opacity = p;
    [...$('wp').children].forEach((c, i) => { const q = E.out(seg(t, W.web + i * .04, W.web + .28 + i * .04)); c.style.opacity = q; c.style.transform = `translateY(${(1 - q) * 40}px)`; });
    const pg = (t * 1.4) % 1; $('ping').style.transform = `scale(${1 + pg * 1.6})`; $('ping').style.opacity = 1 - pg;
    const total0 = ((8 * 24 + 12) * 60 + 29) * 60 + 59 - Math.floor(t - W.web);
    const acc = E.in(seg(t, W.web + .3, W.gal - .08)); const rem = Math.max(0, Math.round(total0 * (1 - acc)));
    const dd = Math.floor(rem / 86400), hh = Math.floor(rem % 86400 / 3600), mm = Math.floor(rem % 3600 / 60), ss = rem % 60;
    [['cd1', dd], ['cd2', hh], ['cd3', mm], ['cd4', ss]].forEach(([id, v]) => { const el = $(id); const nv = String(v).padStart(2, '0'); if (el.textContent !== nv) { el._ch = t; el.textContent = nv; } el.style.color = rem === 0 ? '#4f86ff' : '#f2f1ec';
      const q = E.out(seg(t, el._ch || -9, (el._ch || -9) + .18)); el.style.transform = `translateY(${(1 - q) * -22}px)`; el.style.opacity = .35 + .65 * q; });
    PT.forEach((o, i) => { const q = seg(t, W.ok + .15, W.ok + .85); o.style.display = q > 0 && q < 1 ? 'block' : 'none'; if (q > 0 && q < 1) { const e = E.out(q); o.style.transform = `translate(${o._dx * e}px,${o._dy * e + 120 * q * q}px) scale(${1 - q})`; o.style.opacity = 1 - q; } });
    const z = seg(t, W.gal - .12, W.gal); $('wp').querySelector('.cd').style.transform = `scale(${1 + .05 * Math.sin(z * Math.PI)})`;
    const fl = $('fld'), bt = $('btn'), wp = $('wp'); const top = parseFloat(wp.style.top);
    const fy = top + fl.offsetTop + 75, by = top + bt.offsetTop + 80;
