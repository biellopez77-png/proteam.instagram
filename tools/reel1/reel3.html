<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#000}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0}
.w{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none}
.sub{font-family:M;font-weight:700;font-size:60px;letter-spacing:-.025em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.big{font-family:M;font-weight:800;letter-spacing:-.05em}
.it{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.c{display:inline-block;white-space:pre}
.lab{position:absolute;left:0;width:1080px;text-align:center;display:none}
.lab .t{position:relative;display:inline-block;font-family:M;font-weight:800;font-size:66px;letter-spacing:.04em;color:#fff;padding:0 6px;text-shadow:0 3px 22px rgba(0,0,0,.6)}
.lab .u{position:absolute;left:0;right:0;bottom:-16px;height:12px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
#type{font-family:M;font-weight:500;font-size:54px;letter-spacing:-.02em;color:#fff}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1 .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:56px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:76px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}
#fld .ph2{color:#5d6475}
#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
</style></head><body>
<div id="st">
  <div class="L" id="white" style="background:#f5f5f3"></div>
  <div id="phs" style="position:absolute;inset:0"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="h1">Entra antes de<br>que <span class="it">se cierre.</span></div>
    <div class="cd"><div><b id="cd1">13</b><span>DÍAS</span></div><div><b id="cd2">08</b><span>HORAS</span></div><div><b id="cd3">21</b><span>MIN</span></div><div><b id="cd4">40</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
    <div id="note">Sin tarjeta · Solo con tu cuenta</div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="mid" style="position:absolute;inset:0"></div>
  <div id="txt" style="position:absolute;inset:0"></div>
</div>
<script>
// tiempos sacados de la locución (toma 1, Raúl García)
const T = {
  type0: .05, type1: 1.35, col0: 1.45, s2: 1.96, g: 2.84, ta: 3.82, s3: 5.06, cnt0: 5.12, cnt1: 6.55, hor: 6.0, s4: 7.30,
  rec: 8.78, sino: 9.74, como: 10.26, uti: 10.80, s6: 11.96, met: 13.48, her: 14.48, s7: 17.06,
  exc: 18.18, wha: 18.98, lib: 19.70, doc: 20.38, cut: 21.22, sis: 23.28, s9: 24.26, pt: 24.46,
  web: 25.40, tap: 27.30, ok: 27.95, gal: 28.46, d28: 29.14, s11: 30.55, tres: 31.16, END: 33.6,
};
window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, back: p => { const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); } };
let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };

function ph(src, x, y, w, h, o = {}) {
  const d = document.createElement('div'); d.className = 'ph';
  Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  if (o.shadow) d.style.boxShadow = '0 30px 80px rgba(0,0,0,.55)';
  const im = document.createElement('img'); im.src = '/tools/reel1/img/' + src + '.jpg'; im.style.objectPosition = o.pos || '50% 50%';
  if (o.og) im.style.transformOrigin = o.og;
  d.appendChild(im);
  if (o.shade) { const s = document.createElement('div'); s.className = 'sh'; s.style.background = o.shade; d.appendChild(s); }
  (o.parent || $('phs')).appendChild(d); d._img = im; return d;
}
// palabra que entra letra a letra con desenfoque (estilo @unrespiro)
const W = [];
function word(tin, tout, y, parts, cls, size, o = {}) {
  const d = document.createElement('div'); d.className = 'w ' + cls; d.style.top = y + 'px'; if (size) d.style.fontSize = size + 'px';
  if (o.color) d.style.color = o.color; if (o.noshadow) d.style.textShadow = 'none'; $('txt').appendChild(d);
  const chars = []; (Array.isArray(parts) ? parts : [[parts, '']]).forEach(([txt, c2]) => { [...txt].forEach(ch => { const s = document.createElement('span'); s.className = 'c ' + (c2 || ''); s.textContent = ch; d.appendChild(s); chars.push(s); }); });
  const r = { el: d, tin, tout, chars, st: Math.min(.03, (o.spread || .28) / chars.length), o }; W.push(r); return r;
}
function animW(r, t) {
  const v = t >= r.tin && t < r.tout; show(r.el, v); if (!v) return;
  r.el.style.transform = `scale(${1 + (r.o.zoom || .04) * seg(t, r.tin, r.tout)})`;
  r.chars.forEach((c, k) => { const a = r.tin + k * r.st; const p = E.out(seg(t, a, a + .3)); c.style.opacity = p; c.style.filter = p < .99 ? `blur(${(1 - p) * 14}px)` : 'none'; c.style.transform = `translateX(${(1 - p) * 26}px)`; });
}

let C1, B2, S4, S6, C7, GAL, Q, CNT, TICKS;
function build() {
  // 1 · máquina de escribir; las fotos entran cuando termina «ellos»
  const ty = document.createElement('div'); ty.className = 'w'; ty.id = 'type'; ty.style.top = '920px'; ty.innerHTML = '<span id="tyt"></span><span class="caret" id="tyc"></span>'; $('txt').appendChild(ty);
  C1 = [['e01', 30, 170, 1000, 1360, -2.5, '50% 30%'], ['e11', -50, 230, 1060, 1500, 2, '50% 20%'], ['e05', 20, 120, 1040, 1560, -1.5, '50% 22%'], ['e13', -90, 420, 1260, 1000, 2.5, '45% 40%'], ['e09', 10, 200, 1080, 1420, -2, '50% 30%'], ['e02', -30, 100, 1140, 1700, 1.5, '50% 22%']]
    .map(([s, x, y, w, h, r, pos], i) => ({ el: ph(s, x, y, w, h, { pos, shadow: 1 }), t0: T.col0 + i * .085, r, from: i % 2 ? 1 : -1 }));
  // 2 · tres franjas con subrayado
  B2 = [['e06', 0, '50% 14%', 'TIENES', T.s2], ['e03', 640, '50% 22%', 'GANAS', T.g], ['e04', 1280, '62% 30%', 'TALENTO', T.ta]]
    .map(([s, y, pos, lab, t0]) => {
      const el = ph(s, 0, y, 1080, 640, { pos, shade: 'linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)' });
      const l = document.createElement('div'); l.className = 'lab'; l.style.top = (y + 500) + 'px'; l.innerHTML = `<span class="t">${lab}<span class="u"></span></span>`; $('txt').appendChild(l);
      return { el, t0, l, u: l.querySelector('.u'), tx: l.querySelector('.t') };
    });
  // 3 · reloj de 24 h
  CNT = document.createElement('div'); CNT.style.cssText = 'position:absolute;left:0;top:520px;width:1080px;height:880px;display:none';
  const R = 330, C = 2 * Math.PI * R;
  let ticks = ''; for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2 - Math.PI / 2, l = i % 6 ? 16 : 32; ticks += `<line class="tk" x1="${540 + Math.cos(a) * (R - 34)}" y1="${440 + Math.sin(a) * (R - 34)}" x2="${540 + Math.cos(a) * (R - 34 - l)}" y2="${440 + Math.sin(a) * (R - 34 - l)}" stroke="#fff" stroke-width="${i % 6 ? 4 : 6}" stroke-linecap="round"/>`; }
  CNT.innerHTML = `<svg width="1080" height="880" style="position:absolute;left:0;top:0">
      <circle cx="540" cy="440" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/>${ticks}
      <circle id="ring" cx="540" cy="440" r="${R}" fill="none" stroke="#2f6bff" stroke-width="10" stroke-linecap="round" transform="rotate(-90 540 440)" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      <circle id="head" cx="540" cy="${440 - R}" r="16" fill="#fff"/></svg>
    <div style="position:absolute;left:0;top:330px;width:1080px;text-align:center;color:#fff;font-family:M;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums">
      <span id="num" style="font-size:210px;display:inline-block">00</span><span id="hh" style="font-family:S;font-style:italic;font-size:150px;color:#4f86ff;margin-left:10px">h</span></div>`;
  $('mid').appendChild(CNT); CNT._C = C; TICKS = [...CNT.querySelectorAll('.tk')];
  word(T.hor, T.s4, 1430, 'horas', 'sub', 64);
  // 4 · recursos: foto sobre blanco → ?
  S4 = ph('e10', 90, 380, 900, 900, { pos: '50% 40%', shadow: 1 });
  word(T.rec, T.sino + .02, 1370, 'tus recursos', 'sub', 74, { color: '#0b0b0c', noshadow: 1 });
  Q = document.createElement('div'); Q.className = 'w it'; Q.style.cssText = 'top:560px;font-size:760px;line-height:1;color:#2f6bff'; Q.textContent = '?'; $('mid').appendChild(Q);
  word(T.como, T.uti, 760, 'cómo', 'it', 330, { color: '#0b0b0c', zoom: .06 });
  word(T.uti, T.s6, 760, 'utilizas', 'it', 300, { color: '#0b0b0c', zoom: .06 });
  // 6 · ellos en acción
  S6 = [['e08', '50% 20%', '50% 25%', 1.15], ['e12', '50% 45%', '50% 55%', 1.2], ['e07', '45% 20%', '40% 25%', 1.15], ['e14', '50% 30%', '50% 40%', 1.1], ['e04', '55% 60%', '55% 72%', 1.6], ['e13', '45% 40%', '45% 40%', 1.2], ['e09', '50% 30%', '50% 30%', 1.15], ['e01', '50% 25%', '50% 25%', 1.2]]
    .map(([s, p, og, z], i) => { const el = ph(s, 0, 0, 1080, 1920, { pos: p, og }); return { el, t: T.s6 + i * ((T.s7 - T.s6) / 8), z }; });
  word(T.met, T.her - .02, 1460, 'metodología', 'sub', 92);
  word(T.her, T.s7, 1460, 'herramientas', 'sub', 92);
  // 7 · tú: collage de herramientas que se acelera hasta negro seco
  const L7 = ['t29', 't57', 't35', 't03', 't34', 't21', 't24', 't39', 't60', 't20', 't38', 't29', 't57', 't35', 't03', 't21', 't24', 't39', 't34', 't60', 't20', 't57', 't03', 't35', 't29', 't24', 't21', 't39'];
  let tt = T.s7, gap = .5; C7 = [];
  L7.forEach(s => { const w = 980 + rnd() * 220, h = w * 1.62, x = 540 - w / 2 + (rnd() - .5) * 160, y = 960 - h / 2 + (rnd() - .5) * 200;
    C7.push({ el: ph(s, x, y, w, h, { shadow: 1 }), t0: tt, r: (rnd() - .5) * 10 }); tt += gap; gap = Math.max(.045, gap * .88); });
  C7 = C7.filter(c => c.t0 < T.cut);
  word(T.exc, T.wha - .02, 1500, 'Excel', 'sub', 84); word(T.wha, T.lib - .02, 1500, 'WhatsApp', 'sub', 84);
  word(T.lib, T.doc - .02, 1500, 'libretas', 'sub', 84); word(T.doc, T.cut, 1500, 'documentos', 'sub', 84);
  // 8 · SISTEMA sobre negro
  word(T.sis, T.s9, 860, 'SISTEMA', 'big', 210, { color: '#fff', spread: .25, zoom: .06 });
  // 9 · ProTeam
  word(T.pt, T.web, 840, 'ProTeam', 'big', 200, { color: '#0b0b0c', spread: .45, zoom: .05, noshadow: 1 });
  // 10 · galería final con palabras encima
  const G = [['e02', '50% 20%'], ['e03', '50% 25%'], ['e05', '50% 22%'], ['e07', '45% 20%']];
  GAL = G.map(([s, p], i) => ({ el: ph(s, 0, 0, 1080, 1920, { pos: p, shade: 'rgba(0,0,0,.38)' }), t: T.gal + i * ((T.s11 - T.gal) / G.length) }));
  word(T.gal + .05, T.s11, 780, 'antes del', 'sub', 64);
  word(T.d28, T.s11, 860, '28.11', 'big', 300, { color: '#fff', zoom: .06 });
  // 11 · cierre en negro
  word(T.tres, T.END, 820, [['3 meses ', ''], ['gratis.', '']], 'it', 190, { color: '#2f6bff', spread: .7, zoom: .06, noshadow: 1 });
}

window.frame = t => {
  show($('white'), (t >= T.s4 && t < T.s6) || (t >= T.s9 && t < T.web));
  // 1
  const txt = 'no eres diferente a ellos.'; const n = Math.floor(txt.length * seg(t, T.type0, T.type1));
  show($('type'), t < T.col0 + .1); $('tyt').textContent = txt.slice(0, n); $('tyc').style.opacity = Math.floor(t * 4) % 2 ? 1 : .15;
  C1.forEach(c => { const v = t >= c.t0 && t < T.s2; show(c.el, v); if (!v) return; const p = E.out(seg(t, c.t0, c.t0 + .22));
    c.el.style.transform = `translate(${(1 - p) * 700 * c.from}px,${(1 - p) * 120}px) rotate(${c.r * p}deg) scale(${1 + .03 * seg(t, c.t0, T.s2)})`; });
  // 2
  B2.forEach(b => { const v = t >= b.t0 && t < T.s3; show(b.el, v); show(b.l, v); if (!v) return; const p = E.out(seg(t, b.t0, b.t0 + .3));
    b.el.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; b.el._img.style.transform = `scale(${1.12 - .08 * seg(t, b.t0, T.s3)})`;
    const q = E.out(seg(t, b.t0 + .12, b.t0 + .42)); b.tx.style.opacity = q; b.tx.style.filter = q < .99 ? `blur(${(1 - q) * 12}px)` : 'none';
    b.u.style.transform = `scaleX(${E.io(seg(t, b.t0 + .3, b.t0 + .65))})`; });
  // 3 · reloj
  const cv = t >= T.s3 && t < T.s4; show(CNT, cv);
  if (cv) {
    const p = E.io(seg(t, T.cnt0, T.cnt1)), h = 24 * p;
    $('num').textContent = String(Math.min(24, Math.floor(h + 1e-6))).padStart(2, '0');
    $('ring').setAttribute('stroke-dashoffset', CNT._C * (1 - p));
    const a = p * Math.PI * 2 - Math.PI / 2; $('head').setAttribute('cx', 540 + Math.cos(a) * 330); $('head').setAttribute('cy', 440 + Math.sin(a) * 330);
    $('head').setAttribute('opacity', p > 0 && p < 1 ? 1 : 0);
    TICKS.forEach((l, i) => { const on = seg(h, i, i + .6); l.setAttribute('opacity', .18 + .82 * on); });
    const fin = seg(t, T.cnt1, T.cnt1 + .35); const pulse = Math.sin(fin * Math.PI) * .06;
    $('num').style.transform = `scale(${1 + pulse})`;
    const a0 = E.out(seg(t, T.s3, T.s3 + .3)); CNT.style.opacity = a0; CNT.style.transform = `scale(${.92 + .08 * a0 + .025 * seg(t, T.s3, T.s4)})`;
  }
  // 4
  const s4v = t >= T.s4 + .05 && t < T.sino; show(S4, s4v);
  if (s4v) { const p = E.out(seg(t, T.s4 + .05, T.s4 + .4)); S4.style.transform = `translateY(${(1 - p) * 160}px) scale(${.96 + .04 * p + .03 * seg(t, T.s4, T.sino)})`; S4.style.opacity = clamp(p * 1.4); }
  const qv = t >= T.sino && t < T.como; show(Q, qv);
  if (qv) { const p = E.back(seg(t, T.sino, T.sino + .35)); Q.style.opacity = clamp(p * 1.5); Q.style.transform = `scale(${.4 + .6 * p})`; }
  // 6
  S6.forEach((s, i) => { const b = i + 1 < S6.length ? S6[i + 1].t : T.s7; const v = t >= s.t && t < b; show(s.el, v); if (!v) return;
    s.el._img.style.transform = `scale(${s.z + .06 - .06 * seg(t, s.t, b)})`; });
  // 7
  C7.forEach((c, i) => { const v = t >= c.t0 && t < T.cut; show(c.el, v); if (!v) return; const p = E.out(seg(t, c.t0, c.t0 + .12));
    c.el.style.transform = `translateY(${(1 - p) * 220}px) rotate(${c.r}deg) scale(${1.06 - .06 * p})`; c.el.style.zIndex = i; });
  // 9 · web oscura
  const wv = t >= T.web && t < T.gal; show($('web'), wv);
  if (wv) {
    const p = E.out5(seg(t, T.web, T.web + .55));
    $('wp').style.top = (300 + (1 - p) * 120) + 'px'; $('wp').style.opacity = p;
    [...$('wp').children].forEach((c, i) => { const q = E.out(seg(t, T.web + i * .07, T.web + .45 + i * .07)); c.style.opacity = q; c.style.transform = `translateY(${(1 - q) * 40}px)`; });
    const pg = (t * 1.4) % 1; $('ping').style.transform = `scale(${1 + pg * 1.6})`; $('ping').style.opacity = 1 - pg;
    $('cd4').textContent = String(((40 - Math.floor(t - T.web)) % 60 + 60) % 60).padStart(2, '0');
    // cursor
    const fl = $('fld'), bt = $('btn'), wp = $('wp'); const top = parseFloat(wp.style.top);
    const fy = top + fl.offsetTop + 75, by = top + bt.offsetTop + 80;
    const P = [[T.web + .5, 900, 1760], [T.web + .95, 760, fy + 10], [T.web + 2.0, 760, fy + 10], [T.tap - .02, 560, by + 10], [T.gal, 560, by + 10]];
    let x = P[0][1], y = P[0][2];
    for (let i = 0; i < P.length - 1; i++) if (t >= P[i][0]) { const k = E.io(seg(t, P[i][0], P[i + 1][0])); x = P[i][1] + (P[i + 1][1] - P[i][1]) * k; y = P[i][2] + (P[i + 1][2] - P[i][2]) * k; }
