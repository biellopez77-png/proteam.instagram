<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#000}
.L{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.bw img{filter:grayscale(1) contrast(1.08)}
.w{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none}
.sub{font-family:M;font-weight:700;font-size:60px;letter-spacing:-.025em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.lab{font-family:M;font-weight:800;font-size:40px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.big{font-family:M;font-weight:800;letter-spacing:-.05em}
.it{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.c{display:inline-block;white-space:pre}
#type{font-family:M;font-weight:500;font-size:54px;letter-spacing:-.02em;color:#fff}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
svg.ico{position:absolute;display:none;overflow:visible}
svg.ico *{fill:none;stroke:#0b0b0c;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
#web{background:#f5f5f3}
#fld{position:absolute;left:70px;top:620px;width:940px;height:170px;border:4px solid #0b0b0c;border-radius:30px;font-family:M;font-weight:500;font-size:58px;color:#0b0b0c;display:flex;align-items:center;padding:0 46px}
#btn{position:absolute;left:70px;top:840px;width:940px;height:190px;border-radius:30px;background:#2f6bff;color:#fff;font-family:M;font-weight:800;font-size:56px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
#spin{width:84px;height:84px;border-radius:50%;border:8px solid rgba(255,255,255,.35);border-top-color:#fff;display:none}
</style></head><body>
<div id="st">
  <div class="L" id="white" style="background:#f5f5f3"></div>
  <div id="phs" style="position:absolute;inset:0"></div>
  <div class="L" id="web"><div id="fld"><span id="fldt"></span><span class="caret" id="fc"></span></div><div id="btn"><span id="btt">Unirme a la lista de espera</span><div id="spin"></div></div></div>
  <div id="mid" style="position:absolute;inset:0"></div>
  <div id="txt" style="position:absolute;inset:0"></div>
</div>
<script>
// tiempos sacados de la locución (toma 1, Raúl García)
const T = {
  type0: .05, type1: 1.35, col0: 1.15, s2: 1.96, g: 2.84, ta: 3.82, s3: 5.06, cnt0: 5.35, cnt1: 6.6, s4: 7.30,
  rec: 8.78, sino: 9.74, como: 10.26, s6: 11.96, met: 13.48, her: 14.48, s7: 17.06,
  exc: 18.18, wha: 18.98, lib: 19.70, doc: 20.38, cut: 21.22, sis0: 22.30, sis: 23.28, s9: 24.26, pt: 24.46,
  web: 25.40, tap: 27.30, ok: 27.95, s10: 28.55, d28: 29.14, s11: 30.60, tres: 31.16, END: 33.6,
};
window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: p => 1 - Math.pow(1 - p, 3), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, back: p => { const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); } };
let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };

function ph(src, x, y, w, h, o = {}) {
  const d = document.createElement('div'); d.className = 'ph' + (o.bw ? ' bw' : '');
  Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  if (o.shadow) d.style.boxShadow = '0 30px 80px rgba(0,0,0,.55)';
  const im = document.createElement('img'); im.src = '/tools/reel1/img/' + src + '.jpg'; im.style.objectPosition = o.pos || '50% 50%';
  d.appendChild(im); (o.parent || $('phs')).appendChild(d); d._img = im; return d;
}
// palabra que entra letra a letra con desenfoque (estilo @unrespiro)
const W = [];
function word(tin, tout, y, html, cls, size, o = {}) {
  const d = document.createElement('div'); d.className = 'w ' + cls; d.style.top = y + 'px'; if (size) d.style.fontSize = size + 'px';
  if (o.color) d.style.color = o.color; $('txt').appendChild(d);
  const chars = []; const parts = Array.isArray(html) ? html : [[html, '']];
  parts.forEach(([txt, c2]) => { [...txt].forEach(ch => { const s = document.createElement('span'); s.className = 'c ' + (c2 || ''); s.textContent = ch; d.appendChild(s); chars.push(s); }); });
  const r = { el: d, tin, tout, chars, st: Math.min(.03, (o.spread || .28) / chars.length), o }; W.push(r); return r;
}
function animW(r, t) {
  const v = t >= r.tin && t < r.tout; show(r.el, v); if (!v) return;
  r.el.style.transform = `scale(${1 + (r.o.zoom || .04) * seg(t, r.tin, r.tout)})`;
  r.chars.forEach((c, k) => { const a = r.tin + k * r.st; const p = E.out(seg(t, a, a + .3)); c.style.opacity = p; c.style.filter = p < .99 ? `blur(${(1 - p) * 14}px)` : 'none'; c.style.transform = `translateX(${(1 - p) * 26}px)`; });
}

let C1, B2, S6, C7, ICO, Q, SYSF, CNT;
function build() {
  // 1 · gancho: máquina de escribir + collage grande (huecos para fotos de entrenadores conocidos)
  const ty = document.createElement('div'); ty.className = 'w'; ty.id = 'type'; ty.style.top = '920px'; ty.innerHTML = '<span id="tyt"></span><span class="caret" id="tyc"></span>'; $('txt').appendChild(ty);
  C1 = [['a049', 40, 120, 1000, 1500, -2, '50% 30%'], ['a000', -60, 260, 1120, 1560, 2, '45% 40%'], ['a032', 0, 180, 1100, 1620, -1.5, '40% 40%'], ['a047', -40, 140, 1160, 1640, 2, '45% 45%']]
    .map(([s, x, y, w, h, r, pos], i) => ({ el: ph(s, x, y, w, h, { pos, shadow: 1, bw: 1 }), t0: T.col0 + i * .2, r, from: i % 2 ? 1 : -1 }));
  // 2 · tres franjas: TIENES / GANAS / TALENTO
  B2 = [['a012', 0, '45% 35%', 'TIENES', T.s2], ['a061', 640, '50% 30%', 'GANAS', T.g], ['a017', 1280, '50% 30%', 'TALENTO', T.ta]]
    .map(([s, y, pos, lab, t0]) => { const el = ph(s, 0, y, 1080, 640, { pos, bw: 1 }); const l = word(t0 + .05, T.s3, y + 470, lab, 'lab'); return { el, t0, l }; });
  // 3 · contador 00 → 24 h
  CNT = document.createElement('div'); CNT.style.cssText = 'position:absolute;left:0;top:560px;width:1080px;height:800px;display:none';
  CNT.innerHTML = `<svg width="1080" height="800" style="position:absolute;left:0;top:0"><circle cx="540" cy="400" r="300" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="5"/><circle id="ring" cx="540" cy="400" r="300" fill="none" stroke="#2f6bff" stroke-width="7" stroke-linecap="round" transform="rotate(-90 540 400)" stroke-dasharray="1884.96" stroke-dashoffset="1884.96"/></svg>
    <div style="position:absolute;left:0;top:300px;width:1080px;text-align:center;font-family:M;font-weight:500;font-size:190px;letter-spacing:-.04em;color:#fff"><span id="num">00</span><span style="font-size:120px;color:#2f6bff;margin-left:8px">h</span></div>`;
  $('mid').appendChild(CNT);
  word(T.cnt0 + .5, T.s4, 1290, 'horas', 'sub');
  // 4 · recursos: iconos sobre blanco → ?
  const icons = {
    cal: '<rect x="-80" y="-70" width="160" height="150" rx="18"/><path d="M-80 -20H80M-40 -95V-50M40 -95V-50"/><path d="M-42 15h18M-6 15h18M30 15h18M-42 48h18M-6 48h18"/>',
    piz: '<rect x="-95" y="-70" width="190" height="140" rx="14"/><path d="M0 -70V70M-95 0H95"/><circle cx="0" cy="0" r="26"/><path d="M-60 -38l16 16M-44 -38l-16 16M40 26a14 14 0 1 0 0.1 0"/><path d="M-50 40 Q 0 -10 45 -30" stroke-dasharray="10 12"/>',
    cro: '<circle cx="0" cy="12" r="82"/><path d="M0 12V-30M0 12L30 32M-18 -90h36M0 -90v20M62 -56l14 -14"/>',
    pes: '<path d="M-60 0H60"/><rect x="-100" y="-46" width="22" height="92" rx="6"/><rect x="-78" y="-34" width="18" height="68" rx="5"/><rect x="78" y="-46" width="22" height="92" rx="6"/><rect x="60" y="-34" width="18" height="68" rx="5"/>',
    tro: '<path d="M-55 -80H55V-20a55 55 0 0 1 -110 0Z"/><path d="M-55 -60H-88a30 30 0 0 0 33 46M55 -60H88a30 30 0 0 1 -33 46M0 35V70M-40 85H40M-30 70H30"/>',
    gra: '<path d="M-90 -90V85H95"/><path d="M-70 55L-25 15L10 35L75 -50"/><path d="M45 -52H77V-20"/>',
  };
  const pos = [[290, 600], [790, 560], [250, 1000], [830, 980], [330, 1400], [760, 1380]];
  ICO = Object.entries(icons).map(([k, p], i) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ico'); s.setAttribute('width', 260); s.setAttribute('height', 260); s.setAttribute('viewBox', '-130 -130 260 260');
    s.innerHTML = p; s.style.left = (pos[i][0] - 130) + 'px'; s.style.top = (pos[i][1] - 130) + 'px'; $('mid').appendChild(s);
    [...s.children].forEach(e => { const L = e.getTotalLength ? e.getTotalLength() : 600; e.style.strokeDasharray = e.style.strokeDasharray || `${L} ${L}`; e._L = L; });
    return { el: s, t0: T.s4 + .08 + i * .24, x: pos[i][0], y: pos[i][1] };
  });
  word(T.rec, T.sino + .05, 1690, [['tus ', ''], ['recursos', '']], 'sub', 70, { color: '#0b0b0c' }).el.style.textShadow = 'none';
  Q = document.createElement('div'); Q.className = 'w it'; Q.style.cssText = 'top:560px;font-size:760px;line-height:1;color:#2f6bff'; Q.textContent = '?'; $('mid').appendChild(Q);
  word(T.como, T.s6, 760, 'cómo', 'it', 330, { color: '#0b0b0c', zoom: .08 });
  // 6 · ellos en acción (huecos para fotos de entrenadores conocidos)
  S6 = [['c04', '58% 50%', '62% 88%', 1.9], ['a036', '35% 50%', '50% 50%', 1.25], ['c07', '24% 50%', '30% 96%', 2.3], ['a022', '25% 50%', '50% 50%', 1.2], ['c00', '57% 50%', '55% 80%', 2.3], ['a037', '45% 50%', '50% 50%', 1.2], ['c13', '50% 50%', '50% 50%', 1.25], ['c05', '50% 50%', '55% 70%', 1.6]]
    .map(([s, p, og, z], i) => { const el = ph(s, 0, 0, 1080, 1920, { pos: p, bw: 1 }); el._img.style.transformOrigin = og; return { el, t: T.s6 + i * ((T.s7 - T.s6) / 8), z }; });
  word(T.met, T.her - .02, 900, 'metodología', 'sub', 92);
  word(T.her, T.s7, 900, 'herramientas', 'sub', 92);
  // 7 · tú: collage de herramientas que se acelera hasta negro seco
  const L7 = ['t29', 't57', 't35', 't03', 't34', 't21', 't24', 't39', 't60', 't20', 't38', 't29', 't57', 't35', 't03', 't21', 't24', 't39', 't34', 't60', 't20', 't57', 't03', 't35', 't29', 't24', 't21', 't39'];
  let tt = T.s7, gap = .5; C7 = []; const R7 = .88;
  L7.forEach((s, i) => {
    const w = 980 + rnd() * 220, h = w * 1.62, x = 540 - w / 2 + (rnd() - .5) * 160, y = 960 - h / 2 + (rnd() - .5) * 200;
    C7.push({ el: ph(s, x, y, w, h, { shadow: 1 }), t0: tt, r: (rnd() - .5) * 10 }); tt += gap; gap = Math.max(.045, gap * R7);
  });
  C7 = C7.filter(c => c.t0 < T.cut);
  word(T.exc, T.wha - .02, 1500, 'Excel', 'sub', 84); word(T.wha, T.lib - .02, 1500, 'WhatsApp', 'sub', 84);
  word(T.lib, T.doc - .02, 1500, 'libretas', 'sub', 84); word(T.doc, T.cut, 1500, 'documentos', 'sub', 84);
  // 8 · SISTEMA: fragmentos que vuelven y se juntan
  SYSF = Array.from({ length: 14 }, (_, i) => { const s = L7[i % 11]; const el = ph(s, 0, 0, 200, 280, {}); const a = rnd() * Math.PI * 2; return { el, sx: 540 + Math.cos(a) * 520 - 100, sy: 960 + Math.sin(a) * 760 - 140, r: (rnd() - .5) * 60, t0: T.sis0 + i * .05 }; });
  const sw = word(T.sis, T.s9, 860, 'SISTEMA', 'big', 210, { color: '#fff', spread: .2, zoom: .06 });
  // 9 · ProTeam y entrada a la lista
  word(T.pt, T.web, 840, 'ProTeam', 'big', 200, { color: '#0b0b0c', spread: .45, zoom: .05 }).el.style.textShadow = 'none';
  const lw = word(T.tap + .3, T.s10, 1160, 'lista de espera', 'sub', 70, { color: '#0b0b0c' }); lw.el.style.textShadow = 'none';
  // 10 · fecha y 11 · oferta
  word(T.s10 + .3, T.s11, 760, 'antes del', 'sub', 64);
  word(T.d28, T.s11, 850, '28.11', 'big', 300, { color: '#fff', zoom: .06 });
  word(T.tres, T.END - .25, 820, [['3 meses ', ''], ['gratis.', '']], 'it', 190, { color: '#2f6bff', spread: .7, zoom: .06 });
}

window.frame = t => {
  // fondos planos
  const white = (t >= T.s4 && t < T.s6) || (t >= T.s9 && t < T.s10);
  show($('white'), white); $('st').style.background = '#000';
  // 1 · máquina de escribir
  const txt = 'no eres diferente a ellos.'; const n = Math.floor(txt.length * seg(t, T.type0, T.type1));
  show($('type'), t < T.col0 + .25); $('tyt').textContent = txt.slice(0, n); $('tyc').style.opacity = Math.floor(t * 4) % 2 ? 1 : .15;
  C1.forEach(c => { const v = t >= c.t0 && t < T.s2; show(c.el, v); if (!v) return; const p = E.out(seg(t, c.t0, c.t0 + .28));
    c.el.style.transform = `translate(${(1 - p) * 700 * c.from}px,${(1 - p) * 120}px) rotate(${c.r * p}deg) scale(${1 + .03 * seg(t, c.t0, T.s2)})`; });
  // 2 · franjas
  B2.forEach(b => { const v = t >= b.t0 && t < T.s3; show(b.el, v); if (!v) return; const p = E.out(seg(t, b.t0, b.t0 + .3));
    b.el.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; b.el._img.style.transform = `scale(${1.12 - .08 * seg(t, b.t0, T.s3)})`; });
  // 3 · contador
  const cv = t >= T.s3 && t < T.s4; show(CNT, cv);
  if (cv) { const p = E.io(seg(t, T.cnt0, T.cnt1)); $('num').textContent = String(Math.round(24 * p)).padStart(2, '0'); $('ring').setAttribute('stroke-dashoffset', 1884.96 * (1 - p));
    const a = E.out(seg(t, T.s3, T.s3 + .35)); CNT.style.opacity = a; CNT.style.transform = `scale(${.94 + .06 * a + .03 * seg(t, T.s3, T.s4)})`; }
  // 4 · iconos → ?
  ICO.forEach((c, i) => { const v = t >= c.t0 && t < T.sino + .45; show(c.el, v); if (!v) return;
    const p = seg(t, c.t0, c.t0 + .45), g = E.in(seg(t, T.sino - .05, T.sino + .35));
    [...c.el.children].forEach(e => e.style.strokeDashoffset = e._L * (1 - E.out(p)));
    c.el.style.opacity = 1 - g; c.el.style.transform = `translate(${(540 - c.x) * g}px,${(1000 - c.y) * g}px) scale(${(.85 + .15 * E.back(clamp(p * 1.6))) * (1 - .8 * g)}) rotate(${g * 90}deg)`; });
  const qv = t >= T.sino + .15 && t < T.como; show(Q, qv);
  if (qv) { const p = E.back(seg(t, T.sino + .15, T.sino + .5)); Q.style.opacity = clamp(p * 1.5); Q.style.transform = `scale(${.4 + .6 * p})`; }
  // 6 · planos de acción
  S6.forEach((s, i) => { const b = i + 1 < S6.length ? S6[i + 1].t : T.s7; const v = t >= s.t && t < b; show(s.el, v); if (!v) return;
    s.el._img.style.transform = `scale(${s.z + .06 - .06 * seg(t, s.t, b)})`; });
  // 7 · collage que se acelera
  C7.forEach((c, i) => { const v = t >= c.t0 && t < T.cut; show(c.el, v); if (!v) return; const p = E.out(seg(t, c.t0, c.t0 + .12));
    c.el.style.transform = `translateY(${(1 - p) * 220}px) rotate(${c.r}deg) scale(${1.06 - .06 * p})`; c.el.style.zIndex = i; });
  // 8 · fragmentos hacia SISTEMA
  SYSF.forEach(f => { const v = t >= f.t0 && t < T.sis + .1; show(f.el, v); if (!v) return; const a0 = E.out(seg(t, f.t0, f.t0 + .25)), p = E.io(seg(t, f.t0 + .2, T.sis));
    f.el.style.transform = `translate(${f.sx + (440 - f.sx) * p}px,${f.sy + (820 - f.sy) * p}px) rotate(${f.r * (1 - p)}deg) scale(${1 - .85 * p})`; f.el.style.opacity = a0 * (1 - seg(t, T.sis - .08, T.sis + .05)); });
  // 9 · web
  const wv = t >= T.web && t < T.s10; show($('web'), wv);
  if (wv) {
    const p = E.out(seg(t, T.web, T.web + .4)); $('web').style.transform = `scale(${1.25 - .25 * p + .03 * seg(t, T.web, T.s10)})`; $('web').style.opacity = 1;
    const em = 'entrenador@miclub.es'; const ne = Math.floor(em.length * seg(t, T.web + .35, T.web + 1.3));
    $('fldt').textContent = ne ? em.slice(0, ne) : ''; $('fc').style.opacity = t < T.tap ? (Math.floor(t * 4) % 2 ? 1 : .15) : 0;
    const press = Math.exp(-Math.pow((t - T.tap) / .09, 2)); $('btn').style.transform = `scale(${1 - .06 * press})`;
    const busy = t >= T.tap + .08 && t < T.ok, done = t >= T.ok;
    $('btt').style.display = busy ? 'none' : 'inline'; $('spin').style.display = busy ? 'block' : 'none'; $('spin').style.transform = `rotate(${t * 720}deg)`;
    $('btt').textContent = done ? 'Estás dentro ✓' : 'Unirme a la lista de espera';
    $('btn').style.background = done ? '#0b0b0c' : '#2f6bff';
  }
  W.forEach(r => animW(r, t));
  return true;
};
build();
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))).then(() => setTimeout(() => { window.frame(0); window.ready = true; }, 300));
</script>
</body></html>
