<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.bg{position:absolute;left:0;top:0;height:1920px;transform-origin:0 0}
.ov{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;left:0;width:1080px;text-align:center;color:#fff;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.H{font-family:M;font-weight:800;letter-spacing:-.05em;line-height:.9;text-transform:uppercase}
.I{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.bar{display:inline-block;position:relative;padding:0 .14em}
.bar::before{content:'';position:absolute;left:0;right:0;top:12%;bottom:6%;background:#2f6bff;transform-origin:0 50%;transform:scaleX(var(--b,0));z-index:-1}
.w{display:inline-block}
#grain{position:absolute;inset:-50%;opacity:.13;pointer-events:none;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:overlay}
.clip{position:absolute;background:#efe6cf;box-shadow:0 18px 40px rgba(0,0,0,.55);font-family:M;color:#1a1712;text-align:center;overflow:hidden}
.clip::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");mix-blend-mode:multiply}
</style></head><body><div id="st">
<!-- 1 · marco -->
<div class="sc" id="s1"><img class="bg" id="b1" src="/tools/reel_v3/img/marco.png">
  <div id="jf" style="position:absolute;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.8)"><img src="/tools/reel_v3/img/jordan.jpg" style="position:absolute;width:100%;left:0;top:-14%"></div>
  <div class="ov" style="background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 60%,rgba(0,0,0,.6))"></div>
  <div class="t H" id="t1a" style="top:210px;font-size:250px">SIN</div>
  <div class="t I" id="t1b" style="top:1430px;font-size:150px">Michael Jordan</div></div>
<!-- 2 · taquilla -->
<div class="sc" id="s2"><img class="bg" id="b2" src="/tools/reel_v3/img/taquilla.png">
  <div class="ov" style="background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 35%,transparent 55%,rgba(0,0,0,.75))"></div>
  <div class="t H" id="t2a" style="top:170px;font-size:118px">los Bulls<br>ganaron</div>
  <div class="t I" id="t2b" style="top:1360px;font-size:120px">solo</div>
  <div class="t H" id="t2c" style="top:1480px;font-size:112px"><span class="w" id="n2" style="color:#fff;font-size:1.5em">2</span> partidos<br><span class="bar" id="br2">menos</span></div></div>
<!-- 3 · mesa con recortes -->
<div class="sc" id="s3"><img class="bg" id="b3" src="/tools/reel_v3/img/mesa.png">
  <div class="clip" id="c57" style="left:150px;top:430px;width:430px;height:560px"><div style="margin-top:46px;font-weight:700;font-size:30px;letter-spacing:.18em">CON JORDAN</div><div style="font-weight:800;font-size:300px;letter-spacing:-.06em;line-height:1.05" id="d57">57</div><div style="font-weight:700;font-size:26px;letter-spacing:.14em;opacity:.7">VICTORIAS · 92-93</div></div>
  <div class="clip" id="c55" style="left:500px;top:880px;width:430px;height:560px"><div style="margin-top:46px;font-weight:700;font-size:30px;letter-spacing:.18em">SIN JORDAN</div><div style="font-weight:800;font-size:300px;letter-spacing:-.06em;line-height:1.05" id="d55">55</div><div style="font-weight:700;font-size:26px;letter-spacing:.14em;opacity:.7">VICTORIAS · 93-94</div></div>
  <svg class="ov" viewBox="0 0 1080 1920"><path id="ring" d="M775 1000 C 960 990 1010 1140 960 1260 C 900 1390 640 1390 600 1250 C 560 1110 640 1000 790 985" fill="none" stroke="#d62828" stroke-width="12" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400"/>
   <path id="str" d="M325 1080 Q 420 1200 600 1130" fill="none" stroke="#d62828" stroke-width="5" stroke-dasharray="400" stroke-dashoffset="400"/></svg>
  <div class="t I" id="t3" style="top:1560px;font-size:130px">solo <span class="bar" id="br3">dos menos.</span></div></div>
<!-- 4 · perchas -->
<div class="sc" id="s4"><img class="bg" id="b4" src="/tools/reel_v3/img/perchas.png">
  <div class="ov" style="background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 32%,transparent 62%,rgba(0,0,0,.8))"></div>
  <div class="t H" id="t4a" style="top:220px;font-size:118px">¿Cómo gana<br>un equipo</div>
  <div class="t I" id="t4b" style="top:1450px;font-size:136px">sin su mejor<br>jugador?</div></div>
<!-- 5 · agenda -->
<div class="sc" id="s5"><img class="bg" id="b5" src="/tools/reel_v3/img/agenda.png">
  <svg class="ov" id="mk5" viewBox="0 0 1080 1920" style="overflow:visible"></svg>
  <div class="ov" style="background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 22%,transparent 70%,rgba(0,0,0,.7))"></div>
  <div class="t I" id="t5a" style="top:120px;font-size:110px">no se improvisa</div>
  <div class="t H" id="t5b" style="top:1640px;font-size:150px">se <span class="bar" id="br5">entrena</span></div></div>
<div id="vig"></div><div id="grain"></div><div id="flash"></div></div>
<script src="/tools/reel_v2/bq/times.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { o: p => 1 - Math.pow(1 - p, 3), o5: p => 1 - Math.pow(1 - p, 5), io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const at = (w, n = 1) => { let c = 0; for (const x of WORDS) if (x[0] === w && ++c === n) return x[1]; throw new Error(w); };
const en = (w, n = 1) => { let c = 0; for (const x of WORDS) if (x[0] === w && ++c === n) return x[2]; throw new Error(w); };
const K = { mich: at('michael'), jend: en('jordan'), los: at('los'), gan: at('ganaron'), solo: at('solo'), dos: at('dos'), menos: at('menos'), c1: at('cincuenta'), c2: at('cincuenta', 2),
  sin2: at('sin', 2), como: at('como'), sin3: at('sin', 3), jug: at('jugador'), eso: at('eso'), impro: at('improvisa'), sab: at('sabado'), entrena: at('entrena'), martes: at('martes') };
const CUT = [0, K.los - .05, K.c1 - .12, K.como - .08, K.eso - .08, 13.4]; window.DUR = 13.4;
// cámara: el fondo (1280×720 escalado a alto 1920 → 3413 px de ancho) se mueve en x/escala
const S = 1920 / 720;
function cam(img, cx, cy, z) { // cx,cy en px de la imagen original (1280×720); z zoom sobre el alto
  const s = S * z; img.style.transform = `translate(${540 - cx * s}px,${960 - cy * s}px) scale(${s})`; img.style.height = '720px'; img.style.width = '1280px'; return s; }
const word = (el, p) => { el.style.opacity = clamp(p * 2); el.style.transform = `translateY(${(1 - E.o5(p)) * 40}px) scale(${1.15 - .15 * E.o5(p)})`; el.style.filter = `blur(${(1 - E.o(p)) * 12}px)`; };
const tick = (t, k, a = .08) => 1 + a * Math.exp(-Math.pow((t - k - .1) / .12, 2));
function frame(t) {
  for (let i = 1; i <= 5; i++) $('s' + i).style.display = t >= CUT[i - 1] && t < CUT[i] ? 'block' : 'none';
  // destello/glitch en cada corte
  const fl = Math.max(...CUT.slice(1, -1).map(c => Math.exp(-Math.pow((t - c) / .05, 2)))); $('flash').style.opacity = .55 * fl;
  $('st').style.filter = fl > .2 ? `saturate(1.4) hue-rotate(${8 * fl}deg)` : 'none';
  // 1 · el marco con Jordan; en el final de «Jordan», Jordan desaparece del marco
  if (t < CUT[1]) { const z = 1.25 + .12 * seg(t, 0, CUT[1]); const s = cam($('b1'), 638, 330, z);
    const jf = $('jf'); const x0 = 540 + (388 - 638) * s, y0 = 960 + (150 - 330) * s; jf.style.left = x0 + 'px'; jf.style.top = y0 + 'px'; jf.style.width = (500 * s) + 'px'; jf.style.height = (362 * s) + 'px';
    const gone = seg(t, K.jend - .15, K.jend + .1); jf.style.opacity = 1 - gone; jf.style.filter = `grayscale(${gone}) blur(${gone * 6}px)`;
    word($('t1a'), seg(t, 0, .25)); $('t1a').style.transform += ` scale(${tick(t, 0, .06)})`; word($('t1b'), seg(t, K.mich - .1, K.mich + .25)); }
  // 2 · la camiseta del 23 sola en la taquilla
  if (t >= CUT[1] && t < CUT[2]) { const p = seg(t, CUT[1], CUT[2]); cam($('b2'), 655, 290 + 20 * p, 1.05 + .55 * E.io(p));
    word($('t2a'), seg(t, K.los - .05, K.gan + .2)); word($('t2b'), seg(t, K.solo - .1, K.solo + .15)); word($('t2c'), seg(t, K.dos - .1, K.dos + .2));
    $('n2').style.color = '#4f86ff'; $('n2').style.transform = `scale(${tick(t, K.dos, .25)})`; $('br2').style.setProperty('--b', E.o(seg(t, K.menos - .05, K.menos + .25))); }
  // 3 · la mesa: dos recortes, el 55 se rodea en rojo y se une al 57 con un hilo
  if (t >= CUT[2] && t < CUT[3]) { const p = seg(t, CUT[2], CUT[3]); cam($('b3'), 330 + 60 * p, 360, 1.0 + .08 * p);
    [['c57', K.c1, -6], ['c55', K.c2, 5]].forEach(([id, k, r]) => { const q = E.o5(seg(t, k - .12, k + .2)); const el = $(id); el.style.opacity = q > 0 ? 1 : 0;
      el.style.transform = `translateY(${(1 - q) * -900}px) rotate(${r + (1 - q) * 20}deg) scale(${tick(t, k + .1, .05)})`; });
    $('d57').textContent = Math.round(57 * E.o(seg(t, K.c1, K.c1 + .5))); $('d55').textContent = Math.round(55 * E.o(seg(t, K.c2, K.c2 + .5)));
    $('ring').setAttribute('stroke-dashoffset', 1400 * (1 - E.io(seg(t, K.sin2 - .1, K.sin2 + .45)))); $('str').setAttribute('stroke-dashoffset', 400 * (1 - E.o(seg(t, K.sin2 + .3, K.sin2 + .7))));
    word($('t3'), seg(t, K.sin2 + .25, K.sin2 + .5)); $('br3').style.setProperty('--b', E.o(seg(t, K.sin2 + .4, K.sin2 + .7))); }
  // 4 · cuatro camisetas y una percha vacía: la cámara viaja hasta el hueco
  if (t >= CUT[3] && t < CUT[4]) { const p = E.io(seg(t, CUT[3], CUT[4])); cam($('b4'), 300 + 340 * p, 300, 1.05 + .45 * p);
    word($('t4a'), seg(t, K.como - .08, K.como + .2)); word($('t4b'), seg(t, K.sin3 - .1, K.sin3 + .2)); }
  // 5 · la agenda: el sábado tachado, el martes rodeado
  if (t >= CUT[4]) { const p = seg(t, CUT[4], CUT[5]); const z = 1.0 + .06 * p; const cx = 600, cy = 360; const s = cam($('b5'), cx, cy, z);
    const X = x => 540 + (x - cx) * s, Y = y => 960 + (y - cy) * s;
    const xs = E.io(seg(t, K.sab - .05, K.sab + .3)), cr = E.io(seg(t, K.martes - .1, K.martes + .4));
    $('mk5').innerHTML = `<path d="M${X(420)} ${Y(515)} L${X(420 + 480 * xs)} ${Y(515 + 80 * xs)}" stroke="#d62828" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M${X(420)} ${Y(595)} L${X(420 + 480 * xs)} ${Y(595 - 80 * xs)}" stroke="#d62828" stroke-width="16" stroke-linecap="round" fill="none" opacity="${xs > .02 ? 1 : 0}"/>
      <ellipse cx="${X(560)}" cy="${Y(160)}" rx="${190 * s}" ry="${52 * s}" fill="none" stroke="#2f6bff" stroke-width="14" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 * (1 - cr)}" transform="rotate(-3 ${X(560)} ${Y(160)})"/>`;
    word($('t5a'), seg(t, K.impro - .1, K.impro + .2)); word($('t5b'), seg(t, K.entrena - .1, K.entrena + .2)); $('br5').style.setProperty('--b', E.o(seg(t, K.martes - .1, K.martes + .3))); }
  $('grain').style.transform = `translate(${(Math.floor(t * 12) * 37) % 200 - 100}px,${(Math.floor(t * 12) * 53) % 200 - 100}px)`;
}
window.frame = frame;
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))).then(() => setTimeout(() => { frame(0); window.ready = true; }, 300));
</script></body></html>
