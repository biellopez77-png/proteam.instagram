<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.lay{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.lay img{position:absolute;left:0;top:0;display:block}
.wd{position:absolute;white-space:nowrap;color:#fff;transform-origin:50% 60%;text-shadow:0 8px 36px rgba(0,0,0,.55)}
.H{font-family:M;font-weight:800;letter-spacing:-.055em;line-height:.88;text-transform:uppercase}
.I{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.bar{background:linear-gradient(#2f6bff,#2f6bff) no-repeat 0 60%/var(--b,0%) 78%;padding:0 .12em}
#grain{position:absolute;inset:-50%;opacity:.16;pointer-events:none;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(0,0,0,.6))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#blue{position:absolute;inset:0;background:#2f6bff;opacity:0;pointer-events:none}
.clip{position:absolute;background:#efe6cf;box-shadow:0 30px 60px rgba(0,0,0,.6);font-family:M;color:#1a1712;text-align:center}
</style></head><body><div id="st">
<div class="sc" id="A"><div class="lay" id="A0"><img src="/tools/reel_v3/img/jordan.jpg" width="1080" height="1354"></div><div class="lay" id="At"></div><div class="lay" id="A1"><img src="/tools/reel_v3/img/jordan_cut.png" width="1080" height="1354"></div><div class="lay" id="Af" style="width:1080px;height:1920px"></div></div>
<div class="sc" id="B"><div class="lay" id="B0"><img src="/tools/reel_v3/img/taquilla.png" width="1280" height="720"></div><div class="lay" id="Bt"></div><div class="lay" id="B1"><img src="/tools/reel_v3/img/camiseta_cut.png" style="left:520px;top:40px" width="280" height="380"></div><div class="lay" id="Bf" style="width:1080px;height:1920px"></div></div>
<div class="sc" id="D"><div class="lay" id="D0"><img src="/tools/reel_v3/img/mesa.png" width="1280" height="720">
  <div class="clip" id="c57" style="left:300px;top:190px;width:200px;height:250px"><div style="margin-top:20px;font-weight:700;font-size:13px;letter-spacing:.18em">CON JORDAN</div><div style="font-weight:800;font-size:132px;letter-spacing:-.06em;line-height:1.08">57</div><div style="font-weight:700;font-size:11px;letter-spacing:.14em;opacity:.7">VICTORIAS · 1992-93</div></div>
  <div class="clip" id="c55" style="left:760px;top:330px;width:200px;height:250px"><div style="margin-top:20px;font-weight:700;font-size:13px;letter-spacing:.18em">SIN JORDAN</div><div style="font-weight:800;font-size:132px;letter-spacing:-.06em;line-height:1.08">55</div><div style="font-weight:700;font-size:11px;letter-spacing:.14em;opacity:.7">VICTORIAS · 1993-94</div></div>
  <svg style="position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible" viewBox="0 0 1280 720"><path id="str" d="M400 330 C 560 470 640 300 860 430" fill="none" stroke="#d62828" stroke-width="3" stroke-dasharray="700" stroke-dashoffset="700"/>
   <path id="ring" d="M870 360 C 990 350 1010 470 980 540 C 940 610 770 610 745 530 C 720 450 780 365 880 355" fill="none" stroke="#d62828" stroke-width="7" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="800"/>
   <circle cx="400" cy="200" r="9" fill="#d62828"/><circle cx="860" cy="340" r="9" fill="#d62828" id="pin55" opacity="0"/></svg></div>
  <div class="lay" id="Df" style="width:1080px;height:1920px"></div></div>
<div class="sc" id="F"><div class="lay" id="F0"><img src="/tools/reel_v3/img/perchas.png" width="1280" height="720"></div><div class="lay" id="Ff" style="width:1080px;height:1920px"></div></div>
<div class="sc" id="H"><div class="lay" id="H0"><img src="/tools/reel_v3/img/agenda.png" width="1280" height="720">
  <svg style="position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible" viewBox="0 0 1280 720"><path id="x1" d="M400 505 L760 600" stroke="#d62828" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" fill="none"/><path id="x2" d="M400 600 L760 505" stroke="#d62828" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" fill="none"/>
  <ellipse id="cir" cx="455" cy="143" rx="100" ry="42" fill="none" stroke="#2f6bff" stroke-width="10" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-3 455 143)"/></svg></div>
  <div class="lay" id="Hf" style="width:1080px;height:1920px"></div></div>
<div id="vig"></div><div id="grain"></div><div id="blue"></div><div id="flash"></div></div>
<script src="/tools/reel_v2/bq/times.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { o: p => 1 - Math.pow(1 - p, 3), o5: p => 1 - Math.pow(1 - p, 5), io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const at = (w, n = 1) => { let c = 0; for (const x of WORDS) if (x[0] === w && ++c === n) return x[1]; throw new Error(w); };
const en = (w, n = 1) => { let c = 0; for (const x of WORDS) if (x[0] === w && ++c === n) return x[2]; throw new Error(w); };
const W = n => at(n), W2 = (n, k) => at(n, k);
const K = { jend: en('jordan'), los: W('los'), solo: W('solo'), c1: W('cincuenta'), c2: W2('cincuenta', 2), como: W('como'), sin3: W2('sin', 3), eso: W('eso'), sab: W('sabado'), entrena: W('entrena') };
// planos (cortes): A Jordan · B camiseta (+ C primer plano del 2) · D mesa 57 (+ E barrido al 55) · F perchas (+ G hueco) · H agenda (+ I martes)
const SH = [['A', 0], ['B', K.los - .04], ['D', K.c1 - .14], ['F', K.como - .08], ['H', K.eso - .08]]; const END = 13.4; window.DUR = END;
// ── cámara por plano: claves [t, cx, cy, zoom, rot]; cx,cy en px de la imagen; transiciones cortas y rápidas (out5) + deriva ──
const CAM = {
  A: { s0: 1920 / 1354, k: [[0, 540, 640, 1.0, -2], [.25, 560, 600, 1.18, 0], [K.jend - .1, 560, 560, 1.32, 1.5], [K.jend + .05, 560, 520, 1.6, 3]] },
  B: { s0: 1920 / 720, k: [[K.los - .04, 640, 360, .95, 0], [K.los + .2, 655, 300, 1.15, 0], [W('ganaron') + .1, 655, 280, 1.32, -1], [K.solo - .05, 660, 250, 2.1, -3], [W('dos'), 662, 245, 2.5, -1], [W('menos'), 660, 250, 2.8, 2], [K.c1, 660, 250, 3.1, 3]] },
  D: { s0: 1920 / 720, k: [[K.c1 - .14, 520, 300, 1.25, -8], [K.c1 + .1, 420, 320, 1.45, -6], [K.c2 - .15, 430, 330, 1.52, -5], [K.c2 + .05, 860, 470, 1.5, 4], [W2('sin', 2), 860, 470, 1.62, 5], [K.como, 700, 420, 1.2, 2]] },
  F: { s0: 1920 / 720, k: [[K.como - .08, 300, 320, 1.0, 0], [K.como + .15, 260, 330, 1.18, -2], [K.sin3 - .1, 300, 330, 1.25, -2], [K.sin3 + .1, 640, 280, 1.55, 2], [K.eso, 640, 250, 1.85, 3]] },
  H: { s0: 1920 / 720, k: [[K.eso - .08, 560, 380, 1.0, 5], [K.eso + .2, 560, 420, 1.1, 3], [K.sab - .05, 560, 540, 1.2, 2], [K.sab + .15, 565, 550, 1.3, 0], [K.entrena - .12, 560, 520, 1.3, 0], [K.entrena + .1, 540, 200, 1.35, -3], [END, 540, 190, 1.5, -4]] } };
function camAt(c, t) { const k = c.k; if (t <= k[0][0]) return k[0].slice(1); for (let i = 0; i < k.length - 1; i++) if (t < k[i + 1][0]) {
  const d = k[i + 1][0] - k[i][0], q = (t - k[i][0]) / d, e = d < .45 ? E.o5(q) : E.io(q); return k[i].slice(1).map((v, j) => v + (k[i + 1][j + 1] - v) * e); } return k[k.length - 1].slice(1); }
function apply(id, c, t, par = 1) { const [cx, cy, z, r] = camAt(c, t); const s = c.s0 * (1 + (z - 1) * par); const sh = shake(t);
  const [cx2, cy2] = camAt(c, t - .04); const v = Math.hypot(cx - cx2, cy - cy2) * s; // desenfoque de movimiento
  const el = $(id); el.style.transform = `translate(${540 + sh[0]}px,${960 + sh[1]}px) rotate(${r}deg) scale(${s}) translate(${-cx}px,${-cy}px)`; el.style.filter = v > 30 ? `blur(${Math.min(14, v / 14)}px)` : 'none'; }
// golpes de cámara (temblor) en los impactos
const HITS = () => [0, W('dos'), K.c1, K.c2, K.sab, K.entrena];
function shake(t) { let a = 0; for (const h of HITS()) a += 18 * Math.exp(-(t - h) * 9) * (t >= h ? 1 : 0); return [a * Math.sin(t * 91), a * Math.cos(t * 77)]; }
// ── palabras: aparecen una a una, con pop y desenfoque ──
function mkw(par, txt, cls, x, y, size, k, extra = '') { const d = document.createElement('div'); d.className = 'wd ' + cls; d.innerHTML = txt; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; if (extra) d.style.cssText += extra; d._k = k; $(par).appendChild(d); return d; }
const pop = (d, t) => { const p = seg(t, d._k - .03, d._k + .16); d.style.opacity = p > 0 ? 1 : 0; d.style.transform = `translate(-50%,-50%) scale(${1.45 - .45 * E.o5(p)})`; d.style.filter = `blur(${(1 - E.o(p)) * 10}px)`; };
// A · SIN detrás de Jordan
const aW = [mkw('At', 'SIN', 'H', 540, 560, 420, 0), mkw('Af', 'Michael', 'I', 330, 1500, 170, W('michael')), mkw('Af', 'Jordan', 'I', 700, 1640, 170, W('jordan'))];
// B · LOS BULLS GANARON detrás de la camiseta
const bW = [mkw('Bt', 'LOS', 'H', 540, 210, 200, K.los), mkw('Bt', 'BULLS', 'H', 540, 420, 330, W('bulls')), mkw('Bf', 'GANARON', 'H', 540, 1720, 190, W('ganaron'))];
const cW = [mkw('Bf', 'solo', 'I', 540, 560, 190, K.solo), mkw('Bf', '2', 'H', 540, 960, 900, W('dos'), 'color:#4f86ff'), mkw('Bf', 'partidos', 'H', 540, 1380, 150, W('partidos')), mkw('Bf', '<span class="bar" id="b1">menos</span>', 'H', 540, 1540, 170, W('menos'))];
// D · mesa
const dW = [mkw('Df', 'con Jordan', 'I', 540, 1650, 150, W2('con', 2)), mkw('Df', 'sin él', 'I', 540, 1650, 170, W2('sin', 2))];
// F · perchas
const fW = [mkw('Ff', '¿CÓMO', 'H', 540, 330, 230, K.como), mkw('Ff', 'GANA', 'H', 540, 530, 230, W('gana')), mkw('Ff', 'UN EQUIPO', 'H', 540, 720, 150, W('un')),
  mkw('Ff', 'sin su', 'I', 540, 1380, 160, K.sin3), mkw('Ff', '<span class="bar" id="b2">mejor</span>', 'I', 540, 1540, 220, W('mejor')), mkw('Ff', 'jugador?', 'I', 540, 1720, 160, W('jugador'))];
// H · agenda
const hW = [mkw('Hf', 'ESO', 'H', 540, 300, 180, K.eso), mkw('Hf', 'NO SE', 'H', 540, 470, 180, W('no')), mkw('Hf', 'improvisa', 'I', 540, 640, 200, W('improvisa')),
  mkw('Hf', 'se', 'I', 540, 1380, 170, K.entrena - .2), mkw('Hf', '<span class="bar" id="b3">ENTRENA</span>', 'H', 540, 1560, 210, K.entrena), mkw('Hf', 'un martes.', 'I', 540, 1740, 150, W('martes'))];
function frame(t) {
  const cur = SH.filter(s => t >= s[1]).pop()[0]; SH.forEach(([id]) => $(id).style.display = id === cur ? 'block' : 'none');
  const fl = Math.max(...SH.slice(1).map(s => Math.exp(-Math.pow((t - s[1]) / .045, 2)))); $('flash').style.opacity = .5 * fl;
  $('st').style.transform = `scale(${1 + .02 * fl})`;
  if (cur === 'A') { apply('A0', CAM.A, t); apply('A1', CAM.A, t, 1.08); $('At').style.transform = `translate(540px,960px) scale(${1 + .08 * seg(t, 0, K.los)}) translate(-540px,-960px)`; aW.forEach(d => pop(d, t));
    const g = seg(t, K.jend - .12, K.jend + .05); $('A0').style.filter = `grayscale(${g}) brightness(${1 - .5 * g})`; }
  if (cur === 'B') { apply('B0', CAM.B, t); apply('B1', CAM.B, t, 1.04); $('Bt').style.transform = `translate(540px,960px) scale(${1 + .1 * seg(t, K.los, K.solo)}) translate(-540px,-960px)`;
    // en «solo» la cámara entra al número: las palabras de detrás se apagan y salen las de delante
    const inC = t >= K.solo - .05; bW.forEach(d => { pop(d, t); if (inC) d.style.opacity = 0; }); cW.forEach(d => pop(d, t)); $('b1').style.setProperty('--b', 100 * E.o(seg(t, W('menos'), W('menos') + .2)) + '%');
    $('B0').style.filter += inC ? ' brightness(.55)' : ''; $('B1').style.opacity = inC ? .55 : 1;
    // el «2» crece hasta llenar la pantalla de azul (paso al plano siguiente)
    const zt = seg(t, K.c1 - .32, K.c1 - .12); cW[1].style.transform += ` scale(${1 + 14 * E.io(zt)})`; $('blue').style.opacity = clamp(zt * 1.6 - .5); }
  else $('blue').style.opacity = cur === 'D' ? 1 - seg(t, K.c1 - .14, K.c1 + .02) : 0;
  if (cur === 'D') { apply('D0', CAM.D, t);
    [['c57', K.c1 - .05, -8], ['c55', K.c2 - .05, 6]].forEach(([id, k, r]) => { const q = E.o5(seg(t, k, k + .16)); const el = $(id); el.style.opacity = q > 0 ? 1 : 0; el.style.transform = `translateY(${(1 - q) * -500}px) rotate(${r + (1 - q) * 25}deg) scale(${1 + .6 * (1 - q)})`; });
    $('pin55').setAttribute('opacity', t > K.c2 + .1 ? 1 : 0);
    $('ring').setAttribute('stroke-dashoffset', 800 * (1 - E.io(seg(t, W2('sin', 2) - .05, W2('sin', 2) + .35)))); $('str').setAttribute('stroke-dashoffset', 700 * (1 - E.o(seg(t, K.c2 + .15, K.c2 + .5))));
    dW[0].style.display = t < K.c2 - .1 ? 'block' : 'none'; dW[1].style.display = t >= K.c2 - .1 ? 'block' : 'none'; dW.forEach(d => pop(d, t)); }
  if (cur === 'F') { apply('F0', CAM.F, t); fW.forEach(d => pop(d, t)); const up = t >= K.sin3 - .1; fW.slice(0, 3).forEach(d => { if (up) d.style.opacity = 1 - seg(t, K.sin3 - .1, K.sin3 + .05); });
    $('b2').style.setProperty('--b', 100 * E.o(seg(t, W('mejor'), W('mejor') + .2)) + '%'); }
  if (cur === 'H') { apply('H0', CAM.H, t); hW.forEach(d => pop(d, t)); const dn = t >= K.entrena - .25; hW.slice(0, 3).forEach(d => { if (dn) d.style.opacity = 1 - seg(t, K.entrena - .25, K.entrena - .1); });
    $('x1').setAttribute('stroke-dashoffset', 100 * (1 - E.o5(seg(t, K.sab - .05, K.sab + .12)))); $('x2').setAttribute('stroke-dashoffset', 100 * (1 - E.o5(seg(t, K.sab + .08, K.sab + .25))));
    $('cir').setAttribute('stroke-dashoffset', 100 * (1 - E.io(seg(t, W('martes') - .15, W('martes') + .3)))); $('b3').style.setProperty('--b', 100 * E.o(seg(t, K.entrena, K.entrena + .2)) + '%'); }
  $('grain').style.transform = `translate(${(Math.floor(t * 12) * 37) % 200 - 100}px,${(Math.floor(t * 12) * 53) % 200 - 100}px)`;
}
window.frame = frame;
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))).then(() => setTimeout(() => { frame(0); window.ready = true; }, 300));
</script></body></html>
