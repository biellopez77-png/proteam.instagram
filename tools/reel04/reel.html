<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1x{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1x .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:60px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:96px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}

#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
#web{z-index:5}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
.ph.clip{border:14px solid #fbfaf6;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ink{color:#0d0f14!important;text-shadow:none!important}
.strike{position:absolute;left:-4%;right:-4%;top:52%;height:16px;background:#2f6bff;transform-origin:0 50%;border-radius:3px}
.vb .node{background:#fbfaf6;border-color:#d6d2c6;color:#0d0f14}
.vb .node div{background:#e4e0d4!important}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>

  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">11</b><span>DÍAS</span></div><div><b id="cd2">03</b><span>HORAS</span></div><div><b id="cd3">29</b><span>MIN</span></div><div><b id="cd4">59</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>

  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel04/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel04/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, x, y, w, h, o = {}) {
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = `translate(${o.dx || 0}px,${o.dy || 0}px) rotate(${o.rot || 0}deg) scale(${o.s || 1})`;
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1; el.style.filter = o.blur ? `blur(${o.blur}px)` : 'none';
  if (el._img) el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  if (el._sh) el._sh.style.background = `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) {
  const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d;
}
function reveal(el, p, dir = 'up') {
  el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i));
    s.style.transform = dir === 'up' ? `translateY(${(1 - q) * 110}%)` : `translateX(${(q - 1) * 105}%)`; });
}
const M = s => `<span class="mask"><span>${s}</span></span>`;

// ── 1 · GANCHO: Ancelotti en un entrenamiento + hoja en blanco ──
const ANC = ph('ancelotti', '50% 20%');
const tMEJ = tx(`${M('TU <span id="mej" style="position:relative;display:inline-block">MEJOR<span id="umej" class="uline" style="bottom:-6px"></span></span>')}<br>${M('ENTRENO')}`, 1120, 'M8 shadow', 132); tMEJ.style.lineHeight = '1.02';
const tREP = tx(M('<span class="S" style="color:#9db8ff">no lo podrías repetir.</span>'), 1420, 'shadow', 116);
const SHEET = mk('div', 'position:absolute;left:230px;top:560px;width:620px;height:780px;background:#fbfaf6;border-radius:18px;box-shadow:0 40px 90px rgba(0,0,0,.55);display:none;overflow:hidden', '', $('cards'));
mk('div', 'position:absolute;left:52px;top:52px;font-family:M;font-weight:800;font-size:28px;letter-spacing:.16em;color:#8a877e', 'SESIÓN · __ / 10', SHEET);
for (let i = 0; i < 9; i++) mk('div', `position:absolute;left:52px;right:52px;top:${150 + i * 66}px;height:2px;background:#e4e0d4`, '', SHEET);
const CAR = mk('div', 'position:absolute;left:56px;top:96px;width:5px;height:50px;background:#2f6bff', '', SHEET);
const tAPU = tx(M('NO LO APUNTASTE.'), 1420, 'M8 shadow', 96);
function hook(t) {
  const b = T.aquel - .05, v = t < b; show(ANC, v); show(tMEJ, v && t < T.no2 - .1); show(tREP, v && t >= .45 && t < T.no2 - .1); show(SHEET, v && t >= T.no2 - .15); show(tAPU, v && t >= T.no2 - .05);
  if (!v) return;
  const p = E.out5(seg(t, 0, .45)), sh = E.out5(seg(t, T.no2 - .15, T.no2 + .2));
  place(ANC, 0, 0, 1080, 1920, { s: 1 + (1 - p) * .08, is: 1.26 - .18 * seg(t, 0, b), iy: 70 * seg(t, 0, b), dark: .32 + .16 * seg(t, .3, .7) + .2 * sh, blur: 3 * sh, z: 1 });
  reveal(tMEJ, seg(t, -.3, .25)); $('umej').style.transform = `scaleX(${E.io(seg(t, T.mejor, T.mejor + .35))})`;
  reveal(tREP, seg(t, .45, .8)); tREP.style.transform = `scale(${1 + .06 * Math.exp(-Math.pow((t - T.rep - .1) / .15, 2)) + .03 * seg(t, T.rep, T.no2)})`;
  tMEJ.style.transform = `translateY(${-30 * E.io(seg(t, .3, .6))}px)`;
  SHEET.style.transform = `translateY(${(1 - sh) * -1300}px) rotate(${-3 + 1.2 * sh}deg)`;
  CAR.style.opacity = Math.floor(t * 4) % 2 ? 1 : .1;
  reveal(tAPU, seg(t, T.no2 - .05, T.no2 + .3)); tAPU.style.top = '1400px';
  const out = seg(t, b - .12, b); [SHEET, tAPU].forEach(e => e.style.opacity = 1 - out); ANC.style.opacity = 1 - out;
}

// ── 2 · EL RECUERDO: foto del entreno, anotada a mano ──
const CW = 960, CH = 540, CX = 60, CY = 680;
const CARD = mk('div', `position:absolute;left:${CX}px;top:${CY}px;width:${CW}px;height:${CH}px;background:#fbfaf6;padding:0;display:none;box-shadow:0 40px 90px rgba(0,0,0,.55);border:14px solid #fbfaf6;border-bottom-width:14px;box-sizing:content-box;margin-left:-14px;margin-top:-14px;overflow:hidden`, '', $('cards'));
const CIMG = mk('img', 'position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover', null, CARD); CIMG.src = IMG('rmtrain');
const CFOG = mk('div', 'position:absolute;inset:0;background:#f2f1ec;opacity:0', '', CARD);
const NS = 'http://www.w3.org/2000/svg';
const SVG = document.createElementNS(NS, 'svg'); SVG.setAttribute('viewBox', '0 0 1280 720'); SVG.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;overflow:visible'; CARD.appendChild(SVG);
const sp = (d, w = 12, dash) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#2f6bff'); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); SVG.appendChild(p); const L = p.getTotalLength(); p._L = L; p.style.strokeDasharray = dash ? dash : L; return p; };
// ejercicio: pases del rondo (P1 → P2 → P3 → P4) con punta de flecha
const P = [[380, 400], [690, 380], [1015, 370], [1180, 400]];
const PASS = [[0, 1], [1, 2], [2, 3]].map(([a, b]) => { const [x1, y1] = P[a], [x2, y2] = P[b]; const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 120;
  const path = sp(`M${x1 + 30} ${y1 - 30} Q ${mx} ${my} ${x2 - 30} ${y2 - 40}`); const ang = Math.atan2((y2 - 40) - my, (x2 - 30) - mx);
  const hx = x2 - 30, hy = y2 - 40, h = sp(`M${hx - 34 * Math.cos(ang - .5)} ${hy - 34 * Math.sin(ang - .5)} L${hx} ${hy} L${hx - 34 * Math.cos(ang + .5)} ${hy - 34 * Math.sin(ang + .5)}`); return [path, h]; });
// parejas: círculos y unión
const circ = (x, y, r) => sp(`M${x + r} ${y} A ${r} ${r} 0 1 1 ${x + r - .1} ${y - 8}`, 8);
const PAIR = [circ(380, 420, 95), circ(690, 400, 95), circ(1015, 390, 80), circ(1180, 420, 95)];
const LINKS = [sp('M475 420 L 595 400', 7), sp('M1095 390 L 1085 410', 7)];
// tiempos: chip
const CHIP = mk('div', 'position:absolute;left:740px;top:430px;padding:14px 24px;background:#2f6bff;border-radius:16px;font-family:M;font-weight:800;font-size:52px;color:#fff;display:none;letter-spacing:-.02em;box-shadow:0 10px 30px rgba(0,0,0,.35)', '⏱ 4 × 6′', CARD);
const tOCT = tx(`<div class="kick">${M('UN DÍA DE')}</div>${M('OCTUBRE')}`, 330, 'M8', 120);
const tENC = tx(M('<span class="S blue">todo encajó.</span>'), 1330, '', 150);
const FICHA = mk('div', 'position:absolute;left:110px;top:1255px;width:860px;height:350px;background:#fbfaf6;border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.45);display:none;overflow:hidden');
mk('div', 'position:absolute;left:48px;top:30px;font-family:M;font-weight:800;font-size:34px;letter-spacing:.02em;color:#5e5b54;white-space:nowrap', 'APUNTA DESPUÉS DE CADA ENTRENO', FICHA);
mk('div', 'position:absolute;left:48px;right:48px;top:78px;height:3px;background:#e4e0d4', '', FICHA);
const ROWS = ['Ejercicio', 'Tiempos', 'Parejas'].map((w, i) => { const r = mk('div', `position:absolute;left:48px;top:${100 + i * 74}px;font-family:M;font-weight:800;font-size:58px;letter-spacing:-.03em;color:#0d0f14`, `<span style="color:#2f6bff;margin-right:22px">${i + 1}</span>${w}`, FICHA);
  const ck = mk('div', 'position:absolute;right:52px;font-family:M;font-weight:800;font-size:52px;color:#2f6bff', '✓', FICHA); ck.style.top = (102 + i * 74) + 'px'; r._ck = ck; return r; });
const tSEN = tx(M('<span class="S blue" style="font-size:230px">sensación.</span>'), 1320, '', 230);
const tQUE = tx(M('HOY SOLO TE QUEDA UNA'), 1262, 'M7', 46); tQUE.style.letterSpacing = '.14em';
function memory(t) {
  const a = T.aquel - .05, b = T.y - .05, v = t >= a && t < T.la - .05;
  show(CARD, v); show(tOCT, t >= a && t < T.hoy); show(tENC, t >= T.todo - .1 && t < T.ej - .05);
  show(FICHA, t >= T.ej - .1 && t < T.queda - .1);
  show(tQUE, t >= T.queda - .25 && t < b); show(tSEN, t >= T.sens - .05 && t < T.la - .05);
  if (!v) return;
  // fondo: tinta → papel (la memoria se vacía)
  const fog = E.io(seg(t, T.hoy - .05, T.sens - .05));
  show($('sysL'), true); show($('paper'), fog > 0); $('paper').style.opacity = fog;
  const p = E.out5(seg(t, a, a + .5));
  const drift = seg(t, a, b);
  const tremor = t > T.hoy && t < T.sens ? 2 * Math.sin(t * 61) : 0;
  // después de «sensación» la tarjeta sube y se encoge para dejar sitio a las copias
  const up = E.io(seg(t, T.y - .05, T.y + .4));
  const sc = (1 + (1 - p) * .12 + .03 * drift) * lerp(1, .5, up);
  CARD.style.transform = `translate(${tremor}px,${(1 - p) * 140 + lerp(0, -380, up)}px) rotate(${lerp(-2.2, 0, up) + (1 - p) * -3}deg) scale(${sc})`;
  CARD.style.opacity = p * (1 - .35 * up);
  CIMG.style.transform = `scale(${1.04 + .06 * drift})`;
  CIMG.style.filter = `grayscale(${fog}) blur(${22 * E.in(seg(t, T.hoy, T.sens))}px) contrast(${1 - .4 * fog})`;
  CFOG.style.opacity = .82 * E.io(seg(t, T.hoy + .1, T.sens + .1));
  CARD.style.boxShadow = `0 40px 90px rgba(0,0,0,${.55 * (1 - fog) + .12 * fog})`;
  // trazos: se dibujan con su palabra y se borran en orden inverso
  const draw = (pth, s0, d, e0) => { const q = E.io(seg(t, s0, s0 + d)), r = E.io(seg(t, e0, e0 + .35)); pth.style.strokeDashoffset = pth._L * (1 - q); pth.style.opacity = 1 - r; pth.style.filter = `blur(${8 * r}px)`; };
  PASS.forEach(([pa, h], i) => { draw(pa, T.ejer - .05 + i * .18, .3, T.queda + .25); draw(h, T.ejer + .2 + i * .18, .12, T.queda + .25); });
  const tq = E.out5(seg(t, T.tie - .05, T.tie + .25)), tr = E.io(seg(t, T.hoy + .45, T.hoy + .8));
  show(CHIP, t >= T.tie - .05); CHIP.style.transform = `scale(${.6 + .4 * tq}) rotate(-4deg)`; CHIP.style.opacity = tq * (1 - tr); CHIP.style.filter = `blur(${8 * tr}px)`;
  PAIR.forEach((c, i) => draw(c, T.par - .05 + i * .1, .3, T.hoy - .05 + i * .05)); LINKS.forEach((l, i) => draw(l, T.par + .3 + i * .1, .15, T.hoy - .05));
  reveal(tOCT, seg(t, a + .05, a + .45)); tOCT.style.opacity = 1 - seg(t, T.hoy - .2, T.hoy + .1);
  reveal(tENC, seg(t, T.todo - .1, T.todo + .25)); tENC.style.opacity = 1 - seg(t, T.ej - .2, T.ej - .05);
  { const fi = E.out5(seg(t, T.ej - .1, T.ej + .3)), fo = E.io(seg(t, T.queda - .45, T.queda - .1));
    FICHA.style.transform = `translateY(${(1 - fi) * 120}px) rotate(${-1 + fi}deg)`; FICHA.style.opacity = fi * (1 - fo); FICHA.style.filter = `blur(${10 * fo}px)`;
    ROWS.forEach((r, i) => { const q = E.out5(seg(t, T.ej + i * .1, T.ej + .3 + i * .1)); r.style.opacity = q; r.style.transform = `translateX(${(1 - q) * -30}px)`;
      const s0 = [T.ejer, T.tie, T.par][i], c = E.out5(seg(t, s0, s0 + .25)); r._ck.style.opacity = c; r._ck.style.transform = `scale(${1.6 - .6 * c})`; }); }
  reveal(tQUE, seg(t, T.queda - .25, T.queda + .1)); tQUE.style.color = '#6d6a62'; tQUE.style.opacity = 1 - seg(t, b - .1, b);

let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const W = { web: T.une - .05 }; W.tap = W.web + .62; W.ok = W.tap + .22; W.gal = T.n28 + .28;
const PT = Array.from({ length: 22 }, () => { const o = document.createElement('div'); const a = rnd() * Math.PI * 2, r = 160 + rnd() * 260;
  o.style.cssText = `position:absolute;left:0;top:0;width:${10 + rnd() * 10}px;height:${10 + rnd() * 10}px;border-radius:50%;background:${rnd() < .7 ? '#2f6bff' : '#f2f1ec'};display:none;margin-left:${470 + 70}px;margin-top:0px`;
  o._dx = Math.cos(a) * r; o._dy = Math.sin(a) * r * .7; $('web').appendChild(o); return o; });
const GA = [ph('flick', '50% 25%'), ph('rmcharla', '58% 50%')];

function webcta(t) {
  // 9 · web oscura
  const wv = t >= W.web && t < W.gal; show($('web'), wv);
  if (wv) {
    const p = E.out5(seg(t, W.web, W.web + .4));
    $('wp').style.top = (470 + (1 - p) * 120) + 'px'; $('wp').style.opacity = p;
    [...$('wp').children].forEach((c, i) => { const q = E.out(seg(t, W.web + i * .04, W.web + .28 + i * .04)); c.style.opacity = q; c.style.transform = `translateY(${(1 - q) * 40}px)`; });
    const pg = (t * 1.4) % 1; $('ping').style.transform = `scale(${1 + pg * 1.6})`; $('ping').style.opacity = 1 - pg;
    const total0 = ((11 * 24 + 3) * 60 + 29) * 60 + 59 - Math.floor(t - W.web);
    const acc = E.in(seg(t, W.web + .3, W.gal - .08)); const rem = Math.max(0, Math.round(total0 * (1 - acc)));
    const dd = Math.floor(rem / 86400), hh = Math.floor(rem % 86400 / 3600), mm = Math.floor(rem % 3600 / 60), ss = rem % 60;
    [[ 'cd1', dd], ['cd2', hh], ['cd3', mm], ['cd4', ss]].forEach(([id, v]) => { const el = $(id); const nv = String(v).padStart(2, '0'); if (el.textContent !== nv) { el._ch = t; el.textContent = nv; } el.style.color = rem === 0 ? '#4f86ff' : '#f2f1ec';
      const q = E.out(seg(t, el._ch || -9, (el._ch || -9) + .18)); el.style.transform = `translateY(${(1 - q) * -22}px)`; el.style.opacity = .35 + .65 * q; });
    PT.forEach((o, i) => { const q = seg(t, W.ok + .15, W.ok + .85); o.style.display = q > 0 && q < 1 ? 'block' : 'none'; if (q > 0 && q < 1) { const e = E.out(q); o.style.transform = `translate(${o._dx * e}px,${o._dy * e + 120 * q * q}px) scale(${1 - q})`; o.style.opacity = 1 - q; } });
    const z = seg(t, W.gal - .12, W.gal); $('wp').querySelector('.cd').style.transform = `scale(${1 + .05 * Math.sin(z * Math.PI)})`;
    // cursor
    const fl = $('fld'), bt = $('btn'), wp = $('wp'); const top = parseFloat(wp.style.top);
    const fy = top + fl.offsetTop + 75, by = top + bt.offsetTop + 80;
    const P = [[W.web + .08, 980, 1800], [W.web + .22, 760, fy + 10], [W.web + .5, 740, fy + 14], [W.tap - .12, 560, by + 12], [W.tap - .02, 562, by + 14], [W.gal, 562, by + 14]];
    let x = P[0][1], y = P[0][2];
    for (let i = 0; i < P.length - 1; i++) if (t >= P[i][0]) { const k = E.io(seg(t, P[i][0], P[i + 1][0])); x = P[i][1] + (P[i + 1][1] - P[i][1]) * k; y = P[i][2] + (P[i + 1][2] - P[i][2]) * k; }
    const cu = $('cur'); show(cu, t > W.web + .08 && t < W.ok + .2); cu.style.left = x + 'px'; cu.style.top = y + 'px';
    const click = Math.max(Math.exp(-Math.pow((t - (W.web + .24)) / .06, 2)), Math.exp(-Math.pow((t - W.tap) / .06, 2)));
    cu.style.transform = `scale(${1 - .2 * click})`; cu.style.opacity = 1 - seg(t, W.ok, W.ok + .2);

    fl.style.borderColor = focus ? '#2f6bff' : '#262b36'; fl.style.boxShadow = focus ? `0 0 0 ${(8 + 3 * Math.sin(t * 6)) * E.out(seg(t, W.web + .24, W.web + .37))}px rgba(47,107,255,.22)` : 'none';
    const em = 'entrenador@miclub.es'; const tp = seg(t, W.web + .26, W.web + .5); const ne = Math.floor(em.length * clamp(tp + .06 * Math.sin(tp * 19)));
    $('fldt').innerHTML = ne ? em.slice(0, ne) : (focus ? '' : '<span class="ph2">Tu email</span>');
    $('fc').style.opacity = focus && t < W.tap ? (Math.floor(t * 4) % 2 ? 1 : .15) : 0;
    if (t > W.tap) { fl.style.borderColor = '#262b36'; fl.style.boxShadow = 'none'; }
    // botón

    bt.style.width = (940 - (940 - 560) * doneP) + 'px'; bt.style.borderRadius = (28 + 52 * doneP) + 'px';
    PT.forEach(o => { o.style.left = '0px'; o.style.top = (top + bt.offsetTop + 70) + 'px'; });
    const rip = $('rip'); const rp = seg(t, W.tap, W.tap + .5); show(rip, rp > 0 && rp < 1);
    rip.style.left = (560 - 70 - 20) + 'px'; rip.style.top = '60px'; rip.style.transform = `scale(${1 + rp * 40})`; rip.style.opacity = .9 * (1 - rp);

  }

  const g0 = W.gal, g2 = T.tres - .1;
  GA.forEach((g, i) => { const a = g0, b = i ? g0 : g2, v = t >= a && t < b; show(g, v); if (v) place(g, 0, 0, 1080, 1920, { is: 1.12 - .06 * seg(t, a, b), dark: .4, z: 2 }); });

  if (t >= W.gal) show($('web'), false);
}

window.frame = t => {

  hook(t); memory(t); copies(t); app(t); webcta(t);
  $('grain').style.transform = `translate(${(Math.floor(t * 24) * 37) % 200 - 100}px,${(Math.floor(t * 24) * 53) % 200 - 100}px)`;
};
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))).then(() => setTimeout(() => { window.frame(0); window.ready = true; }, 300));
