<script>

const M = s => `<span class="mask"><span>${s}</span></span>`;



// ── 1 · GANCHO (v3, corrección de Biel 17/11): escena concreta desde el fotograma 0 — «CAE DEL REBOTE. PISA UN PIE.» → «Tu pívot, fuera.» ──
const RM = ph('madrid', '62% 40%');

const tC2 = tx(`<div class="kick" style="color:#e6e8ee">${M('LESIÓN Nº 1 EN BALONCESTO')}</div>`, 1370, 'shadow', 38);
function hook(t) {
  const b = T.s2, v = t < b; [RM, tA, tB].forEach(e => show(e, v)); show(tC, v && t >= T.q1 - .1); show(tC2, v && t >= T.b1 + .1); if (!v) return;

  ms[0].style.transform = `translateY(${(1 - q1) * 110}%)`; ms[1].style.transform = `translateY(${(1 - q2) * 110}%)`;
  reveal(tC2, seg(t, T.b1 + .1, T.b1 + .4));
  const pp = Math.exp(-Math.pow((t - T.p2 - .1) / .14, 2)); tB.style.transform = `scale(${1 + .05 * pp})`;

  const out = seg(t, b - .1, b); [RM, tA, tB, tC, tC2].forEach(e => e.style.opacity = 1 - out);

// ── 2 · EL DATO: ficha de fuente sobre papel ──
const tK = tx(`<div class="kick" style="color:#8a877e">${M('16 TEMPORADAS · NCAA (EE. UU.)')}</div>`, 420, '', 40);
const tN1 = tx(M('<span class="ink">16 temporadas</span>'), 540, 'M8', 130);
const tN2 = tx(M('<span class="S blue">de baloncesto universitario.</span>'), 690, '', 92);
const tD1 = tx(M('<span class="ink">El esguince</span>'), 520, 'M8', 120);
const tD2 = tx(M('<span class="ink">de tobillo</span>'), 650, 'M8', 120);
const tD3 = tx(M('<span class="S blue">la lesión nº 1 en baloncesto.</span>'), 800, '', 88);
const ANK = mk('div', 'position:absolute;left:340px;top:960px;width:400px;height:400px;display:none', `<svg viewBox="0 0 400 400" width="400" height="400"><circle cx="200" cy="200" r="170" fill="none" stroke="#e4e0d4" stroke-width="18"/><circle id="ring" cx="200" cy="200" r="170" fill="none" stroke="#2f6bff" stroke-width="18" stroke-linecap="round" stroke-dasharray="1068" stroke-dashoffset="1068" transform="rotate(-90 200 200)"/><text x="200" y="232" text-anchor="middle" font-family="M" font-weight="800" font-size="120" fill="#0d0f14">Nº 1</text></svg>`, $('cards'));
const tF = mk('div', 'position:absolute;left:0;width:1080px;top:1470px;text-align:center;font-family:M;font-weight:500;font-size:30px;line-height:1.4;color:#8a877e;display:none', 'Dick et al., <i>J Athl Train</i>, 2007 · baloncesto masculino universitario,<br>temporadas 1988–89 a 2003–04 (NCAA Injury Surveillance System)');
function dato(t) {
  const a = T.s2, b = T.s3, v = t >= a && t < b; [tK, tD1, tD2, ANK, tF].forEach(e => show(e, v)); show(tD3, v && t >= T.d3 - .1); show(tN1, v && t < T.esg - .15); show(tN2, v && t >= T.dic + .9 && t < T.esg - .15); if (!v) return;
  show($('paper'), true); reveal(tN1, seg(t, a + .05, a + .4)); reveal(tN2, seg(t, T.dic + .9, T.dic + 1.25)); tN1.style.transform = tN2.style.transform = `scale(${1 + .04 * seg(t, a, T.esg)})`;
  reveal(tK, seg(t, a, a + .35)); reveal(tD1, seg(t, T.esg - .15, T.esg + .2)); reveal(tD2, seg(t, T.esg - .05, T.esg + .3)); reveal(tD3, seg(t, T.d3 - .1, T.d3 + .3));

  const out = seg(t, b - .1, b); [tK, tD1, tD2, tD3, tF].forEach(e => e.style.opacity = Math.min(parseFloat(e.style.opacity || 1), 1 - out)); ANK.style.opacity = Math.min(parseFloat(ANK.style.opacity), 1 - out);
}
// ── 3 · LA APP: captura real de Rutinas (Prevención de isquios y tobillo) ──
const PHN = mk('div', 'position:absolute;left:275px;top:480px;width:530px;height:1075px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:15px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)',
  '<div style="position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4"><div id="sA" style="position:absolute;left:0;top:0;width:100%"><img src="/tools/reel28/img/rutinas.jpg" style="width:100%;display:block"><div id="hl1" style="position:absolute;left:3.2%;top:50.8%;width:93.6%;height:25.8%;border:6px solid #2f6bff;border-radius:18px;opacity:0"></div></div></div>', $('phones'));
const tPT = tx(`<div class="kick">${M('EN LA APP DE')}</div>${M('<span class="S blue">ProTeam</span>')}`, 230, '', 120);
const tJ = tx(M('<span class="S" style="color:#f2f1ec">tu rutina de tobillo.</span>'), 1585, '', 92);
function app(t) {
  const a = T.s3, b = T.s4, v = t >= a && t < b; show(PHN, v); show(tPT, v); show(tJ, v && t >= T.jug - .1); if (!v) return;

// ── 4 · RETO: selección española entrenando (Eurobasket 2017) ──
const ES = ph('espana', '50% 50%');
const tR0 = tx(`<div class="kick" style="color:#e6e8ee">${M('RETO PARA TU STAFF')}</div>`, 770, 'shadow', 40);
const tR1 = tx(M('¿Cuándo entrenasteis'), 845, 'M8 shadow', 90);
const tR2 = tx(M('<span class="S" style="color:#9db8ff">el tobillo por última vez?</span>'), 980, 'shadow', 100);
const tES = mk('div', 'position:absolute;left:0;width:1080px;top:1640px;text-align:center;font-family:M;font-weight:500;font-size:26px;color:#aab2c3;display:none', 'Selección española · entrenamiento previo al Eurobasket 2017');
// ── 5 · CTA: la entrada en la lista de espera con el contador (la misma animación de u09) ──
let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const W = { web: T.camp - .05 }; W.tap = W.web + 1.15; W.ok = W.tap + .22; W.gal = T.gra - .1;
const PT = Array.from({ length: 22 }, () => { const o = document.createElement('div'); const a = rnd() * Math.PI * 2, r = 160 + rnd() * 260;
  o.style.cssText = `position:absolute;left:0;top:0;width:${10 + rnd() * 10}px;height:${10 + rnd() * 10}px;border-radius:50%;background:${rnd() < .7 ? '#2f6bff' : '#f2f1ec'};display:none;margin-left:${470 + 70}px;margin-top:0px`;
  o._dx = Math.cos(a) * r; o._dy = Math.sin(a) * r * .7; $('web').appendChild(o); return o; });
const GA = ph('espana', '50% 50%');
const tHE = tx('<span class="mask"><span>HASTA EL</span></span>', 1130, 'M8 shadow', 70);
const t28 = tx('<span class="mask"><span>27 NOV</span></span>', 1220, 'M8 shadow', 230);
const t3M = tx('<span class="mask"><span class="S blue">3 meses gratis.</span></span>', 800, 'shadow', 180);
function reto(t) {
  const a = T.s4, b = W.web, v = t >= a && t < b; show(ES, v); show(tR0, v); show(tES, v); show(tR1, v && t >= T.r1 - .1); show(tR2, v && t >= T.r2 - .1); if (!v) return;

  reveal(tR0, seg(t, a, a + .35)); reveal(tR1, seg(t, T.r1 - .1, T.r1 + .25)); reveal(tR2, seg(t, T.r2 - .1, T.r2 + .25)); tES.style.opacity = .8;

function webcta(t) {
  // 9 · web oscura

    const p = E.out5(seg(t, W.web, W.web + .4));
    $('wp').style.top = (470 + (1 - p) * 120) + 'px'; $('wp').style.opacity = p;
    [...$('wp').children].forEach((c, i) => { const q = E.out(seg(t, W.web + i * .04, W.web + .28 + i * .04)); c.style.opacity = q; c.style.transform = `translateY(${(1 - q) * 40}px)`; });
    const pg = (t * 1.4) % 1; $('ping').style.transform = `scale(${1 + pg * 1.6})`; $('ping').style.opacity = 1 - pg;
    const total0 = ((10 * 24 + 6) * 60 + 29) * 60 + 59 - Math.floor(t - W.web);
