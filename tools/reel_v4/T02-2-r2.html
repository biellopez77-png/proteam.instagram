 [T.entre-.15,...r0((C1X+C2X)/2,CY+80),.7,.7],           // alejarse: los dos relojes y el hilo
 [T.y1-.12,...r0(C2X,CY+10),1.3,.6],                      // el segundo, la etiqueta roja

 [T.en1-.2,FD[0],FD[1]-30,.86,.7],                        // a través del cono, al campo

 [T.una-.2,CAL[0],CAL[1]+40,.7,.65],                      // la cadena

 [T.ahora-.25,...r0(1180,CY+100),.5,.7],                    // los tres relojes en el mismo eje
 [T.en_est-.15,...r0(C3X+170,CY+520),1.0,.65],             // el tercer reloj y la ficha
 [CUT2,...sem(760,330),1.25],                             // giro 2: de negro a blanco · la línea

function cam(t){let i=0;while(i+1<SH.length&&SH[i+1][0]<=t)i++;const s=SH[i];
 if(i===0||CUTS.has(s[0]))return [s[1],s[2],s[3],0];
 const p=SH[i-1],Dd=s[4]||.62,k=r(t,s[0],s[0]+Dd),e=io(k);
 const lz=lerp(Math.log(p[3]),Math.log(s[3]),e)-.12*Math.sin(Math.PI*k)*(Math.hypot(s[1]-p[1],s[2]-p[2])>600?1:0);
