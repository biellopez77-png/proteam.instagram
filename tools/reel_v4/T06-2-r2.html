window.frame=function(t){

  place($('PT'),PTz[0],PTz[1]);drawK(PTs.ring,io(r(t,T.sin,T.sin+.7))*(1-r(t,T.para3-.6,T.para3-.2)));

  CTs.r.forEach(([g,x,y],i)=>{const a=eo(r(t,T.rojos-.15+i*.1,T.rojos+.15+i*.1));let px=x,py=y;
   if(i===0){const k=io(r(t,T.defiende,T.defiende+.8));px=lerp(x,500,k);py=lerp(y,330,k)}else{const ph=t*1.1+i*1.7;px+=8*Math.sin(ph);py+=6*Math.cos(ph*.8)}

  place($('HO'),HOz[0],HOz[1]);{const k=r(t,T.y3-.15,T.falla+.15),k2=r(t,T.falla+.15,T.falla+.85);let bx,by;
   if(k2<=0){const e=io(k);bx=lerp(120,470,e);by=lerp(760,312,e)-300*Math.sin(Math.PI*e)*(1-e)}else{const e=eo(k2);bx=lerp(470,300,e);by=312-200*Math.sin(Math.PI*e*.7)+lerp(0,420,e*e)}
   HOs.ball.setAttribute('transform',`translate(${bx.toFixed(1)} ${by.toFixed(1)}) rotate(${(t*120)%360})`);HOs.tr.setAttribute('opacity',.35*(1-r(t,T.falla,T.falla+.4)))}
  // 7 · nota

  const ks=io(r(t,T.cambia,T.cambia+.75));SBs.red.setAttribute('transform',`translate(${lerp(350,-120,ks)} ${lerp(600,640,ks)}) rotate(${lerp(0,-12,ks)})`);SBs.red.setAttribute('opacity',1-r(t,T.cambia+.3,T.cambia+.75));
