<!doctype html>

<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}

.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}

.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}

#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}

.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}

.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}

.cd{display:flex;gap:20px;margin-top:60px}

.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}

#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}

#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}

</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="strip" style="position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:3;pointer-events:none"></div>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">11</b><span>DÍAS</span></div><div><b id="cd2">03</b><span>HORAS</span></div><div><b id="cd3">29</b><span>MIN</span></div><div><b id="cd4">59</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>

  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel03/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel03/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, x, y, w, h, o = {}) {
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = `translate(${o.dx || 0}px,${o.dy || 0}px) rotate(${o.rot || 0}deg) scale(${o.s || 1})`;
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1; el.style.filter = o.blur ? `blur(${o.blur}px)` : 'none';
  if (el._img) el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  if (el._sh) el._sh.style.background = `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) {
  const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d;
}
function reveal(el, p, dir = 'up') {
  el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i));
    s.style.transform = dir === 'up' ? `translateY(${(1 - q) * 110}%)` : `translateX(${(q - 1) * 105}%)`; });
}
const M = s => `<span class="mask"><span>${s}</span></span>`;

// ── TIRA DE DÍAS (fija arriba; en el bloque 7 baja al centro) ──
const DAYS = ['LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB', 'DOM'];
const CW = 118, CG = 12, SX = (1080 - (7 * CW + 6 * CG)) / 2, SY = 330;
const CELLS = DAYS.map((d, i) => mk('div', `position:absolute;left:${SX + i * (CW + CG)}px;top:${SY}px;width:${CW}px;height:92px;border-radius:18px;border:2px solid #2a3040;background:#121620;font-family:M;font-weight:800;font-size:30px;letter-spacing:.06em;color:#7d8597;display:flex;align-items:center;justify-content:center`, d, $('strip')));
const RW = mk('div', 'position:absolute;left:0;width:1080px;top:272px;text-align:center;font-family:M;font-weight:800;font-size:34px;letter-spacing:.2em;color:#4f86ff;display:none', '◀◀&nbsp; REBOBINANDO', $('strip'));
const CTOP = [0, 0, 0, 0, 0, 0, 0];
function strip(t) {
  const v = t < T.la - .05; show($('strip'), v); if (!v) return;
  const paperOn = t >= T.c1 - .05 && t < T.sab - .05;
  // día activo
  let act = 5;
  if (t >= T.pero - .05 && t < T.mar) { const k = Math.min(3, Math.floor(seg(t, T.pero, T.mar - .05) * 4)); act = 5 - 1 - k; }
  if (t >= T.mar && t < T.sab - .05) act = t < T.c2 - .05 ? 1 : t < T.c3 - .05 ? 2 : 3;
  // bloque 7: la tira baja al centro y se encienden L–V
  const big = E.io(seg(t, T.pero2 - .05, T.pero2 + .4));
  const y = lerp(SY, 760, big), sc = lerp(1, 1.0, big);
  CELLS.forEach((c, i) => {
    let on = i === act && big < .5;
    let lit = big > 0 ? seg(t, T.dec - .1 + i * .1, T.dec + i * .1) : 0;
    if (i > 4) lit = 0;
    const blink = i === act && t >= T.pero - .05 && t < T.mar ? 1 : 0;
    c.style.top = y + 'px';
    c.style.height = lerp(92, 150, big) + 'px'; c.style.fontSize = lerp(30, 34, big) + 'px';
    const fill = on || lit > .5;
    c.style.background = fill ? '#2f6bff' : paperOn ? '#fbfaf6' : '#121620';
    c.style.borderColor = fill ? '#2f6bff' : paperOn ? '#d6d2c6' : '#2a3040';
    c.style.color = fill ? '#fff' : paperOn ? '#8a877e' : '#7d8597';
    const pop = Math.exp(-Math.pow((t - (T.dec + i * .1)) / .07, 2)) * (i < 5 ? 1 : 0) + (i < 5 ? .1 * Math.exp(-Math.pow((t - T.sem - .03) / .09, 2)) : 0);
    const dim = big > .5 && i > 4 ? .45 : 1;
    c.style.opacity = dim * E.out(seg(t, T.pero - .25 + i * .03, T.pero + .05 + i * .03));
    c.style.transform = `scale(${1 + .08 * pop + (on && blink ? .04 : 0)})`;
  });
  show(RW, t >= T.pero - .05 && t < T.mar + .1); RW.style.opacity = Math.floor(t * 6) % 2 ? 1 : .35;
}

// ── 1 · GANCHO: 88:00 sobre Guardiola ──
const G = ph('guardiola', '50% 22%'), STAD = ph('estadio', '50% 50%'), VEST = ph('vestuario', '50% 50%'), CAMP = ph('campo', '40% 50%');
const SB = mk('div', 'position:absolute;left:0;width:1080px;top:850px;text-align:center;display:none', '<span style="display:inline-flex;gap:26px;align-items:center;background:rgba(13,15,20,.85);border:2px solid #2a3040;border-radius:999px;padding:16px 34px;font-family:M;font-weight:800;font-size:36px;letter-spacing:.08em;color:#c9cfdb">LOCAL <b style="color:#fff;font-size:44px">1 – 2</b> VISITANTE</span>');
const tPI = tx(M('PIERDES EN EL MINUTO'), 990, 'M7 shadow', 46); tPI.style.letterSpacing = '.14em'; tPI.style.color = '#e6e8ee';
const CLK = tx('', 1050, 'M8 shadow', 300); CLK.style.fontVariantNumeric = 'tabular-nums'; CLK.style.letterSpacing = '-.03em';
CLK.innerHTML = '<span class="mask"><span id="clk">88:00</span></span>';
const tMAR = tx(`<div class="kick" style="margin-bottom:4px">${M('EL PROBLEMA EMPEZÓ EL')}</div>${M('<span class="S blue" style="font-size:230px">martes</span>')}`, 900, 'shadow', 230);
function hook(t) {
  const a = 0, b = T.c1 - .05; const v = t < b;
  [G, STAD, VEST, CAMP].forEach(e => show(e, false)); show(SB, v && t < T.pero + .2); show(tPI, v && t < T.pero - .05); show(CLK, v && t < T.mar + .1); show(tMAR, v && t >= T.mar - .05);
  if (!v) return;
  const rw = seg(t, T.pero - .05, T.mar - .05);          // rebobinado
  const seq = [G, STAD, VEST, CAMP];
  if (t < T.pero - .05) { show(G, true); const p = E.out5(seg(t, 0, .45));
    place(G, 0, 0, 1080, 1920, { s: 1 + (1 - p) * .1, is: 1.12 - .06 * seg(t, 0, T.pero), dark: .38 + .12 * seg(t, T.pero - .35, T.pero - .05), z: 1 }); }
  else { const k = Math.min(3, Math.floor(rw * 4)), f = (rw * 4) - k;
    seq.forEach((e, i) => { if (i === k || (i === k + 1 && k < 3)) show(e, true); });
    const cur = seq[k], nxt = seq[k + 1];
    if (k < 3) { const q = E.io(clamp(f * 1.6 - .6));
      place(cur, 0, 0, 1080, 1920, { dy: q * 1920, is: k ? 1.1 : 1.06, dark: .5, blur: 6 * q, z: 1 });
      place(nxt, 0, 0, 1080, 1920, { dy: (q - 1) * 1920, is: 1.1, dark: .5, blur: 6 * (1 - q), z: 1 }); }
    else place(cur, 0, 0, 1080, 1920, { is: 1.12 - .05 * seg(t, T.mar - .05, b), dark: .62, z: 1 });
    if (k === 3 && t > b - .2) { const o = seg(t, b - .2, b); cur.style.opacity = 1 - o; }
  }
  const p0 = E.out5(seg(t, .2, .55)); SB.style.opacity = p0 * (1 - seg(t, T.pero - .1, T.pero + .2)); SB.style.transform = `translateY(${(1 - p0) * -20}px)`;
  reveal(tPI, seg(t, T.pi, T.pi + .4));
  reveal(CLK, seg(t, T.min - .15, T.min + .2));
  // reloj: 88:00 avanzando; después corre hacia atrás hasta 00:00
  let secs = 88 * 60 + Math.floor(Math.max(0, t - T.min));
  if (t >= T.pero - .05) { const r = E.in(seg(t, T.pero - .05, T.mar - .1)); secs = Math.round((88 * 60 + 2) * (1 - r)); }
  $('clk').textContent = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
  const hit = Math.exp(-Math.pow((t - T.n88 - .05) / .09, 2));
  const out = E.io(seg(t, T.mar - .15, T.mar + .1));
  CLK.style.transform = `scale(${(1 + .07 * hit + .02 * seg(t, T.min, T.pero)) * (1 - .4 * out)})`; CLK.style.opacity = 1 - out;
  CLK.style.color = t >= T.pero - .05 ? '#4f86ff' : '#fff';
  reveal(tMAR, seg(t, T.mar - .05, T.mar + .3)); tMAR.style.transform = `scale(${1 + .04 * seg(t, T.mar, b)})`;
  tMAR.style.opacity = 1 - seg(t, b - .15, b);
}

// ── 2 · LA SEMANA EN PAPEL: martes / miércoles / jueves ──
const CARD = (head) => { const c = mk('div', 'position:absolute;left:110px;top:520px;width:860px;height:800px;background:#fbfaf6;border-radius:26px;box-shadow:0 30px 70px rgba(13,15,20,.18);display:none;overflow:hidden', '', $('cards'));
  mk('div', 'position:absolute;left:56px;top:46px;font-family:M;font-weight:800;font-size:30px;letter-spacing:.16em;color:#8a877e', head, c);
  mk('div', 'position:absolute;left:56px;right:56px;top:104px;height:3px;background:#e4e0d4', '', c); return c; };
// martes: opciones que se tachan
const C1 = CARD('MARTES · 18:52');
const OPT = ['¿Rondo?', '¿Partidillo?', '¿Físico?'].map((s, i) => { const o = mk('div', `position:absolute;left:70px;top:${190 + i * 170}px;font-family:M;font-weight:800;font-size:86px;letter-spacing:-.04em;color:#0d0f14;display:none`, s, C1);
  const k = mk('div', 'position:absolute;left:-3%;right:-3%;top:50%;height:14px;background:#2f6bff;border-radius:3px;transform-origin:0 50%', '', o); o._k = k; o._d = 'block'; return o; });
const tCOC = tx(M('EN EL COCHE'), 1410, 'M8 ink', 120); const uCOC = mk('div', 'position:absolute;left:24%;right:24%;bottom:-4px;height:12px;background:#2f6bff;transform-origin:0 50%;border-radius:2px', '', tCOC);
// miércoles: plantilla con la columna de cansancio vacía
const C2 = CARD('MIÉRCOLES · ENTRENO');
mk('div', 'position:absolute;left:70px;top:140px;font-family:M;font-weight:800;font-size:26px;letter-spacing:.14em;color:#8a877e', 'JUGADOR', C2);
mk('div', 'position:absolute;left:470px;top:140px;font-family:M;font-weight:800;font-size:26px;letter-spacing:.14em;color:#0d0f14', 'CANSANCIO', C2);
const ROWS = ['#2', '#4', '#5', '#7', '#9', '#10'].map((d, i) => { const r = mk('div', `position:absolute;left:56px;right:56px;top:${200 + i * 92}px;height:78px;border-bottom:2px solid #ece8de;display:none`, '', C2); r._d = 'block';
  mk('div', 'position:absolute;left:14px;top:10px;font-family:M;font-weight:800;font-size:46px;color:#0d0f14', d, r);
  mk('div', 'position:absolute;left:110px;top:30px;width:200px;height:16px;border-radius:8px;background:#e4e0d4', '', r);
  const q = mk('div', 'position:absolute;left:414px;top:6px;font-family:M;font-weight:800;font-size:50px;color:#c8c4b8', '—', r); r._q = q; return r; });
const tSIN = tx(M('SIN APUNTAR'), 1410, 'M8 ink', 120); const uSIN = mk('div', 'position:absolute;left:23%;right:23%;bottom:-4px;height:12px;background:#2f6bff;transform-origin:0 50%;border-radius:2px', '', tSIN);
// jueves: la misma sesión copiada
const C3 = CARD('JUEVES · SESIÓN');
const SESS = '<div style="font-family:M;font-weight:800;font-size:24px;letter-spacing:.14em;color:#8a877e;margin-bottom:18px">SESIÓN</div>' + ['Rondo 4×2', 'Partido reducido', 'Finalización'].map((s, i) => `<div style="font-family:M;font-weight:700;font-size:44px;color:#0d0f14;line-height:1.5"><span style="color:#2f6bff">${i + 1}</span>&nbsp; ${s}</div>`).join('');
const COP = [0, 1, 2, 3].map(i => { const d = mk('div', 'position:absolute;left:80px;top:170px;width:640px;height:420px;background:#fff;border:2px solid #d6d2c6;border-radius:22px;padding:36px 40px;display:none', SESS, C3); d._d = 'block'; return d; });
const tSIE = tx(M('<span class="S blue" style="font-size:180px">lo de siempre.</span>'), 1380, '', 180);
function week(t) {
  const a = T.c1 - .05, b = T.sab - .05, v = t >= a && t < b; show($('paper'), v);
  const S = [[C1, a, T.c2 - .05], [C2, T.c2 - .05, T.c3 - .05], [C3, T.c3 - .05, b]];
  S.forEach(([c, s, e]) => show(c, v && t >= s - .02 && t < e + .3));

let rs = 11; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;

function webcta(t) {
  // 9 · web oscura

    [...$('wp').children].forEach((c, i) => { const q = E.out(seg(t, W.web + i * .04, W.web + .28 + i * .04)); c.style.opacity = q; c.style.transform = `translateY(${(1 - q) * 40}px)`; });
    const pg = (t * 1.4) % 1; $('ping').style.transform = `scale(${1 + pg * 1.6})`; $('ping').style.opacity = 1 - pg;

    const acc = E.in(seg(t, W.web + .3, W.gal - .08)); const rem = Math.max(0, Math.round(total0 * (1 - acc)));
    const dd = Math.floor(rem / 86400), hh = Math.floor(rem % 86400 / 3600), mm = Math.floor(rem % 3600 / 60), ss = rem % 60;
    [[ 'cd1', dd], ['cd2', hh], ['cd3', mm], ['cd4', ss]].forEach(([id, v]) => { const el = $(id); const nv = String(v).padStart(2, '0'); if (el.textContent !== nv) { el._ch = t; el.textContent = nv; } el.style.color = rem === 0 ? '#4f86ff' : '#f2f1ec';
      const q = E.out(seg(t, el._ch || -9, (el._ch || -9) + .18)); el.style.transform = `translateY(${(1 - q) * -22}px)`; el.style.opacity = .35 + .65 * q; });

}
