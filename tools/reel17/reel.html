<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
.ink{color:#0d0f14!important;text-shadow:none!important}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel17/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel17/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') { const d = document.createElement('div'); d.className = 'ph'; const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s; $('phs').appendChild(d); return d; }
function place(el, x, y, w, h, o = {}) { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = `translate(${o.dx || 0}px,${o.dy || 0}px) scale(${o.s || 1})`; el.style.opacity = o.op == null ? 1 : o.op;
  if (el._img) el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`; if (el._sh) el._sh.style.background = `rgba(0,0,0,${o.dark || 0})`; }
function tx(html, y, cls, size) { const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d; }
function reveal(el, p) { el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i)); s.style.transform = `translateY(${(1 - q) * 110}%)`; }); }
const M = s => `<span class="mask"><span>${s}</span></span>`;

// 1 · Gancho (fotograma 0): Jasikevičius + pregunta grande, ya legible
const JAS = ph('jasikevicius', '50% 22%');
const tK = tx(M('BALONCESTO · MINIBASKET'), 300, 'kick shadow', 40);
const tQ = tx(`${M('¿DEFIENDES')}<br>${M('EN <span id="zw" style="position:relative;display:inline-block">ZONA<i id="zu" class="uline" style="bottom:-6px"></i></span>?')}`, 1120, 'M8 shadow', 150); tQ.style.lineHeight = '1.0';
function hook(t) { const b = T.no, v = t < b; show(JAS, v); show(tK, v); show(tQ, v); if (!v) return;
  const p = E.out5(seg(t, 0, .5)); place(JAS, 0, 0, 1080, 1920, { s: 1 + (1 - p) * .05, is: 1.1 - .05 * seg(t, 0, b), iy: -14 * seg(t, 0, b), dark: .42 });
  reveal(tK, 1); reveal(tQ, 1); const hit = Math.exp(-Math.pow((t - 1.25) / .12, 2)); tQ.style.transform = `scale(${1 + .05 * seg(t, 0, b) + .04 * hit})`;
  $('zu').style.transform = `scaleX(${E.out5(seg(t, 1.0, 1.4))})`; JAS.style.transform += ` scale(${1 + .03 * E.io(seg(t, 1.0, 2.5))})`;
  // pequeño pulso al final, justo antes del silencio
  const out = seg(t, b - .1, b); JAS.style.opacity = tQ.style.opacity = tK.style.opacity = 1 - out; }

// 2 · Pista cenital: zona 2-3 que se tacha
const NS = 'http://www.w3.org/2000/svg';
const PIT = document.createElementNS(NS, 'svg'); PIT.setAttribute('viewBox', '0 0 1080 1920'); PIT.style.cssText = 'position:absolute;inset:0;width:1080px;height:1920px;display:none'; $('cards').appendChild(PIT);
const ln = (d, c = '#2a3040', w = 5) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', c); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); PIT.appendChild(p); return p; };
// media pista: línea de fondo arriba (y=560), canasta, zona, triple
ln('M110 560 H970 V1450 H110 Z'); ln('M400 560 V900 H680 V560'); ln('M440 900 A 100 100 0 0 0 640 900'); ln('M170 560 V700 A 380 380 0 0 0 910 700 V560'); ln('M480 610 H600', '#5d6475', 8);
const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('cx', 540); ring.setAttribute('cy', 640); ring.setAttribute('r', 22); ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#5d6475'); ring.setAttribute('stroke-width', 5); PIT.appendChild(ring);
const ZP = [[300, 960], [780, 960], [540, 760], [380, 740], [700, 740]];
const MK = ZP.map(([x, y]) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 30); c.setAttribute('fill', '#2f6bff'); PIT.appendChild(c); return c; });
const ZONE = ln('M300 960 L380 740 L540 760 L700 740 L780 960 Z', '#2f6bff', 4); ZONE.setAttribute('stroke-dasharray', '14 12');
const X1 = ln('M200 640 L880 1100', '#f2f1ec', 22), X2 = ln('M880 640 L200 1100', '#f2f1ec', 22);
[X1, X2].forEach(x => { x.setAttribute('stroke-dasharray', '900'); });
const tBCN = tx(M('EN BARCELONA,'), 1240, 'M8', 110);
const tNO = tx(M('<span class="S blue">no se puede.</span>'), 1370, '', 150);
function court(t) { const a = T.no, b = T.doc, v = t >= a && t < b; show(PIT, v); show(tBCN, v); show(tNO, v); if (!v) return; show($('sysL'), true);
  PIT.style.opacity = 1; MK.forEach((c, i) => { const q = E.out5(seg(t, a + i * .06, a + .3 + i * .06)); c.setAttribute('r', 30 * q); });
  ZONE.style.opacity = E.out(seg(t, a + .3, a + .6));
  const x = E.io(seg(t, a + .7, a + 1.0)), y = E.io(seg(t, a + .85, a + 1.15)); X1.setAttribute('stroke-dashoffset', 900 * (1 - x)); X2.setAttribute('stroke-dashoffset', 900 * (1 - y));
  reveal(tBCN, seg(t, a, a + .3)); reveal(tNO, seg(t, a + .7, a + 1.05));
  PIT.style.transform = `scale(${1 + .03 * seg(t, a, b)})`;
  const out = seg(t, b - .12, b); PIT.style.opacity = tBCN.style.opacity = tNO.style.opacity = 1 - out; }

// 3 · El documento (fuente) + sanción
const DOC = mk('div', 'position:absolute;left:90px;top:520px;width:900px;height:880px;background:#fbfaf6;border-radius:30px;box-shadow:0 40px 90px rgba(13,15,20,.18);display:none;overflow:hidden', '', $('cards'));
mk('div', 'position:absolute;left:60px;top:52px;font-family:M;font-weight:800;font-size:28px;letter-spacing:.14em;color:#8a877e', 'JOCS ESPORTIUS ESCOLARS DE BARCELONA', DOC);
mk('div', 'position:absolute;left:60px;top:96px;font-family:M;font-weight:700;font-size:28px;color:#8a877e', 'Reglament de minibàsquet 2023-24 · art. 4.4', DOC);
mk('div', 'position:absolute;left:60px;right:60px;top:150px;height:3px;background:#e4e0d4', '', DOC);
const QT = mk('div', 'position:absolute;left:60px;right:60px;top:190px;font-family:S;font-style:italic;font-size:76px;line-height:1.05;color:#0d0f14', '«No és permès realitzar cap tipus de defensa en zona.»', DOC);
const TR = mk('div', 'position:absolute;left:60px;right:60px;top:400px;font-family:M;font-weight:500;font-size:38px;line-height:1.25;color:#6d6a62', 'No se permite ningún tipo de defensa en zona.', DOC);
const SA = [['1.ª VEZ', 'aviso al entrenador'], ['SI SIGUE', '2 tiros libres + saque de banda']].map(([k, v], i) => { const r = mk('div', `position:absolute;left:60px;right:60px;top:${560 + i * 140}px;height:120px;border-top:2px solid #ece8de`, '', DOC);
  mk('div', 'position:absolute;left:0;top:30px;font-family:M;font-weight:800;font-size:30px;letter-spacing:.12em;color:#2f6bff', k, r);
  mk('div', 'position:absolute;left:230px;top:20px;font-family:M;font-weight:800;font-size:44px;letter-spacing:-.03em;color:#0d0f14', v, r); return r; });
const tES = tx(M('LO DICE EL REGLAMENTO'), 330, 'M7 ink', 46); tES.style.letterSpacing = '.12em';
function docu(t) { const a = T.doc, b = T.reto, v = t >= a && t < b; show(DOC, v); show(tES, v); if (!v) return; show($('paper'), true);
  const p = E.out5(seg(t, a, a + .45)); DOC.style.transform = `translateY(${(1 - p) * 700}px) rotate(${(1 - p) * 4}deg) scale(${1 + .025 * seg(t, a, b)})`;
  reveal(tES, seg(t, a, a + .3)); QT.style.opacity = E.out(seg(t, a + .25, a + .6)); TR.style.opacity = E.out(seg(t, a + .7, a + 1.0));
  SA.forEach((r, i) => { const q = E.out5(seg(t, T.pen + i * .55, T.pen + .3 + i * .55)); r.style.opacity = .1 + .9 * q; r.style.transform = `translateX(${(1 - q) * -24}px)`; });
  const out = seg(t, b - .12, b); DOC.style.opacity = tES.style.opacity = 1 - out; }

// 4 · Reto para el cuerpo técnico (sobre Laso)
const LAS = ph('laso', '50% 25%');
const tRK = tx(M('RETO PARA TU STAFF'), 400, 'kick shadow', 40);
const tR1 = tx(`${M('¿Cuántos de los tuyos')}<br>${M('defienden <span class="S blue" style="font-size:1.12em">solos</span>')}<br>${M('al que bota?')}`, 1060, 'M8 shadow', 104); tR1.style.lineHeight = '1.08';
const tR2 = tx(M('Envíaselo a tu segundo.'), 1480, 'M7 shadow', 50);
function reto(t) { const a = T.reto, b = T.cta, v = t >= a && t < b; show(LAS, v); show(tRK, v); show(tR1, v); show(tR2, v && t > a + 1.1); if (!v) return;
  place(LAS, 0, 0, 1080, 1920, { s: 1 + .05 * (1 - E.out5(seg(t, a, a + .4))), is: 1.08 + .05 * seg(t, a, b), dark: .58 });
  reveal(tRK, seg(t, a, a + .3)); reveal(tR1, seg(t, a + .1, a + .6)); reveal(tR2, seg(t, a + 1.1, a + 1.4));
  const out = seg(t, b - .12, b); [LAS, tRK, tR1, tR2].forEach(e => e.style.opacity = 1 - out); }

// 5 · Cierre de campaña corto
const tPT = tx(`<div class="kick" style="margin-bottom:6px">${M('LISTA DE ESPERA DE LA APP DE PROTEAM')}</div>`, 560, '', 34);
const tHE = tx(M('HASTA EL 27 NOV'), 760, 'M8', 120);
const t3M = tx(M('<span class="S blue">3 meses gratis.</span>'), 920, '', 170);
const tCM = tx(M('Comenta tu deporte, categoría y días.'), 1300, 'M5', 46); tCM.style.color = '#c9cfdb';
function cta(t) { const a = T.cta, v = t >= a; [tPT, tHE, t3M, tCM].forEach(e => show(e, v)); if (!v) return; show($('sysL'), true);
  reveal(tPT, seg(t, a, a + .3)); reveal(tHE, seg(t, a + .1, a + .45)); reveal(t3M, seg(t, a + .5, a + .9)); reveal(tCM, seg(t, a + .7, a + 1.0)); tHE.style.transform = `scale(${1 + .04 * seg(t, a, T.END)})`;
  t3M.style.transform = `scale(${1 + .05 * seg(t, a + .5, T.END)})`;
  const f = seg(t, T.END - .7, T.END); [tPT, tHE, t3M, tCM].forEach(e => e.style.opacity = 1 - f); }

window.frame = t => { show($('sysL'), false); show($('paper'), false); hook(t); court(t); docu(t); reto(t); cta(t);
  $('grain').style.transform = `translate(${(Math.floor(t * 24) * 37) % 200 - 100}px,${(Math.floor(t * 24) * 53) % 200 - 100}px)`; };
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))).then(() => setTimeout(() => { window.frame(0); window.ready = true; }, 300));
</script></body></html>
