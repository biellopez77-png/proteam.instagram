<!doctype html>
<html><head><meta charset="utf-8">
<!-- Láminas editoriales 2D de ProTeam (v4): carruseles 1080×1350 y Stories 1080×1920.
     Mismas páginas de revista que motor.html. Lee ?spec=ruta/laminas.resolved.json&i=N (N empieza en 0).
     Lo genera y renderiza tools/reel_v5/motor/lamina.py. Nada en 3D. -->
<style>
@font-face{font-family:J;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:J;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:S;src:url(../../fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:M;src:url(../../fonts/ibm-plex-mono-latin-400-normal.woff2)}
:root{--bg:#02050F;--card:#0C1323;--blue:#636DFF;--elec:#6AA8FF;--ice:#B9E0FF;--ink:#F4F7FB;--uv:#8B5CF6;--mut:#8f9bb8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;background:var(--bg);overflow:hidden;color:var(--ink);font-family:J}
.a{position:absolute}
#pg{position:absolute;left:0;top:0;width:1080px;overflow:hidden;background:var(--bg)}
.folio{position:absolute;left:64px;right:64px;top:58px;display:flex;justify-content:space-between;font:400 24px M;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;z-index:20}
.foot{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;gap:30px;font:400 18px M;letter-spacing:.08em;color:#6b769a;text-transform:uppercase;z-index:20}
.rule{position:absolute;left:64px;right:64px;height:2px;background:#1d2947}
.cap{font:400 26px M;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.6}
.serif{font-family:S;font-style:italic;font-weight:400;line-height:1.02}
.big{font-weight:800;letter-spacing:-.05em;word-spacing:.12em;line-height:.84;white-space:nowrap}
.ph{background-size:cover;background-position:center}
.lab{font:400 21px M;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-top:14px;line-height:1.5}
.uvline{position:absolute;height:12px;background:var(--uv);box-shadow:0 0 40px 6px rgba(139,92,246,.55)}
#grain{position:absolute;left:0;top:0;width:1080px;z-index:50;mix-blend-mode:screen;opacity:.14;image-rendering:pixelated}
#vig{position:absolute;inset:0;z-index:49;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(2,5,15,.7) 100%)}
.n{font:400 24px M;letter-spacing:.1em;color:var(--ice);text-transform:uppercase}
.item{display:flex;gap:28px;align-items:baseline;border-top:2px solid #1d2947;padding:26px 0}
.item .t{font:400 50px S;font-style:italic;line-height:1.1}
</style></head><body>
<div id="pg"><div class="folio"><span id="fl">ProTeam — Nº 00</span><span id="fp"></span></div>
<div class="foot"><span id="fc"></span><span id="fr">Entrenadores</span></div>
<div id="vig"></div><canvas id="grain"></canvas></div>
<script>
const $=id=>document.getElementById(id);
const H=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
// Cada tipo recibe la lámina p y el alto h (1350 carrusel, 1920 Story). Coordenadas en px de 1080 de ancho.
const T={
 // Portada: palabra gigante recortada que cruza la foto. {palabra, foto, fig, hora, serif, size, wordTop}
 palabra(p,h){const ft=h>1500?380:190,fh=h>1500?820:620,wt=p.wordTop||(ft+fh-150);
   return `<div class="a" style="inset:0">
   <div class="a cap" style="left:120px;top:${ft-56}px">${esc(p.fig)}</div>
   <div class="a ph" style="left:120px;top:${ft}px;width:840px;height:${fh}px;background-image:url(${p.foto})"></div>
   <div class="a big" style="left:${p.left??-40}px;top:${wt}px;font-size:${p.size||430}px">${esc(p.palabra)}</div>
   <div class="a cap" style="left:64px;top:${wt+(p.size||430)*.9+20}px;color:var(--ice)">${esc(p.hora)}</div>
   ${p.serif?`<div class="a serif" style="left:64px;right:64px;top:${wt+(p.size||430)*.9+80}px;font-size:${p.serifSize||84}px">${esc(p.serif)}</div>`:''}</div>`},
 // La foto dentro de las letras + frase serif. {palabra, foto, serif, cap, size}
 dentro(p,h){const top=p.top||(h>1500?640:380),sz=p.size||345;
   return `<div class="a" style="inset:0">
   <div class="a" style="inset:0;background:url(${p.foto}) center/cover;opacity:.09;filter:contrast(1.4)"></div>
   <div class="a big" style="left:${p.left??40}px;top:${top}px;font-size:${sz}px;background:url(${p.foto}) ${p.bgpos||'40% 55%'}/1500px auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(185,224,255,.55)">${esc(p.palabra)}</div>
   <div class="a serif" style="left:110px;top:${top+sz*.95}px;font-size:${p.serifSize||130}px">${esc(p.serif)}</div>
   <div class="a cap" style="left:110px;top:${top+sz*.95+(p.serifSize||130)*1.25}px;width:860px">${esc(p.cap)}</div></div>`},
 // Página de figuras: letras grandes + 3 fotos con pie. {letras, figs:[3×{foto,lab}]}
 figuras(p,h){const f=p.figs;const y0=h>1500?560:330;
   return `<div class="a" style="inset:0">
   <div class="a big" style="left:${p.left??-20}px;top:${y0-210}px;font-size:${p.size||250}px;color:#16203c">${esc(p.letras)}</div>
   <div class="a" style="left:64px;top:${y0}px;width:560px;height:${h>1500?760:560}px"><div class="ph" style="width:100%;height:100%;background-image:url(${f[0].foto})"></div><div class="lab">${esc(f[0].lab)}</div></div>
   <div class="a" style="left:656px;top:${y0}px;width:360px;height:${h>1500?360:260}px"><div class="ph" style="width:100%;height:100%;background-image:url(${f[1].foto})"></div><div class="lab">${esc(f[1].lab)}</div></div>
   <div class="a" style="left:656px;top:${y0+(h>1500?520:390)}px;width:360px;height:${h>1500?240:170}px"><div class="ph" style="width:100%;height:100%;background-image:url(${f[2].foto})"></div><div class="lab">${esc(f[2].lab)}</div></div></div>`},
 // Foto a sangre + frase serif; uv:true en UNA lámina por carrusel. {foto, pre, serif, uv, size, pos, uvTop, uvW}
 frase(p,h){const st=p.top||(h-(h>1500?720:560));
   return `<div class="a" style="inset:0">
   <div class="a ph" style="inset:0;background-size:${p.bgsize||'cover'};background-image:url(${p.foto});background-position:${p.pos||'50% 50%'}"></div>
   <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(2,5,15,.75) 0%,rgba(2,5,15,.25) 14%,rgba(2,5,15,.25) 22%,rgba(2,5,15,.94) 66%)"></div>
   <div class="a cap" style="left:64px;top:${st-52}px;color:var(--ice)">${esc(p.pre)}</div>
   <div class="a serif" style="left:64px;top:${st}px;font-size:${p.size||128}px;width:960px">${esc(p.serif)}</div>
   ${p.uv?`<div class="uvline" style="left:64px;top:${p.uvTop||st+(p.size||128)*2.1}px;width:${p.uvW||680}px"></div>`:''}</div>`},
 // Captura real de la app en un marco de móvil, sin duotono, con pie y frase. {foto (…_CAPTURA_…), fig, big, serif, size}
 captura(p,h){const y=h>1500?300:150,ph=h>1500?1100:820,pw=Math.round(ph*.49);
   return `<div class="a" style="inset:0">
   <div class="a cap" style="left:64px;top:${y}px">${esc(p.fig)}</div>
   <div class="a" style="left:64px;top:${y+60}px;width:${pw}px;height:${ph}px;border-radius:34px;overflow:hidden;border:2px solid #1d2947;box-shadow:0 0 90px rgba(99,109,255,.28);background:url(${p.foto}) top center/cover"></div>
   ${p.big?`<div class="a big" style="left:${64+pw+44}px;top:${y+80}px;font-size:${p.size||120}px">${esc(p.big)}</div>`:''}
   <div class="a serif" style="left:${64+pw+44}px;right:56px;top:${y+80+(p.big?(p.size||120)*(p.bigLines||1)*.86+40:0)}px;font-size:${p.serifSize||76}px">${esc(p.serif)}</div>
   ${p.nota?`<div class="a cap" style="left:${64+pw+44}px;right:56px;top:${y+ph-90}px;font-size:22px">${esc(p.nota)}</div>`:''}</div>`},
 // Titular a doble página con tres fotos. {l1, serif, l2, fotos:[3], cap, size}
 portada(p,h){const y=h>1500?380:200,s=p.size||176;
   return `<div class="a" style="inset:0"><div class="rule" style="top:${y-60}px"></div>
   <div class="a big" style="left:64px;top:${y+40}px;font-size:${s}px">${esc(p.l1)}</div>
   <div class="a serif" style="left:64px;top:${y+s*1.05}px;font-size:${s*1.02}px;color:var(--ice)">${esc(p.serif)}</div>
   <div class="a big" style="left:64px;top:${y+s*2.25}px;font-size:${s}px">${esc(p.l2)}</div>
   ${p.fotos.map((f,i)=>`<div class="a ph" style="left:${64+326*i}px;top:${y+s*3.2}px;width:300px;height:${h>1500?420:300}px;background-image:url(${f})"></div>`).join('')}
   <div class="rule" style="top:${y+s*3.2+(h>1500?460:330)}px"></div><div class="a cap" style="left:64px;top:${y+s*3.2+(h>1500?480:350)}px">${esc(p.cap)}</div></div>`},
 // Lo que se lleva el entrenador. {cap, serif, big, lista:[…], firma, size}
 final(p,h){const y=h>1500?360:190;
   return `<div class="a" style="inset:0">
   <div class="a cap" style="left:64px;top:${y}px;color:var(--ice)">${esc(p.cap)}</div>
   <div class="a serif" style="left:64px;top:${y+60}px;font-size:${p.serifSize||104}px">${esc(p.serif)}</div>
   <div class="a big" style="left:56px;top:${y+60+(p.serifSize||104)*1.3}px;font-size:${p.size||150}px">${esc(p.big)}</div>
   <div class="a" style="left:64px;right:64px;top:${y+60+(p.serifSize||104)*1.3+(p.size||150)*(p.bigLines||1)*.86+50}px">
     ${(p.lista||[]).map((t,i)=>`<div class="item"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${esc(t)}</span></div>`).join('')}
     <div style="border-top:2px solid #1d2947"></div></div>
   ${p.firma?`<div class="a" style="left:64px;bottom:120px;font:800 54px J;letter-spacing:-.04em">ProTeam <span class="serif" style="font-weight:400;font-size:46px;color:var(--ice);letter-spacing:0">${esc(p.firma)}</span></div>`:''}</div>`},
 // Story: pregunta escrita como titular. {foto, big, serif, cap, size}
 pregunta(p,h){return `<div class="a" style="inset:0">
   <div class="a ph" style="left:0;right:0;top:0;height:${h*.56}px;background-image:url(${p.foto});background-position:${p.pos||'50% 50%'}"></div>
   <div class="a" style="left:0;right:0;top:0;height:${h*.56}px;background:linear-gradient(180deg,rgba(2,5,15,.75) 0%,rgba(2,5,15,0) 25%,rgba(2,5,15,1) 100%)"></div>
   <div class="a cap" style="left:64px;top:${h*.5}px;color:var(--ice)">${esc(p.cap)}</div>
   <div class="a big" style="left:${p.left??52}px;top:${h*.5+70}px;font-size:${p.size||190}px">${esc(p.big)}</div>
   <div class="a serif" style="left:64px;right:64px;top:${h*.5+70+(p.size||190)*(p.bigLines||1)*.86+20}px;font-size:${p.serifSize||120}px">${esc(p.serif)}</div></div>`},
 // Story de encuesta: titular arriba y hueco limpio para pegar el sticker a mano. {pre, big, serif, foto, size}
 encuesta(p,h){return `<div class="a" style="inset:0">
   ${p.foto?`<div class="a ph" style="left:0;right:0;bottom:0;height:${h*.3}px;background-image:url(${p.foto});background-position:${p.pos||'50% 50%'}"></div><div class="a" style="left:0;right:0;bottom:0;height:${h*.3}px;background:linear-gradient(180deg,rgba(2,5,15,1) 0%,rgba(2,5,15,.25) 60%,rgba(2,5,15,.6) 100%)"></div>`:''}
   <div class="rule" style="top:250px"></div>
   <div class="a cap" style="left:64px;top:290px;color:var(--ice)">${esc(p.pre)}</div>
   <div class="a big" style="left:${p.left??52}px;top:360px;font-size:${p.size||170}px">${esc(p.big)}</div>
   <div class="a serif" style="left:64px;right:64px;top:${360+(p.size||170)*(p.bigLines||1)*.86+20}px;font-size:${p.serifSize||110}px">${esc(p.serif)}</div></div>`},
};
async function init(){
  const q=new URLSearchParams(location.search);const S=await (await fetch(q.get('spec'))).json();const i=+q.get('i')||0;
  const p=S.laminas[i],h=S.formato==='story'?1920:1350;
  document.body.style.height=h+'px';$('pg').style.height=h+'px';const c=$('grain');c.width=360;c.height=h/3;c.style.height=h+'px';
  $('pg').insertBefore(H(T[p.tipo](p,h)),$('pg').firstChild);
  $('fl').textContent='ProTeam — '+(S.numero||'Nº 00')+(p.folio?' · '+p.folio:'');$('fp').textContent=S.seccion||'';$('fc').textContent=p.credito||'';
  // grano de imprenta (fijo, semilla por lámina)
  const g=c.getContext('2d'),im=g.createImageData(c.width,c.height);let sd=7+i*7919;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let k=0;k<im.data.length;k+=4){const v=r()*255;im.data[k]=v*.8;im.data[k+1]=v*.85;im.data[k+2]=v;im.data[k+3]=255}g.putImageData(im,0,0);
  await document.fonts.ready;
  const urls=[...new Set([p.foto,...(p.fotos||[]),...((p.figs||[]).map(f=>f.foto))].filter(Boolean))];
  await Promise.all(urls.map(u=>new Promise(r=>{const m=new Image();m.onload=r;m.onerror=r;m.src=u})));
  window.ready=true;
}
init();
</script></body></html>
