<!doctype html>
<html><head><meta charset="utf-8">
<!-- Motor editorial 2D de ProTeam (v4). Lee ?spec=ruta/spec.resolved.json. Nada en 3D. -->
<style>
@font-face{font-family:J;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:J;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:S;src:url(../../fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:M;src:url(../../fonts/ibm-plex-mono-latin-400-normal.woff2)}
:root{--bg:#02050F;--card:#0C1323;--blue:#636DFF;--elec:#6AA8FF;--ice:#B9E0FF;--ink:#F4F7FB;--uv:#8B5CF6;--mut:#8f9bb8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;color:var(--ink);font-family:J}
.a{position:absolute}
#stage{position:absolute;inset:0;overflow:hidden}
.pg{position:absolute;inset:0;opacity:0;overflow:hidden}
.folio{position:absolute;left:64px;right:64px;top:70px;display:flex;justify-content:space-between;font:400 26px M;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;z-index:20}
.foot{position:absolute;left:64px;right:64px;bottom:64px;display:flex;justify-content:space-between;gap:30px;font:400 19px M;letter-spacing:.08em;color:#5d6888;text-transform:uppercase;z-index:20}
.rule{position:absolute;left:64px;right:64px;height:2px;background:#1d2947}
.cap{font:400 26px M;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);line-height:1.6}
.serif{font-family:S;font-style:italic;font-weight:400;line-height:1.02}
.big{font-weight:800;letter-spacing:-.05em;word-spacing:.12em;line-height:.84;white-space:nowrap}
.ph{background-size:cover;background-position:center}
.lab{font:400 22px M;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin-top:18px}
.shot{background:#F4F7FB;border-radius:28px;overflow:hidden;box-shadow:0 40px 120px rgba(99,109,255,.25)}
#grain{position:absolute;inset:0;width:1080px;height:1920px;z-index:50;mix-blend-mode:screen;opacity:.15;image-rendering:pixelated}
#vig{position:absolute;inset:0;z-index:49;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,5,15,.75) 100%)}
#turn{position:absolute;top:0;bottom:0;width:1300px;left:1200px;background:var(--card);z-index:30;box-shadow:-60px 0 80px rgba(0,0,0,.6)}
</style></head><body>
<div id="stage"><div id="turn"></div>
<div class="folio"><span id="fl">ProTeam — Nº 00</span><span id="fp"></span></div>
<div class="foot"><span id="fc"></span><span id="fr">Entrenadores</span></div></div>
<div id="vig"></div><canvas id="grain" width="360" height="640"></canvas>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, ramp=x=>x<.5?Math.pow(2*x,4)/2:1-Math.pow(2-2*x,4)/2;
const H=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
const g=$('grain').getContext('2d'),img=g.createImageData(360,640);let sd=1;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
function grain(t){sd=1+Math.floor(t*25)*7919;const d=img.data;for(let i=0;i<d.length;i+=4){const v=rnd()*255;d[i]=v*.8;d[i+1]=v*.85;d[i+2]=v;d[i+3]=255}g.putImageData(img,0,0)}
const tr=(el,s)=>el.style.transform=s, op=(el,v)=>el.style.opacity=v;

// ---- tipos de página ----
const T={
 // Palabra gigante que cruza la página con una foto detrás. {palabra, foto, fig, hora, top}
 palabra(p){const el=H(`<div class="pg">
   <div class="a ph" style="left:120px;top:560px;width:840px;height:560px;background-image:url(${p.foto})"></div>
   <div class="a cap" style="left:120px;top:500px;z-index:2">${esc(p.fig)}</div>
   <div class="a big" style="top:1010px;font-size:${p.size||430}px">${esc(p.palabra)}</div>
   <div class="a cap" style="left:64px;top:1420px;color:var(--ice)">${esc(p.hora)}</div></div>`);
   const [ph,,w,h]=el.children;
   // cruce (px, opcional): recorrido de la palabra; left (px, opcional): posición inicial. El destello es azul: el ultravioleta solo va en la frase.
   ph.style.transformOrigin='50% 0';
   return {el,f(u,d){const k=u/d;tr(ph,`translateY(${20*k}px) scale(${1+.05*k})`);w.style.left=((p.left??140)-(p.cruce??Math.max(420,w.offsetWidth-940))*eo(k))+'px';
     w.style.textShadow=(u>d*.62&&u<d*.62+.15)?'6px 0 0 rgba(185,224,255,.55),-6px 0 0 rgba(106,168,255,.6)':'none';op(h,P(u,.6,.9))}}},
 // Palabra con la foto dentro de las letras + frase serif. {palabra, foto, serif, cap}
 dentro(p){const el=H(`<div class="pg">
   <div class="a" style="inset:0;background:url(${p.foto}) center/cover;opacity:.08;filter:contrast(1.4)"></div>
   <div class="a big" style="left:40px;top:700px;font-size:${p.size||345}px;background:url(${p.foto}) 40% 55%/1500px auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(185,224,255,.55)">${esc(p.palabra)}</div>
   <div class="a serif" style="left:110px;top:1080px;font-size:120px">${esc(p.serif)}</div>
   <div class="a cap" style="left:110px;top:1300px;width:860px${p.capSize?`;font-size:${p.capSize}px;color:var(--ink);letter-spacing:.04em;line-height:1.4`:''}">${esc(p.cap)}</div></div>`);
   const [bg,w,s,c]=el.children;
   return {el,f(u,d){const k=u/d;tr(w,`scale(${1.18-.14*eo(k)})`);w.style.transformOrigin='30% 50%';w.style.backgroundPosition=`${30+20*k}% 55%`;
     op(s,P(u,.5,.9));tr(s,`translateY(${30*(1-eo(P(u,.5,1)))}px)`);op(c,P(u,.9,1.3));tr(bg,`translateY(${-80*k}px)`)}}},
 // Retícula de figuras que la cámara recorre con rampa y empuje final. {figs:[{foto,lab}], letras, labSize? (pie grande en tinta, admite \n)}
 reticula(p){const W=[620,900,1000],Hh=[860,660,680],X=[120,860,2120],Y=[520,700,880];
   let inner=p.figs.map((f,i)=>`<div class="a" style="left:${X[i]}px;top:${Y[i]}px;width:${W[i]}px;height:${Hh[i]}px"><div class="ph" style="width:100%;height:100%;background-image:url(${f.foto})"></div><div class="lab"${p.labSize?` style="font-size:${p.labSize}px;color:var(--ink);white-space:pre-line;line-height:1.35"`:''}>${esc(f.lab)}</div></div>`).join('');
   if(p.letras) inner+=`<div class="a big" style="left:1880px;top:560px;font-size:150px;color:#1a2440">${esc(p.letras)}</div>`;
   const el=H(`<div class="pg"><div class="a" style="left:0;top:0;width:3300px;height:1920px">${inner}</div></div>`);const row=el.children[0];
   return {el,f(u,d){const pan=ramp(P(u,.1,d-1.0)),push=eio(P(u,d-1.1,d));tr(row,`translateX(${-2120*pan}px)`);el.style.transformOrigin='62% 58%';
     tr(el,`scale(${1+1.4*push})`);el.style.filter=`blur(${6*Math.sin(Math.PI*P(u,d*.35,d*.55))+10*push}px)`}}},
 // Foto a sangre + frase serif; ultravioleta opcional (una vez por pieza). {foto, pre, serif, uv}
 frase(p){const el=H(`<div class="pg">
   <div class="a ph" style="inset:0;background-image:url(${p.foto});background-size:auto 1920px;background-position:${p.pos||'50% 50%'}"></div>
   <div class="a" style="inset:0;background:linear-gradient(180deg,rgba(2,5,15,.7) 0,rgba(2,5,15,.2) 12%,rgba(2,5,15,.2) 25%,rgba(2,5,15,.93) 68%)"></div>
   <div class="a cap" style="left:64px;top:${p.preSize?1190-p.preSize*1.3:1150}px;color:var(--ice)${p.preSize?`;font-size:${p.preSize}px;letter-spacing:.06em`:''}">${esc(p.pre)}</div>
   <div class="a serif" style="left:64px;top:1200px;font-size:${p.size||128}px;width:960px">${esc(p.serif)}</div>
   <div class="a" style="left:64px;top:${p.uvTop||1490}px;height:12px;width:0;background:var(--uv);box-shadow:0 0 40px 6px rgba(139,92,246,.55)"></div></div>`);
   const [ph,,pre,s,uv]=el.children;
   return {el,f(u,d){tr(ph,`scale(${1.15-.08*u/d})`);ph.style.filter=`blur(${10*(1-eo(P(u,0,.9)))}px)`;op(pre,P(u,.5,.8));
     op(s,P(u,.7,1.2));tr(s,`translateY(${40*(1-eo(P(u,.7,1.3)))}px)`);uv.style.width=p.uv?(Math.min(680,p.uvW||680)*eio(P(u,1.4,2.1)))+'px':0}}},
 // Doble página de titular con tres fotos. {l1, serif, l2, fotos:[3], cap}
 portada(p){const el=H(`<div class="pg"><div class="rule" style="top:300px"></div>
   <div class="a big" style="left:64px;top:420px;font-size:${p.size||176}px">${esc(p.l1)}</div>
   <div class="a serif" style="left:64px;top:610px;font-size:180px;color:var(--ice)">${esc(p.serif)}</div>
   <div class="a big" style="left:64px;top:820px;font-size:${p.size||176}px">${esc(p.l2)}</div>
   ${p.fotos.map((f,i)=>`<div class="a ph" style="left:${64+326*i}px;top:1180px;width:300px;height:380px;background-image:url(${f})"></div>`).join('')}
   <div class="rule" style="top:1620px"></div><div class="a cap" style="left:64px;top:1650px">${esc(p.cap)}</div></div>`);
   const c=[...el.children];
   return {el,f(u,d){tr(el,`scale(${1.5-.5*eo(P(u,0,1.6))})`);el.style.transformOrigin='30% 30%';
     [1,2,3].forEach((j,i)=>{const q=eo(P(u,.1+i*.18,.7+i*.18));op(c[j],q);tr(c[j],`translateX(${(1-q)*-60}px)`)});
     [4,5,6].forEach((j,i)=>{const q=eo(P(u,.7+i*.15,1.3+i*.15));op(c[j],q);tr(c[j],`translateY(${(1-q)*50}px)`)})}}},
 // Cifra o fecha enorme (solo datos reales). {num, serif, cap}
 cifra(p){const el=H(`<div class="pg"><div class="rule" style="top:520px"></div>
   <div class="a cap" style="left:64px;top:560px">${esc(p.pre)}</div>
   <div class="a big" style="left:40px;top:700px;font-size:${p.size||400}px;color:var(--ink)">${esc(p.num)}</div>
   <div class="a serif" style="left:64px;top:1100px;font-size:110px;color:var(--ice);width:950px">${esc(p.serif)}</div>
   <div class="a cap" style="left:64px;top:1380px;width:900px">${esc(p.cap)}</div></div>`);
   const c=[...el.children];
   return {el,f(u,d){const q=eo(P(u,0,.8));tr(c[2],`translateY(${(1-q)*120}px)`);op(c[2],q);c[2].style.letterSpacing=(-.05-.04*(1-q))+'em';
     op(c[3],P(u,.6,1));op(c[4],P(u,1,1.4));op(c[1],P(u,.2,.5))}}},
 // Captura real de la app como figura de revista. {foto, fig, serif}
 captura(p){const el=H(`<div class="pg">
   <div class="a cap" style="left:64px;top:300px">${esc(p.fig)}</div>
   <div class="a shot" style="left:290px;top:360px;width:500px;height:1050px"><div class="ph" style="width:100%;height:100%;background-image:url(${p.foto});background-position:top center"></div></div>
   <div class="a serif" style="left:64px;top:1460px;font-size:${p.size||84}px;width:950px">${esc(p.serif)}</div></div>`);
   const c=[...el.children];
   return {el,f(u,d){const q=eo(P(u,0,.9));tr(c[1],`translateY(${(1-q)*160}px) rotate(${(1-q)*-4}deg)`);op(c[1],q);
     c[1].children[0].style.backgroundPosition=`center ${100*eio(P(u,1.2,d-.3))}%`;op(c[2],P(u,.8,1.2));op(c[0],P(u,.3,.6))}}},
 // Cierre: marca. {serif}
 cierre(p){const el=H(`<div class="pg">
   <div class="a" style="left:0;right:0;top:820px;text-align:center;font:800 140px J;letter-spacing:-.05em">ProTeam</div>
   <div class="a serif" style="left:0;right:0;top:1000px;text-align:center;font-size:70px;color:var(--ice)">${esc(p.serif)}</div>
   <div class="a" style="left:540px;top:1120px;height:4px;width:0;background:var(--blue)"></div></div>`);
   const [w,s,l]=el.children;
   return {el,f(u,d){op(w,P(u,.2,.6));op(s,P(u,.6,1));const q=eo(P(u,.8,1.3));l.style.width=200*q+'px';l.style.left=(540-100*q)+'px'}}}
};

let S,pages=[],total=0;
async function init(){
  const q=new URLSearchParams(location.search);S=await (await fetch(q.get('spec'))).json();
  $('fl').textContent='ProTeam — '+(S.numero||'Nº 00');
  let t=0;for(const p of S.paginas){const b=T[p.tipo](p);b.p=p;b.t0=t;b.d=p.d;t+=p.d;pages.push(b);$('stage').insertBefore(b.el,$('turn'))}
  total=t;window.duracion=t;
  await document.fonts.ready;
  const urls=[...new Set(S.paginas.flatMap(p=>[p.foto,...(p.fotos||[]),...((p.figs||[]).map(f=>f.foto))]).filter(Boolean))];
  await Promise.all(urls.map(u=>new Promise(r=>{const i=new Image();i.onload=r;i.onerror=r;i.src=u})));
  frame(0);window.ready=true;
}
window.frame=function(t){
  grain(t);
  let cur=null;
  for(const b of pages){const u=t-b.t0;const vis=u>=-.001&&u<=b.d+.25;
    if(!vis){op(b.el,0);continue}
    const fin=b===pages[0]?1:P(u,0,.22),fout=b===pages[pages.length-1]?1:1-P(u,b.d,b.d+.25);
    op(b.el,Math.min(fin,fout));b.f(Math.min(u,b.d),b.d);if(u<=b.d)cur=b}
  // paso de página antes del cierre
  const last=pages[pages.length-1];let tu=0;
  if(last.p.tipo==='cierre'){tu=eio(P(t,last.t0-.55,last.t0+.2))}
  $('turn').style.left=(1200-2600*tu)+'px';
  const end=last.p.tipo==='cierre'&&t>=last.t0-.4;
  if(cur){$('fp').textContent=cur.p.folio||'';$('fc').textContent=cur.p.credito||''}
  op(document.querySelector('.folio'),end?0:1);op(document.querySelector('.foot'),end?0:1);
};
init();
</script></body></html>
