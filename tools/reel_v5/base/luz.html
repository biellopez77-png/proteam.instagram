<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PJS;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:PJS;src:url(../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-500-normal.woff2) format('woff2');font-weight:500}
html,body{margin:0;background:#02050F;overflow:hidden}canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
/* Piloto v4 · Territorio 8 «La luz que se queda encendida».
   Plantilla base: window.frame(t) deja la escena en el instante t (determinista) y renderiza. */
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const W=1080,H=1920, C={bg:0x02050F,s1:0x060C19,s2:0x0C1323,blue:0x636DFF,elec:0x6AA8FF,ice:0xB9E0FF,uv:0x8B5CF6};
await document.fonts.load('800 80px PJS'); await document.fonts.load('500 40px PJS');
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setSize(W,H); R.setPixelRatio(1);
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap; R.toneMapping=THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
const S=new THREE.Scene(); S.background=new THREE.Color(C.bg); S.fog=new THREE.FogExp2(C.bg,0.06);
const cam=new THREE.PerspectiveCamera(38,W/H,0.1,60);

const std=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
// sala: suelo de pabellón y pared
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),std(0x0a1120,.55)); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; S.add(floor);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(30,14),std(C.s2,.95)); wall.position.set(0,7,-3); wall.receiveShadow=true; S.add(wall);
// pizarra con textura de lienzo (dos estados: borrada / escrita)
const bc=document.createElement('canvas'); bc.width=1400; bc.height=900; const bx=bc.getContext('2d');
function board(state,uv){ // state 0 = táctica borrada a medias, 1 = la semana escrita; uv 0..1 = círculo ultravioleta
  bx.fillStyle='#0b1a17'; bx.fillRect(0,0,1400,900);
  bx.strokeStyle='rgba(244,247,251,.08)'; bx.lineWidth=60; for(let i=0;i<7;i++){bx.beginPath();bx.moveTo(80+i*170,120);bx.bezierCurveTo(300+i*90,500,100+i*150,620,260+i*160,820);bx.stroke()}
  bx.fillStyle='rgba(244,247,251,.9)'; bx.strokeStyle='rgba(244,247,251,.85)'; bx.lineWidth=7; bx.lineCap='round';
  if(state===0){ bx.font='800 70px PJS'; bx.globalAlpha=.35; bx.fillText('¿?',620,470); bx.globalAlpha=.55;
    for(const [x,y] of [[300,300],[520,610],[980,350]]){bx.beginPath();bx.arc(x,y,26,0,7);bx.stroke()}
    bx.beginPath();bx.moveTo(330,320);bx.lineTo(500,590);bx.stroke(); bx.globalAlpha=1; }
  else { bx.font='800 64px PJS'; bx.fillText('MARTES',110,170); bx.font='500 50px PJS';
    bx.fillText('salida en 3 · 20′',110,270); bx.fillText('el 7: 30 min, no más',110,360); bx.fillText('jueves: lo duro',110,450);
    bx.font='800 64px PJS'; bx.fillText('SÁBADO 11:00',110,640);
    if(uv>0){ bx.strokeStyle='#8B5CF6'; bx.lineWidth=11; bx.beginPath(); bx.ellipse(470,345,330,62,-.03,-Math.PI*.5,-Math.PI*.5+uv*Math.PI*2.05); bx.stroke(); } }
  btex.needsUpdate=true; }
const btex=new THREE.CanvasTexture(bc); btex.colorSpace=THREE.SRGBColorSpace;
const bmat=new THREE.MeshStandardMaterial({map:btex,roughness:.9}); const brd=new THREE.Mesh(new THREE.PlaneGeometry(3.6,2.3),bmat); brd.position.set(0,2.6,-2.95); S.add(brd);
const frame=new THREE.Mesh(new THREE.BoxGeometry(3.8,2.5,.06),std(0x1a2233,.5,.6)); frame.position.set(0,2.6,-2.99); S.add(frame);
// fluorescente encima de la pizarra
const tube=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.6,12),new THREE.MeshStandardMaterial({color:0x111111,emissive:0xeaf2ff,emissiveIntensity:0}));
tube.rotation.z=Math.PI/2; tube.position.set(0,4.15,-2.6); S.add(tube);
// banquillo, peto y móvil boca arriba
const bench=new THREE.Mesh(new THREE.BoxGeometry(2.6,.12,.55),std(0x2a2f3a,.6,.2)); bench.position.set(-.6,.55,.4); bench.castShadow=bench.receiveShadow=true; S.add(bench);
for(const x of [-1.7,.5]){const l=new THREE.Mesh(new THREE.BoxGeometry(.08,.55,.45),std(0x1a1f29,.5,.5)); l.position.set(x,.27,.4); l.castShadow=true; S.add(l)}
const peto=new THREE.Mesh(new THREE.BoxGeometry(.7,.03,.55),std(0x2f4fb8,.95)); peto.position.set(-1.1,.63,.42); peto.rotation.y=.25; peto.castShadow=true; S.add(peto);
const phone=new THREE.Mesh(new THREE.BoxGeometry(.18,.02,.36),std(0x05070c,.3,.5)); phone.position.set(.05,.62,.5); phone.rotation.y=-.3; S.add(phone);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(.16,.33),new THREE.MeshStandardMaterial({color:0,emissive:C.elec,emissiveIntensity:0})); scr.rotation.x=-Math.PI/2; scr.position.set(0,0.011,0); phone.add(scr);
// luces
const L1=new THREE.SpotLight(0xeaf2ff,0,14,.75,.6,1.2); L1.position.set(0,4.1,-1.6); L1.target=brd; L1.castShadow=true; S.add(L1);
const L2=new THREE.SpotLight(0xffd9a8,0,10,.42,.55,1.4); L2.position.set(-1.2,5.2,2.2); L2.target=bench; L2.castShadow=true; S.add(L2);
const L3=new THREE.PointLight(C.elec,0,3,1.6); L3.position.set(.05,.85,.5); S.add(L3);
const LB=new THREE.SpotLight(C.blue,0,16,.55,.7,1); LB.position.set(1.5,5.5,1.5); LB.target=brd; LB.castShadow=true; S.add(LB);
S.add(new THREE.AmbientLight(0x1b2440,.06));
// polvo en suspensión (determinista)
let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const N=900, pg=new THREE.BufferGeometry(), pp=new Float32Array(N*3), p0=[]; for(let i=0;i<N;i++){p0.push([rnd()*6-3,rnd()*4.5,rnd()*4-2.8,rnd()*6.28])}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:C.ice,size:.012,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending})); S.add(dust);
// postproceso: bloom (halos en las fuentes) + grano de película
const comp=new EffectComposer(R); comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.9,.5,.93); comp.addPass(bloom);
const grain=new ShaderPass({uniforms:{tDiffuse:{value:null},t:{value:0},amt:{value:.055},vig:{value:.9}},
 vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform sampler2D tDiffuse;uniform float t,amt,vig;varying vec2 v;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+t*61.7)*43758.5453);}void main(){vec4 c=texture2D(tDiffuse,v);float n=h(v*vec2(1080.,1920.))-.5;c.rgb+=n*amt;float d=distance(v,vec2(.5,.48));c.rgb*=mix(1.,smoothstep(.95,.25,d),vig);gl_FragColor=c;}'});
comp.addPass(grain); comp.addPass(new OutputPass());

// línea de tiempo (s)
const T={l1:.6,l2:3.1,l3:5.0,off:7.0,blue:8.4,uv:9.9,end:12.5};
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const flick=(t,t0)=>{const d=t-t0; if(d<0)return 0; if(d>.5)return 1; return [1,0,1,0,0,1,1,0,1][Math.floor(d*18)%9]?1:.05};
let lastState=-1,lastUv=-1;
window.frame=t=>{
  const off=t>=T.off&&t<T.blue; // apagón
  L1.intensity=off?0:flick(t,T.l1)*38*(t>T.blue?.15:1); tube.material.emissiveIntensity=L1.intensity/12;
  L2.intensity=off?0:flick(t,T.l2)*220*(t>T.blue?0:1);
  L3.intensity=off?0:ease((t-T.l3)/.4)*1.6*(t>T.blue?0:1); scr.material.emissiveIntensity=L3.intensity*.5;
  LB.intensity=ease((t-T.blue)/.35)*90;
  const st=t>=T.blue?1:0, uv=Math.round(ease((t-T.uv)/1.1)*40)/40;
  if(st!==lastState||uv!==lastUv){board(st,st?uv:0);lastState=st;lastUv=uv}
  // cámara: entra despacio hacia la pizarra; en el apagón se queda quieta; con la luz azul, pequeño acercamiento
  const k=ease(t/T.off), kb=ease((t-T.blue)/(T.end-T.blue));
  cam.position.set(1.4-1.0*k-.4*kb, 1.5+.2*k+.5*kb, 6.6-1.2*k-.9*kb); cam.lookAt(-.3*(1-kb), 1.5+.5*k+.6*kb, -2.4);
  // foco: al principio blando; el polvo solo se ve con luz
  bloom.strength=.6+(t>T.blue?.3:0);
  for(let i=0;i<N;i++){const q=p0[i];pp[i*3]=q[0]+Math.sin(t*.25+q[3])*.12;pp[i*3+1]=q[1]+Math.sin(t*.18+q[3]*2)*.1;pp[i*3+2]=q[2]}
  pg.attributes.position.needsUpdate=true; dust.material.opacity=off?0:Math.min(1,(L1.intensity+L2.intensity+LB.intensity)/60)*.8;
  grain.uniforms.t.value=Math.floor(t*30)/30;
  comp.render();
};
window.frame(0); window.ready=true;
</script></body></html>
