<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1x{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1x .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:60px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:96px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}
#fld .ph2{color:#5d6475}
#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
#web{z-index:5}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
.ph.clip{border:14px solid #fbfaf6;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ink{color:#0d0f14!important;text-shadow:none!important}
.strike{position:absolute;left:-4%;right:-4%;top:52%;height:16px;background:#2f6bff;transform-origin:0 50%;border-radius:3px}
.vb .node{background:#fbfaf6;border-color:#d6d2c6;color:#0d0f14}
.vb .node div{background:#e4e0d4!important}

.mk{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#2f6bff;border:5px solid #dfe7ff;display:none;box-shadow:0 8px 22px rgba(47,107,255,.45)}
.att{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#f2f1ec;display:none;box-shadow:0 0 0 10px rgba(242,241,236,.15),0 0 30px rgba(242,241,236,.5)}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">10</b><span>DÍAS</span></div><div><b id="cd2">12</b><span>HORAS</span></div><div><b id="cd3">29</b><span>MIN</span></div><div><b id="cd4">59</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>

  
  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel09/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel09/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, x, y, w, h, o = {}) {
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = `translate(${o.dx || 0}px,${o.dy || 0}px) rotate(${o.rot || 0}deg) scale(${o.s || 1})`;
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1; el.style.filter = o.blur ? `blur(${o.blur}px)` : 'none';
  if (el._img) el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  if (el._sh) el._sh.style.background = `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) {
  const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d;
}
function reveal(el, p, dir = 'up') {
  el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i));
    s.style.transform = dir === 'up' ? `translateY(${(1 - q) * 110}%)` : `translateX(${(q - 1) * 105}%)`; });
}
const M = s => `<span class="mask"><span>${s}</span></span>`;

// ── 1 · GANCHO: Dujshebaev en el banquillo + «SUS 12 MINUTOS.» desde el fotograma 0; «Siempre los últimos.» con el golpe ──
const DUJ = ph('dujshebaev', '50% 22%');
const tH1 = tx(M('SUS 12'), 930, 'M8 shadow', 250);
const tH2 = tx(M('MINUTOS.'), 1180, 'M8 shadow', 130);
const tUL = tx(M('<span class="S" style="color:#9db8ff">Siempre los</span>') + ' ' + M('<span class="S" id="uw" style="display:inline-block;color:#fff">últimos.</span>'), 1345, 'shadow', 112);
const tNOR = mk('div', 'position:absolute;left:0;width:1080px;top:1530px;text-align:center;font-family:M;font-weight:500;font-size:32px;color:#d5d9e3;display:none;text-shadow:0 2px 12px rgba(0,0,0,.8)', 'Infantil · Juegos Escolares de Euskadi: mín. 12 min por jugador del acta');
function hook(t) {
  const b = T.cuando - .06, v = t < b; show(DUJ, v); show(tH1, v); show(tH2, v); show(tNOR, v); show(tUL, v && t >= T.sie - .08); if (!v) return;
  const p = E.out5(seg(t, 0, .45)), hit = Math.exp(-Math.pow((t - T.ult - .06) / .12, 2));
  place(DUJ, 0, 0, 1080, 1920, { s: 1 + (1 - p) * .06 + .03 * hit, is: 1.12 - .05 * seg(t, 0, b), iy: 12 * seg(t, 0, b), dark: .38 + .12 * seg(t, T.sie - .2, T.sie + .2), z: 1 });
  reveal(tH1, 1); reveal(tH2, 1); reveal(tUL, seg(t, T.sie - .08, T.sie + .3)); tNOR.style.opacity = .9;
  tH1.style.transform = `scale(${1 + .05 * (1 - p)})`; tUL.style.transform = `scale(${1 + .08 * hit})`;
  const out = seg(t, b - .1, b); [DUJ, tH1, tH2, tUL, tNOR].forEach(e => e.style.opacity = (e === tNOR ? .9 : 1) * (1 - out));
}

// ── Barra del partido (dos partes) + marcador + ficha del dorsal 9 ──
const BAR = mk('div', 'position:absolute;left:90px;top:980px;width:900px;height:120px;display:none', '', $('cards'));
const H1 = mk('div', 'position:absolute;left:0;top:0;width:444px;height:120px;border-radius:18px;background:#151922;border:3px solid #232937;overflow:hidden', '<div class="fill" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#1b2b55"></div><span style="position:absolute;left:26px;top:38px;font-family:M;font-weight:800;font-size:34px;letter-spacing:.1em;color:#8a93a6">1.ª PARTE</span>', BAR);
const H2 = mk('div', 'position:absolute;left:456px;top:0;width:444px;height:120px;border-radius:18px;background:#151922;border:3px solid #232937;overflow:hidden', '<div class="fill" style="position:absolute;left:0;top:0;bottom:0;width:0;background:#1b2b55"></div><span style="position:absolute;left:26px;top:38px;font-family:M;font-weight:800;font-size:34px;letter-spacing:.1em;color:#8a93a6">2.ª PARTE</span>', BAR);
const DESC = mk('div', 'position:absolute;left:443px;top:-40px;width:14px;height:200px;display:none', '<div style="position:absolute;left:5px;top:0;bottom:0;width:4px;background:#f2f1ec;border-radius:2px"></div>', BAR);
const DESCL = mk('div', 'position:absolute;left:300px;top:-90px;width:300px;text-align:center;font-family:M;font-weight:800;font-size:28px;letter-spacing:.14em;color:#f2f1ec;display:none', 'DESCANSO', BAR);
const SC = mk('div', 'position:absolute;left:0;width:1080px;top:600px;text-align:center;font-family:M;font-weight:800;font-size:260px;letter-spacing:-.05em;color:#f2f1ec;display:none;font-variant-numeric:tabular-nums', '0–0', $('cards'));
const SCX = mk('div', 'position:absolute;left:0;width:1080px;top:890px;text-align:center;font-family:M;font-weight:700;font-size:26px;letter-spacing:.2em;color:#5d6475;display:none', 'MARCADOR DE EJEMPLO', $('cards'));
const CHIP = mk('div', 'position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:28px;background:#2f6bff;border:5px solid #dfe7ff;display:none;font-family:M;font-weight:800;color:#fff;text-align:center;box-shadow:0 14px 36px rgba(47,107,255,.45)', '<div style="font-size:78px;line-height:1;margin-top:22px">9</div><div style="font-size:24px;letter-spacing:.06em;margin-top:6px">12′</div>', $('cards'));
const BENCH = mk('div', 'position:absolute;left:90px;top:1300px;width:900px;font-family:M;font-weight:800;font-size:28px;letter-spacing:.16em;color:#5d6475;display:none', 'BANQUILLO', $('cards'));
function chipAt(x, y, grey, s = 1, op = 1) { show(CHIP, op > 0); CHIP.style.left = x + 'px'; CHIP.style.top = y + 'px'; CHIP.style.opacity = op;
  CHIP.style.transform = `scale(${s})`; CHIP.style.background = grey ? '#3a4256' : '#2f6bff'; CHIP.style.borderColor = grey ? '#5d6475' : '#dfe7ff'; CHIP.style.boxShadow = grey ? 'none' : ''; }
function fills(a, b, hot) { H1.querySelector('.fill').style.width = (100 * a) + '%'; H2.querySelector('.fill').style.width = (100 * b) + '%';
  [H1, H2].forEach((h, i) => { const on = hot === i; h.style.borderColor = on ? '#2f6bff' : '#232937'; }); }
const score = (a, b) => `${a}–${b}`;

// ── 2 · PARTIDO DECIDIDO: la barra se llena, el marcador se rompe (24–11) y el 9 entra en el último tramo ──
const tDE = tx(M('YA ESTÁ DECIDIDO.'), 300, 'M8', 96);
const tNP = tx(M('<span class="S blue">No pesa nada.</span>'), 410, '', 110);
function decided(t) {
  const a = T.cuando - .06, b = T.cum - .06, v = t >= a && t < b; show(BAR, v); show(SC, v); show(SCX, v); show(BENCH, v); show(tDE, v && t >= T.decid - .15); show(tNP, v && t >= T.nada - .3); if (!v) { show(CHIP, false); return; }
  show($('sysL'), true);
  const p = E.out5(seg(t, a, a + .35)); BAR.style.opacity = p; BAR.style.transform = `translateY(${(1 - p) * 60}px)`;
  const run = E.io(seg(t, a + .1, T.nada - .1));            // el partido corre
  fills(clamp(run * 2), clamp(run * 2 - 1), null);
  const sa = Math.round(24 * run), sb = Math.round(11 * run); SC.textContent = score(sa, sb); SC.style.opacity = SCX.style.opacity = p;
  SC.style.color = run > .85 ? '#8a93a6' : '#f2f1ec';
  const ent = E.out5(seg(t, T.nada - .25, T.nada + .25));    // entra al final
  chipAt(lerp(190, 900, ent), lerp(1410, 1040, ent), false, 1 - .3 * ent, p);
  reveal(tDE, seg(t, T.decid - .15, T.decid + .2)); reveal(tNP, seg(t, T.nada - .3, T.nada + .05));
  const out = seg(t, b - .1, b); [BAR, SC, SCX, tDE, tNP, BENCH].forEach(e => e.style.opacity = 1 - out); CHIP.style.opacity = 1 - out;
}

// ── 3 · CONSECUENCIA: España (JJ. OO. Londres 2012) + «Cumples la norma. Él aprende que sus minutos no cuentan.» ──
const ESP = ph('espana', '40% 50%');
const tCU = tx(M('CUMPLES LA NORMA.') + `<span id="ck" style="display:inline-block;width:92px;height:92px;margin-left:24px;vertical-align:-14px"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="#2f6bff"/><path id="ckp" d="M28 47l12 12 24-26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/></svg></span>`, 420, 'M8 shadow', 84);
const tAP = tx(M('Él aprende que') , 1080, 'M8 shadow', 92);
const tAP2 = tx(M('<span class="S" style="color:#f2f1ec">sus minutos</span>') + ' ' + M('<span class="S blue" style="position:relative;display:inline-block">no cuentan.<span class="uline" id="ul2" style="bottom:-2px;height:8px"></span></span>'), 1200, 'shadow', 120);
const SRC2 = mk('div', 'position:absolute;left:0;width:1080px;top:1610px;text-align:center;font-family:M;font-weight:500;font-size:28px;color:#aab2c3;display:none', 'España · Juegos Olímpicos de Londres 2012');
function lesson(t) {
  const a = T.cum - .06, b = T.este - .06, v = t >= a && t < b; show(ESP, v); show(tCU, v); show(SRC2, v); show(tAP, v && t >= T.el - .1); show(tAP2, v && t >= T.apr + .1); if (!v) return;
  place(ESP, 0, 0, 1080, 1920, { s: 1 + .04 * (1 - E.out5(seg(t, a, a + .4))), is: 1.9 + .08 * seg(t, a, b), ix: -60 + 40 * seg(t, a, b), dark: .5 + .15 * seg(t, T.el - .2, T.el + .2), z: 1 });
  reveal(tCU, seg(t, a, a + .35)); $('ck').style.opacity = E.out(seg(t, a + .2, a + .45)); $('ckp').setAttribute('stroke-dashoffset', 60 * (1 - E.out(seg(t, T.norma - .05, T.norma + .3))));
  reveal(tAP, seg(t, T.el - .1, T.el + .2)); reveal(tAP2, seg(t, T.apr + .1, T.apr + .45)); SRC2.style.opacity = .85;
  $('ul2').style.transform = `scaleX(${E.out(seg(t, T.cuen, T.cuen + .35))})`;
  tCU.style.opacity = 1 - .55 * seg(t, T.el - .1, T.el + .2);
  const out = seg(t, b - .1, b); [ESP, tAP, tAP2, SRC2].forEach(e => e.style.opacity = 1 - out); tCU.style.opacity *= 1 - out;
}

// ── 4 · ESTE SÁBADO: ficha guardable en papel; la barra rebobina y el 9 entra antes del descanso con 8–8 ──
const FI = mk('div', 'position:absolute;left:70px;top:360px;width:940px;height:1230px;background:#fbfaf6;border-radius:34px;box-shadow:0 40px 90px rgba(0,0,0,.45);display:none;overflow:hidden', '', $('cards'));
mk('div', 'position:absolute;left:60px;top:54px;font-family:M;font-weight:800;font-size:34px;letter-spacing:.14em;color:#8a877e', 'ESTE SÁBADO', FI);
mk('div', 'position:absolute;right:60px;top:46px;padding:8px 20px;border-radius:999px;background:#2f6bff;font-family:M;font-weight:800;font-size:26px;letter-spacing:.08em;color:#fff', 'GUÁRDALO', FI);
mk('div', 'position:absolute;left:60px;right:60px;top:122px;height:3px;background:#e4e0d4', '', FI);
const FSC = mk('div', 'position:absolute;left:0;right:0;top:160px;text-align:center;font-family:M;font-weight:800;font-size:150px;letter-spacing:-.05em;color:#0d0f14;font-variant-numeric:tabular-nums', '8–8', FI);
