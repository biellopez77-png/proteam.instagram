<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}

.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1x{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1x .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:60px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:96px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}
#fld .ph2{color:#5d6475}
#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
#web{z-index:5}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
.ph.clip{border:14px solid #fbfaf6;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ink{color:#0d0f14!important;text-shadow:none!important}
.strike{position:absolute;left:-4%;right:-4%;top:52%;height:16px;background:#2f6bff;transform-origin:0 50%;border-radius:3px}
.vb .node{background:#fbfaf6;border-color:#d6d2c6;color:#0d0f14}
.vb .node div{background:#e4e0d4!important}

.mk{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#2f6bff;border:5px solid #dfe7ff;display:none;box-shadow:0 8px 22px rgba(47,107,255,.45)}
.att{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#f2f1ec;display:none;box-shadow:0 0 0 10px rgba(242,241,236,.15),0 0 30px rgba(242,241,236,.5)}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">08</b><span>DÍAS</span></div><div><b id="cd2">10</b><span>HORAS</span></div><div><b id="cd3">29</b><span>MIN</span></div><div><b id="cd4">59</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel68/times.js"></script>
<script>

const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel68/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, o = {}) {
  el.style.left = '0px'; el.style.top = '0px'; el.style.width = '1080px'; el.style.height = '1920px';
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1;
  el._img.style.transformOrigin = o.org || '50% 50%';
  el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  el._sh.style.background = o.grad || `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) { const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d; }
function reveal(el, p) { el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i)); s.style.transform = `translateY(${(1 - q) * 110}%)`; }); }
const M = s => `<span class="mask"><span>${s}</span></span>`;

// u68 · CONTEXTO · «Cuatro sitios» · concepto: «cuatro fichas en la mesa» — libreta, pizarra, hoja de cálculo y chat dibujados como
// fichas sobre papel, una por palabra (sin IA y sin logotipos, Biel 18/11); se juntan en un 2×2 («4 SITIOS · 1 equipo»), se iluminan
// con apuntar/buscar/avisar y se caen al suelo en «se perdiera» (SE PIERDE en rojo). Banquillos vacíos del Bernabéu y del Camp Nou para
// «nosotros también» y «para todos». En «decidimos crearlo» las cuatro fichas vuelan a un solo punto → «ProTeam.»; tres planos cortos de
// la app real (Semana, Convocatoria y la lista por jugador, rotulada «cada jugador», nunca «ficha»); «6 MESES»; «28 NOV»; cierre con la
// lista de espera y el contador real; final en bucle con las cuatro fichas del primer plano. Arriba, desde el fotograma 0: «LISTA: SE CIERRA EL 27».
const pulse = (t, t0, a = .06) => 1 + a * Math.exp(-Math.pow((t - t0 - .12) / .14, 2));
const RED = '#e5484d';
const RM = ph('rm', '50% 50%');
const CN = ph('cn', '50% 50%');
const CNB = ph('cn', '50% 50%'); CNB._img.style.filter = 'blur(26px) brightness(.32) saturate(.7)';

// ── las cuatro fichas (dibujadas, genéricas) ──
const INK = '#0d0f14';
const SV = [
  // libreta de espiral con lápiz
  `<svg viewBox="0 0 200 200"><rect x="48" y="26" width="108" height="150" rx="10" fill="#f6f1e1" stroke="${INK}" stroke-width="5" transform="rotate(-6 100 100)"/>
   <g transform="rotate(-6 100 100)">${[0,1,2,3,4,5].map(i => `<circle cx="48" cy="${44 + i * 23}" r="7" fill="none" stroke="${INK}" stroke-width="4"/>`).join('')}
   ${[0,1,2,3,4].map(i => `<line x1="66" y1="${58 + i * 22}" x2="${140 - (i % 2) * 22}" y2="${58 + i * 22}" stroke="#9aa2b3" stroke-width="4" stroke-linecap="round"/>`).join('')}
   <path d="M70 140 l18 -10 l12 12 l20 -26" fill="none" stroke="#2f6bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
   <g transform="rotate(38 150 120)"><rect x="140" y="40" width="16" height="120" rx="3" fill="#f2c94c" stroke="${INK}" stroke-width="4"/><path d="M140 160 l8 18 l8 -18z" fill="#f6e3b4" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></g></svg>`,
  // pizarra táctica con imanes
  `<svg viewBox="0 0 200 200"><rect x="18" y="34" width="164" height="124" rx="10" fill="#1f3b2c" stroke="${INK}" stroke-width="6"/>
   <rect x="30" y="46" width="140" height="100" fill="none" stroke="#e8efe9" stroke-width="3" opacity=".8"/><line x1="100" y1="46" x2="100" y2="146" stroke="#e8efe9" stroke-width="3" opacity=".8"/>
   <circle cx="100" cy="96" r="16" fill="none" stroke="#e8efe9" stroke-width="3" opacity=".8"/>
   ${[[56,70],[56,122],[78,96],[124,74],[130,118]].map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="9" fill="${i < 3 ? '#2f6bff' : RED}" stroke="${INK}" stroke-width="3"/>`).join('')}
   <path d="M78 96 Q100 70 120 78" fill="none" stroke="#f2f1ec" stroke-width="3" stroke-dasharray="6 6"/><rect x="70" y="160" width="60" height="10" rx="4" fill="${INK}"/></svg>`,
  // hoja de cálculo genérica
  `<svg viewBox="0 0 200 200"><rect x="22" y="30" width="156" height="140" rx="10" fill="#fff" stroke="${INK}" stroke-width="5"/>
   <rect x="22" y="30" width="156" height="24" rx="10" fill="#d9dde6"/><rect x="22" y="44" width="156" height="10" fill="#d9dde6"/>
   ${[0,1,2,3,4].map(i => `<line x1="22" y1="${74 + i * 20}" x2="178" y2="${74 + i * 20}" stroke="#b9c0cc" stroke-width="2"/>`).join('')}
   ${[0,1,2].map(i => `<line x1="${62 + i * 40}" y1="54" x2="${62 + i * 40}" y2="170" stroke="#b9c0cc" stroke-width="2"/>`).join('')}
   <rect x="63" y="75" width="38" height="18" fill="#2f6bff" opacity=".85"/><rect x="103" y="115" width="38" height="18" fill="#2f6bff" opacity=".45"/>
   <rect x="143" y="95" width="34" height="18" fill="${RED}" opacity=".7"/><text x="34" y="47" font-family="M" font-weight="800" font-size="16" fill="${INK}">fx</text></svg>`,
  // chat genérico en un móvil
  `<svg viewBox="0 0 200 200"><rect x="52" y="14" width="96" height="172" rx="16" fill="#11141b" stroke="${INK}" stroke-width="5"/>
   <rect x="60" y="30" width="80" height="140" rx="8" fill="#eef0f4"/>
   <rect x="66" y="40" width="52" height="20" rx="10" fill="#fff" stroke="#c9cfdb" stroke-width="2"/><rect x="84" y="68" width="50" height="20" rx="10" fill="#2f6bff"/>
   <rect x="66" y="96" width="60" height="20" rx="10" fill="#fff" stroke="#c9cfdb" stroke-width="2"/><rect x="66" y="124" width="40" height="20" rx="10" fill="#fff" stroke="#c9cfdb" stroke-width="2"/>
   <circle cx="132" cy="44" r="10" fill="${RED}"/><text x="128" y="49" font-family="M" font-weight="800" font-size="13" fill="#fff">9</text></svg>`];
const NAMES = ['LIBRETA', 'PIZARRA', 'EXCEL', 'WHATSAPP'];
const TL = SV.map(s => mk('div', 'position:absolute;width:400px;height:400px;border-radius:44px;background:#fbfaf6;border:4px solid #d6d2c6;display:none;box-shadow:0 22px 50px rgba(13,15,20,.16);padding:24px', s, $('cards')));
function tile(i, x, y, w, o = {}) {
  const e = TL[i]; show(e, true); e.style.left = (x - w / 2) + 'px'; e.style.top = (y - w / 2) + 'px'; e.style.width = e.style.height = w + 'px';
  e.style.padding = (w * .06) + 'px'; e.style.borderRadius = (w * .11) + 'px';
  e.style.transform = `rotate(${o.r || 0}deg) scale(${o.s || 1})`; e.style.opacity = o.op == null ? 1 : o.op;
  e.style.borderColor = o.hi ? '#2f6bff' : '#d6d2c6'; e.style.boxShadow = o.hi ? '0 0 0 12px rgba(47,107,255,.18),0 22px 50px rgba(13,15,20,.16)' : '0 22px 50px rgba(13,15,20,.16)';
  e.style.zIndex = o.z || 1;
}
const GRID = [[310, 720], [770, 720], [310, 1180], [770, 1180]];

// ── rótulo fijo arriba desde el fotograma 0 (Andrés: «lista» siempre junto a «se cierra») ──
const TOP = mk('div', 'position:absolute;left:0;right:0;top:250px;text-align:center;display:none', `<span style="display:inline-flex;align-items:center;gap:16px;background:#0d0f14;border-radius:999px;padding:16px 30px;font-family:M;font-weight:700;font-size:32px;letter-spacing:.12em;color:#f2f1ec"><span style="width:16px;height:16px;border-radius:50%;background:#2f6bff;display:inline-block"></span>LISTA: SE CIERRA EL 27</span>`);

// ── A · Libreta. Pizarra. Excel. WhatsApp. → 4 SITIOS · 1 equipo ──
const aW = NAMES.map(n => tx(M(n), 1330, 'M8 ink', 170));
const a4 = tx(M('4 SITIOS'), 1440, 'M8 ink', 170);
const a1 = tx(M('<span class="S blue">para 1 equipo.</span>'), 1620, '', 110);
const AT = () => [0, T.piz - .06, T.exc - .06, T.wa - .06, T.cua - .06];
function sA(t) {
  const b = T.si - .04, v = t < b; [...aW, a4, a1].forEach(e => show(e, false)); if (!v) return;
  show($('paper'), true);
  const at = AT(); const g = t >= at[4];
  if (!g) {
    const i = at.findIndex((x, k) => t >= x && t < at[k + 1]);
    const q = E.out5(seg(t, at[i], at[i] + .22));
    tile(i, 540, 790, 640, { s: (i === 0 ? 1 : .9 + .1 * q) * (1 + .03 * seg(t, at[i], at[i + 1])), r: (i % 2 ? 3 : -3) * (1 - q) });
    show(aW[i], true); reveal(aW[i], i === 0 ? 1 : seg(t, at[i], at[i] + .25));
  } else {
    const q = E.out5(seg(t, at[4], at[4] + .45));
    GRID.forEach(([x, y], i) => tile(i, 540 + (x - 540) * q, 790 + (y - 790) * q * .9 - 60 * q, 640 - 250 * q, { r: [-4, 3, 2, -3][i] * q }));
    show(a4, true); reveal(a4, seg(t, at[4], at[4] + .3)); a4.style.transform = `scale(${pulse(t, at[4], .05)})`;
    show(a1, t >= T.equ - .3); reveal(a1, seg(t, T.equ - .3, T.equ + .05));
  }
  const fl = Math.exp(-Math.pow((t - at[4]) / .07, 2)); $('grain').style.opacity = .05 + .12 * fl;
}
// ── B · Si entrenas… nosotros también entrenamos (banquillo vacío del Bernabéu) ──
const bK = tx('<div class="kick" style="color:#e6e8ee;letter-spacing:.26em">SI ENTRENAS,</div>', 720, 'shadow', 46);
const bN = tx(M('<span class="S blue">nosotros</span>'), 790, 'shadow', 200);
const bE = tx(M('TAMBIÉN ENTRENAMOS.'), 1030, 'M8 shadow', 88);
function sB(t) {
  const a = T.si - .04, b = T.cada - .04, v = t >= a && t < b; [bK, bN, bE].forEach(e => show(e, v)); if (!v) return;
  show(RM, true); place(RM, { is: 1.28 - .14 * E.io(seg(t, a, b)), iy: 40 - 60 * seg(t, a, b), org: '50% 70%', dark: .6, z: 2 });
  bK.style.opacity = E.out(seg(t, a, a + .25)); show(bN, t >= T.nos - .1); reveal(bN, seg(t, T.nos - .1, T.nos + .25));
  bN.style.transform = `scale(${pulse(t, T.nos - .1, .05)})`; show(bE, t >= T.entr - .15); reveal(bE, seg(t, T.entr - .15, T.entr + .2));
}
// ── C · cada semana: apuntar · buscar · avisar → SE PIERDE (las fichas se caen) ──
const cK = tx('<div class="kick ink" style="letter-spacing:.24em">CADA SEMANA</div>', 380, '', 46);
const VB = ['apuntar', 'buscar', 'avisar'].map(w => tx(M(`<span class="S" style="color:#0d0f14">${w}</span>`), 1500, '', 150));
const cP = tx(M(`<span style="color:${RED}">SE PIERDE</span>`), 1490, 'M8', 190);
const VT = () => [T.apu - .08, T.bus - .08, T.avi - .08];
const POS = [[300, 760], [780, 740], [320, 1200], [770, 1210]];
function sC(t) {
  const a = T.cada - .04, b = T.buscab - .04, v = t >= a && t < b; [cK, ...VB, cP].forEach(e => show(e, v)); if (!v) return;
  show($('paper'), true); cK.style.opacity = E.out(seg(t, a, a + .25));
  const vt = VT(); const hiI = [0, 2, 3]; const fall = T.perd - .35;
  POS.forEach(([x, y], i) => {
    let k = vt.findIndex((x0, j) => t >= x0 && t < (vt[j + 1] || fall)); const hi = k >= 0 && hiI[k] === i;
    const ft = seg(t, fall + i * .06, fall + i * .06 + .7), dy = 1300 * ft * ft, rr = [-28, 22, -16, 34][i] * ft;
    const jig = Math.sin(t * 2 + i) * 6;
    tile(i, x + [-40, 30, -20, 50][i] * ft, y + jig + dy, 380, { r: [-5, 4, 3, -4][i] + rr, s: hi ? 1.08 * pulse(t, vt[k], .04) : 1, hi, z: hi ? 3 : 1, op: 1 - seg(t, fall + .5, fall + .9) });
