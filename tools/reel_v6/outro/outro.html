<script>
const $=i=>document.getElementById(i),cl=(x)=>Math.min(1,Math.max(0,x)),P=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3);
const g=$('g').getContext('2d'),im=g.createImageData(360,640);let sd=1;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
function show(id,t,a){const k=eo(P(t,a,a+.45));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*24}px)`;$(id).style.filter=`blur(${(1-k)*6}px)`}
window.frame=t=>{sd=1+Math.floor(t*25)*7919;const d=im.data;for(let i=0;i<d.length;i+=4){const v=R()*255;d[i]=v*.8;d[i+1]=v*.85;d[i+2]=v;d[i+3]=255}g.putImageData(im,0,0);
 $('st').style.opacity=P(t,0,.3);show('w',t,.1);show('l1',t,.35);show('l2',t,2.5);show('l3',t,3.6);
 const q=eo(P(t,3.3,3.9));$('ln').style.width=240*q+'px';$('ln').style.left=(540-120*q)+'px'};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
