<script>
const $=id=>document.getElementById(id), W=window.WORDS;

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;          // ease in-out

// cámara: pistas con spline Catmull-Rom (velocidad continua); zoom en escala log
function track(K){return t=>{
  if(t<=K[0][0])return K[0].slice(1); const n=K.length; if(t>=K[n-1][0])return K[n-1].slice(1);
  let i=0;while(K[i+1][0]<t)i++;
  const p0=K[Math.max(0,i-1)],p1=K[i],p2=K[i+1],p3=K[Math.min(n-1,i+2)], h=p2[0]-p1[0], s=io((t-p1[0])/h)*.5+((t-p1[0])/h)*.5;
  const out=[];
  for(let j=1;j<4;j++){const f=j===3?Math.log:(v=>v);
    const y0=f(p0[j]),y1=f(p1[j]),y2=f(p2[j]),y3=f(p3[j]);

    const s2=s*s,s3=s2*s, v=(2*s3-3*s2+1)*y1+(s3-2*s2+s)*m1+(-2*s3+3*s2)*y2+(s3-s2)*m2;
    out.push(j===3?Math.exp(v):v)}

const T={
 euros:at('euros'),lo:at('lo'),en:at('en'),mundial:at('mundial'),jens:at('jens'),consulta:at('consulta'),alemania:at('alemania'),ahora:at('ahora'),
 doce:at('doce'),veinte:at('veinte'),desde:at('desde'),extremos:at('extremos'),contra:at('contraataque'),nadie:at('nadie'),mismo:at('mismo'),
 sitio:at('sitio'),ella:at('ella'),culpa:at('culpa'),dale:at('dale'),seis:at('seis'),una2:at('una',2),gol:at('gol'),desc:at('descanso'),

{const g=$('tal');let k=0;for(const [x,y,n] of Z)for(let j=0;j<n;j++){const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 const xx=x+38+j*26, d=j===3?`M${x+28} ${y+105} L${x+122} ${y+55}`:`M${xx} ${y+40} L${xx+4} ${y+120}`;
 p.setAttribute('d',d);p.setAttribute('pathLength',100);p.setAttribute('stroke-dasharray',100);p.setAttribute('stroke-dashoffset',100);g.appendChild(p);STR.push([p,k++])}}
const CAPS=[[0.05,T.lo-.12,'Este papel se vendió por <b>un millón de euros</b>.'],[T.lo,T.mundial-.1,'Lo llevaba un portero.<br><em>En la media.</em>'],
 [T.jens,T.alemania-.15,'Lehmann lo miraba antes de cada tiro.'],[T.ahora+.15,T.desde-.1,'Ahora piensa en <em>tu portera.</em>'],

 [T.desc,T.tu3-.15,'En el descanso, la zona con más rayas <em>es tu ajuste.</em>'],[T.tu3,T.pero-.08,'Tu papel no vale <em>un millón.</em>'],[T.pero,T.apunt-.2,'Pero el sábado vale <em>un partido.</em>']];
