<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:800;src:url(/tools/fonts/manrope-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(/tools/fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(/tools/fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:S;font-style:italic;font-weight:400;src:url(/tools/fonts/instrument-serif-latin-400-italic.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
.L{position:absolute;inset:0;display:none}
.ph{position:absolute;overflow:hidden;background:#111;display:none;will-change:transform}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .sh{position:absolute;inset:0;pointer-events:none}
.ph.ol{box-shadow:0 30px 60px rgba(0,0,0,.55)}
.tx{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;display:none;color:#fff}
.M8{font-family:M;font-weight:800;letter-spacing:-.045em}
.M7{font-family:M;font-weight:700}
.M5{font-family:M;font-weight:500}
.S{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.blue{color:#4f86ff}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em}
.mask>span{display:inline-block}
.kick{font-family:M;font-weight:700;font-size:40px;letter-spacing:.16em;color:#c9cfdb}
.uline{position:absolute;left:0;right:0;height:10px;background:#2f6bff;transform-origin:0 50%;border-radius:2px}
.shadow{text-shadow:0 4px 30px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.5)}
#grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#sysL{background:#0d0f14}
.node{position:absolute;border:2px solid #2a3040;background:#121620;border-radius:16px;display:none;font-family:M;font-weight:700;color:#aab2c3;font-size:24px;letter-spacing:.12em;text-align:center}
.node b{position:absolute;left:0;right:0;bottom:16px}
.node i{position:absolute;left:18px;top:16px;width:12px;height:12px;border-radius:50%;background:#2f6bff}
.r{position:absolute;display:none;border-radius:10px;background:#151922;border:2px solid #232937;overflow:hidden}
.r.on{background:#1b2b55;border-color:#2f6bff}
.r span{position:absolute;left:12px;top:8px;font-family:M;font-weight:700;font-size:20px;color:#6d7588}
.phone{position:absolute;width:500px;height:1080px;border-radius:64px;background:#0b0d12;border:3px solid #2a3040;padding:16px;display:none;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#f6f6f4}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
/* web (modo oscuro, como pro-team.app) */
#web{background:#0d0f14;font-family:M}
#wp{position:absolute;left:70px;top:0;width:940px}
.pill{display:inline-flex;align-items:center;gap:16px;border:2px solid #262b36;border-radius:999px;padding:16px 28px;font-weight:700;font-size:30px;letter-spacing:.12em;color:#c9cfdb}
.dot{width:16px;height:16px;border-radius:50%;background:#2f6bff;position:relative}
.dot i{position:absolute;inset:0;border-radius:50%;border:3px solid #2f6bff}
.h1x{margin-top:44px;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.05em;color:#f2f1ec}
.h1x .it{color:#4f86ff;font-size:120px}
.cd{display:flex;gap:20px;margin-top:60px}
.cd div{flex:1;background:#151922;border:2px solid #1f2430;border-radius:24px;padding:26px 0 20px;text-align:center}
.cd b{display:block;font-weight:800;font-size:96px;color:#f2f1ec;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-weight:700;font-size:22px;color:#7d8597;letter-spacing:.14em}
#fld{margin-top:56px;height:150px;border-radius:28px;border:3px solid #262b36;background:#11141b;display:flex;align-items:center;padding:0 44px;font-weight:500;font-size:50px;color:#f2f1ec;position:relative}
#fld .ph2{color:#5d6475}
#btn{margin-top:26px;height:160px;border-radius:28px;background:#2f6bff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:52px;letter-spacing:-.02em;position:relative;overflow:hidden;margin-left:auto;margin-right:auto}
#rip{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);display:none}
#spin{width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.3);border-top-color:#fff;display:none}
#ok{display:none;align-items:center;gap:22px}
#okc{width:84px;height:84px}
#cur{position:absolute;width:70px;height:70px;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#note{margin-top:36px;text-align:center;font-weight:500;font-size:36px;color:#7d8597}
#web{z-index:5}
.caret{display:inline-block;width:4px;height:58px;background:#2f6bff;vertical-align:-10px;margin-left:4px}
.ph.clip{border:14px solid #fbfaf6;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ink{color:#0d0f14!important;text-shadow:none!important}
.strike{position:absolute;left:-4%;right:-4%;top:52%;height:16px;background:#2f6bff;transform-origin:0 50%;border-radius:3px}
.vb .node{background:#fbfaf6;border-color:#d6d2c6;color:#0d0f14}
.vb .node div{background:#e4e0d4!important}

.mk{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:#2f6bff;border:5px solid #dfe7ff;display:none;box-shadow:0 8px 22px rgba(47,107,255,.45)}
.att{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#f2f1ec;display:none;box-shadow:0 0 0 10px rgba(242,241,236,.15),0 0 30px rgba(242,241,236,.5)}
</style></head><body>
<div id="st">
  <div class="L" id="sysL"></div>
  <div class="L" id="paper" style="background:#f2f1ec;z-index:0"></div>
  <div id="phs" style="position:absolute;inset:0;z-index:1;isolation:isolate"></div>
  <div id="cards" style="position:absolute;inset:0;z-index:2"></div>
  <div id="phones" style="position:absolute;inset:0;z-index:4"></div>
  <div class="L" id="web"><div id="wp">
    <div class="pill"><span class="dot"><i id="ping"></i></span>LISTA DE ESPERA</div>
    <div class="cd"><div><b id="cd1">09</b><span>DÍAS</span></div><div><b id="cd2">03</b><span>HORAS</span></div><div><b id="cd3">29</b><span>MIN</span></div><div><b id="cd4">59</b><span>SEG</span></div></div>
    <div id="fld"><span id="fldt"><span class="ph2">Tu email</span></span><span class="caret" id="fc" style="opacity:0"></span></div>
    <div id="btn"><div id="rip"></div><span id="btt">Unirme a la lista de espera</span><div id="spin"></div>
      <div id="ok"><svg id="okc" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="239" stroke-dashoffset="239" id="okr"/><path d="M26 43l11 11 21-23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60" id="okp"/></svg><span>Estás dentro</span></div></div>
  </div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22 L15.5 20.6 L12.2 14.2 L19 14 Z" fill="#fff" stroke="#0d0f14" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="txt" style="position:absolute;inset:0;z-index:6"></div>
  <div id="grain"></div>
</div>
<script src="/tools/reel10/times.js"></script>
<script>
const T = window.TIMES; window.DUR = T.END;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: p => 1 - Math.pow(1 - p, 3), out5: p => 1 - Math.pow(1 - p, 5), in: p => p * p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const $ = id => document.getElementById(id);
const show = (el, v) => { el.style.display = v ? (el._d || 'block') : 'none'; };
const IMG = n => `/tools/reel10/img/${n}.jpg`;
const mk = (tag, css, html, parent) => { const d = document.createElement(tag); if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; (parent || $('txt')).appendChild(d); return d; };
function ph(src, pos = '50% 30%') {
  const d = document.createElement('div'); d.className = 'ph';
  const i = document.createElement('img'); i.src = IMG(src); i.style.objectPosition = pos; d.appendChild(i);
  const s = document.createElement('div'); s.className = 'sh'; d.appendChild(s); d._img = i; d._sh = s;
  $('phs').appendChild(d); return d;
}
function place(el, o = {}) {
  el.style.left = '0px'; el.style.top = '0px'; el.style.width = '1080px'; el.style.height = '1920px';
  el.style.opacity = o.op == null ? 1 : o.op; el.style.zIndex = o.z || 1;
  el._img.style.transformOrigin = o.org || '50% 50%';
  el._img.style.transform = `scale(${o.is || 1.06}) translate(${o.ix || 0}px,${o.iy || 0}px)`;
  el._sh.style.background = o.grad || `rgba(0,0,0,${o.dark || 0})`;
}
function tx(html, y, cls, size) { const d = document.createElement('div'); d.className = 'tx ' + cls; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.innerHTML = html; $('txt').appendChild(d); return d; }
function reveal(el, p) { el.querySelectorAll('.mask>span').forEach((s, i, a) => { const q = E.out5(clamp(p * (1 + .25 * (a.length - 1)) - .25 * i)); s.style.transform = `translateY(${(1 - q) * 110}%)`; }); }
const M = s => `<span class="mask"><span>${s}</span></span>`;



// ── 1 · GANCHO: banquillo de la selección (zona de cambios) · «ENTRA A DEFENDER. SALE A ATACAR.» legible desde el fotograma 0 ──
const BQ = ph('banquillo', '47% 50%');
const k1 = tx(`<div class="kick" style="color:#e6e8ee">BALONMANO · INFANTILES</div>`, 1120, 'shadow', 40);
const h1 = tx('ENTRA A DEFENDER.', 1180, 'M8 shadow', 104);
const h2 = tx('SALE A ATACAR.', 1300, 'M8 shadow', 104);
const h3 = tx(M('<span class="S blue">Tiene 12 años.</span>'), 1420, 'shadow', 150);
function hook(t) {
  const b = T.gan - .1, v = t < b; [BQ, k1, h1, h2, h3].forEach(e => show(e, v)); if (!v) return;
  const punch = .05 * E.out5(seg(t, T.sal - .05, T.sal + .25));
  place(BQ, { is: 1.08 + .05 * seg(t, 0, b) + punch, org: '40% 45%', grad: 'linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.35) 52%,rgba(0,0,0,.82) 66%,rgba(0,0,0,.9) 100%)' });
  h2.style.opacity = .55 + .45 * E.out(seg(t, T.sal - .1, T.sal + .15));
  h1.style.opacity = 1 - .45 * E.out(seg(t, T.sal - .1, T.sal + .15));
  show(h3, t >= T.doc - .05); reveal(h3, seg(t, T.doc - .05, T.doc + .3));
  h3.style.transform = `scale(${1 + .05 * Math.exp(-Math.pow((t - T.doc - .2) / .15, 2))})`;
  const out = seg(t, b - .1, b); [BQ, k1, h1, h2, h3].forEach(e => e.style.opacity = Math.min(+(e.style.opacity || 1), 1 - out));
}

// ── 2 y 4 · LA PISTA DESDE ARRIBA: mitad de defensa y mitad de ataque; la ficha 12 se queda en su mitad… y en el partidillo cruza ──
const CX = 190, CY = 640, CW = 700, CH = 1000;
const COURT = mk('div', `position:absolute;left:${CX}px;top:${CY}px;width:${CW}px;height:${CH}px;border:5px solid #3a4152;border-radius:18px;background:#121620;display:none;overflow:hidden`,
  `<div id="hA" style="position:absolute;left:0;top:0;width:100%;height:50%;background:#121620"></div>
   <div id="hD" style="position:absolute;left:0;top:50%;width:100%;height:50%;background:#121620"></div>
   <div id="hatch" style="position:absolute;left:0;top:0;width:100%;height:50%;opacity:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 14px,rgba(0,0,0,0) 14px 30px)"></div>
   <div style="position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2px;background:#3a4152"></div>
   <div style="position:absolute;left:50%;top:-230px;width:460px;height:460px;margin-left:-230px;border:5px solid #3a4152;border-radius:50%"></div>
   <div style="position:absolute;left:50%;bottom:-230px;width:460px;height:460px;margin-left:-230px;border:5px solid #3a4152;border-radius:50%"></div>
   <div id="lA" style="position:absolute;left:0;right:0;top:70px;text-align:center;font-family:M;font-weight:800;font-size:44px;letter-spacing:.16em;color:#6d7588">ATAQUE</div>
   <div id="lD" style="position:absolute;left:0;right:0;bottom:70px;text-align:center;font-family:M;font-weight:800;font-size:44px;letter-spacing:.16em;color:#6d7588">DEFENSA</div>
   <div id="zA" style="position:absolute;left:0;right:0;top:170px;text-align:center;font-family:M;font-weight:800;font-size:96px;color:#8a92a3;opacity:0">0 min</div>`, $('cards'));
const CHIP = mk('div', `position:absolute;left:${CX + CW - 290}px;top:${CY + CH * .53}px;width:250px;height:84px;border-radius:42px;background:#2f6bff;color:#fff;font-family:M;font-weight:800;font-size:40px;line-height:84px;text-align:center;display:none;box-shadow:0 12px 30px rgba(47,107,255,.45)`, '+1 defensa', $('cards'));
const FICHA = mk('div', `position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:#f2f1ec;border:8px solid #4f86ff;color:#0d0f14;font-family:M;font-weight:800;font-size:76px;line-height:134px;text-align:center;display:none;box-shadow:0 14px 34px rgba(0,0,0,.5)`, '12', $('cards'));
const TRAIL = mk('div', 'position:absolute;left:540px;width:8px;margin-left:-4px;border-radius:4px;background:repeating-linear-gradient(180deg,#4f86ff 0 18px,rgba(0,0,0,0) 18px 34px);display:none', '', $('cards'));
const cA = tx(M('Tú ganas una defensa.'), 300, 'M8', 84);
const cB = tx(M('Él se queda sin'), 410, 'M8', 84);
const cC = tx(M('<span class="S blue">medio balonmano.</span>'), 500, '', 112);
function court(t, on) { [COURT, FICHA].forEach(e => show(e, on)); }
function conse(t) {
  const a = T.gan - .1, b = T.eus - .1, v = t >= a && t < b; [cA, cB, cC, CHIP].forEach(e => show(e, v)); if (!v) return;
  show($('sysL'), true); court(t, true);
  const p = E.out5(seg(t, a, a + .4)); COURT.style.opacity = p; COURT.style.transform = `translateY(${(1 - p) * 120}px) scale(${.96 + .04 * p})`;
  FICHA.style.left = '540px'; FICHA.style.top = (CY + CH * .7 + (1 - p) * 120) + 'px'; FICHA.style.opacity = E.out(seg(t, a + .15, a + .4));
  FICHA.style.transform = `scale(${1 + .1 * Math.exp(-Math.pow((t - T.gan - .3) / .15, 2))})`;
  reveal(cA, seg(t, a, a + .3));
  const d = E.out(seg(t, T.gan + .2, T.gan + .5)); $('hD').style.background = `rgba(47,107,255,${.28 * d})`; $('lD').style.color = d > .5 ? '#9db8ff' : '#6d7588';
  CHIP.style.opacity = d; CHIP.style.transform = `translateY(${(1 - d) * 30}px) scale(${.9 + .1 * d})`;
  show(cB, t >= T.med - .1); reveal(cB, seg(t, T.med - .1, T.med + .2)); show(cC, t >= T.med + .5); reveal(cC, seg(t, T.med + .5, T.med + .85));
  const g = E.out(seg(t, T.med + .5, T.med + .9)); $('hatch').style.opacity = g; $('hA').style.background = `rgba(0,0,0,${.35 * g})`; $('zA').style.opacity = g; $('lA').style.opacity = 1 - .5 * g;
  const out = seg(t, b - .12, b); [COURT, FICHA, cA, cB, cC, CHIP].forEach(e => e.style.opacity = Math.min(+(e.style.opacity || 1), 1 - out));
}

// ── 3 · LA NORMA (papel): Juegos Escolares de Euskadi, infantil · NO PERMITIDO ──
const DOC = mk('div', 'position:absolute;left:110px;top:560px;width:860px;height:760px;background:#fbfaf6;border:3px solid #d6d2c6;border-radius:22px;box-shadow:0 30px 60px rgba(0,0,0,.18);display:none',
  `<div style="position:absolute;left:60px;top:60px;font-family:M;font-weight:700;font-size:30px;letter-spacing:.14em;color:#6d6a60">JUEGOS ESCOLARES DE EUSKADI</div>
   <div style="position:absolute;left:60px;top:108px;font-family:M;font-weight:700;font-size:30px;letter-spacing:.14em;color:#6d6a60">BALONMANO · INFANTIL · 2025</div>
   <div style="position:absolute;left:60px;right:60px;top:170px;height:3px;background:#e1ddd1"></div>
   <div style="position:absolute;left:60px;top:220px;font-family:M;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.02;color:#0d0f14">Cambio<br>ataque-defensa</div>
   ${[0, 1, 2].map(r => `<div style="position:absolute;left:60px;width:${[640, 700, 520][r]}px;top:${440 + r * 46}px;height:14px;border-radius:7px;background:#e4e0d4"></div>`).join('')}
   <div id="stamp" style="position:absolute;left:150px;top:560px;padding:14px 34px;border:8px solid #2f6bff;border-radius:16px;color:#2f6bff;font-family:M;font-weight:800;font-size:72px;letter-spacing:.04em;transform:rotate(-6deg);opacity:0">NO PERMITIDO</div>`, $('cards'));
const nK = tx(`<div class="kick ink" style="color:#0d0f14">${M('LA NORMA')}</div>`, 400, '', 40);
const nN = tx(`<div class="M5" style="font-size:34px;color:#6d6a60">Normativa de Euskadi. En otras federaciones cambia.</div>`, 1400, '', 34);
function norma(t) {
  const a = T.eus - .1, b = T.sem - .1, v = t >= a && t < b; [DOC, nK, nN].forEach(e => show(e, v)); if (!v) return;
  show($('paper'), true);
  const p = E.out5(seg(t, a, a + .4)); DOC.style.opacity = p; DOC.style.transform = `translateY(${(1 - p) * 140}px) rotate(${(1 - p) * 3}deg) scale(${1 + .03 * seg(t, a, b)})`;
  reveal(nK, seg(t, a + .05, a + .35)); nN.style.opacity = E.out(seg(t, a + .4, a + .7));
  const sT = T.per + .55, s = E.out5(seg(t, sT, sT + .2)), st = $('stamp');
  st.style.opacity = s; st.style.transform = `rotate(-6deg) scale(${1.6 - .6 * s})`;
  DOC.style.transform += ` translate(${Math.exp(-Math.pow((t - sT - .2) / .06, 2)) * 6}px,0)`;
  const out = seg(t, b - .12, b); [DOC, nK, nN].forEach(e => e.style.opacity = Math.min(+(e.style.opacity || 1), 1 - out));
}

// ── 4 · FICHA PARA GUARDAR: esta semana, en el partidillo, quien defiende ataca la siguiente (la ficha 12 cruza) ──
const fK = tx(`<div class="kick">${M('ESTA SEMANA · EN EL PARTIDILLO')}</div>`, 300, '', 40);
const f1 = tx(M('Quien defiende,'), 360, 'M8', 92);
const f2 = tx(M('<span class="S blue">ataca la siguiente.</span>'), 466, '', 120);
const fN = mk('div', `position:absolute;left:${CX}px;top:${CY + CH + 40}px;width:${CW}px;text-align:center;font-family:M;font-weight:700;font-size:40px;color:#c9cfdb;display:none`, 'Nadie sale al recuperar.');
function ficha(t) {
  const a = T.sem - .1, b = T.ald - .1, v = t >= a && t < b; [fK, f1, f2, fN, TRAIL].forEach(e => show(e, v)); if (!v) return;
  show($('sysL'), true); court(t, true); show(CHIP, false);
  $('hatch').style.opacity = 0; $('hA').style.background = '#121620'; $('zA').style.opacity = 0; $('lA').style.opacity = 1;
  const p = E.out5(seg(t, a, a + .35)); COURT.style.opacity = p; COURT.style.transform = `translateY(${(1 - p) * 60}px)`;
  reveal(fK, seg(t, a, a + .3)); show(f1, t >= T.qui - .1); reveal(f1, seg(t, T.qui - .1, T.qui + .2)); show(f2, t >= T.ata - .1); reveal(f2, seg(t, T.ata - .1, T.ata + .25));
  const d = E.out(seg(t, T.qui - .05, T.qui + .3)); $('hD').style.background = `rgba(47,107,255,${.28 * d})`; $('lD').style.color = d > .5 ? '#9db8ff' : '#6d7588';
  const c = E.io(seg(t, T.ata - .05, T.ata + .65)); const y0 = CY + CH * .7, y1 = CY + CH * .3;
  FICHA.style.left = '540px'; FICHA.style.top = (y0 + (y1 - y0) * c) + 'px'; FICHA.style.opacity = p;
  FICHA.style.transform = `scale(${1 + .12 * Math.sin(c * Math.PI)})`;
